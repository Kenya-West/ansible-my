---
# defaults file for roles/configure_powershell_profile
project_dir: "{{ general_vps_prepare.project.paths.pwsh | ansible.builtin.basename }}"
project_root_dir: "{{ general_vps_prepare.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/.config/pwsh"
dest_path_full: "{{ dest_path_root }}/Microsoft.PowerShell_profile.ps1"

powershell_profile_source_path: Microsoft.PowerShell_profile.ps1.j2