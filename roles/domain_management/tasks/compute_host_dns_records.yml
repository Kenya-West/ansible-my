---
# Computes the DNS records the CURRENT host declares (`cf_set_targets`). Shared by
# the set, delete and host-validation scenarios so "which records belong to this
# host" is defined in exactly one place.
#
# Requires (from dns_resolve_context.yml):
#   provider_tokens, dns_hosting_record_types_resolved, dns_hosting_record_ttl_resolved,
#   dns_hosting_record_proxied_resolved, dns_records_comment.
# Produces (per host, on localhost): selected_dns_records, cf_set_targets.
#
# Source records (mutually exclusive):
#   * `dns_records_override`, when defined; otherwise
#   * `remap_dns_records_domains` (from the reusable kwtoolset/remap_dns_records
#     role, derived from this host's `domains_keys`) + `dns_records_addition`.
#
# Entry keys mirror `community.general.cloudflare_dns`, except:
#   * `dns_provider` selects the provider whose api_token is used (dropped after);
#   * `state` is ignored (dropped);
#   * `name` becomes `record` and `zone` is derived from it (left-most label
#     stripped, mirroring remap_dns_records_root_domains);
#   * a missing `value` defaults to the host's address (`ansible_host`);
#   * `proxied` defaults to `dns_hosting_record_proxied`;
#   * `ttl` resolves as: the `domains_settings.explicit` entry for the name >
#     the record's own `ttl` > `domains_settings.defaults` > `dns_hosting_record_ttl`
#     (`auto` means Cloudflare's automatic TTL, i.e. 1);
#   * `records_limit` is the policy limit for the name + type, from the matching
#     `domains_settings.explicit` entry, else `domains_settings.defaults`, else -1
#     (unlimited);
#   * `comment` is always the `dns_hosting_tags` comment (marks the record as managed).

- name: Produce records from domains_keys via the reusable remap_dns_records role
  ansible.builtin.include_role:
    name: kwtoolset/remap_dns_records
    public: true
  vars:
    # The role's task assigns `dns_records: {{ remap_dns_records }}`; feed it the
    # computed list so the include succeeds. We consume `remap_dns_records_domains`.
    remap_dns_records: "{{ remap_dns_records_domains }}"
  when: dns_records_override is not defined
  tags:
    - always

- name: Choose the source DNS records for this host
  ansible.builtin.set_fact:
    source_dns_records: >-
      {{
        dns_records_override if dns_records_override is defined
        else (remap_dns_records_domains + (dns_records_addition | default([])))
      }}
  delegate_to: localhost
  tags:
    - always

- name: Keep only records of an allowed type and a known Cloudflare provider
  ansible.builtin.set_fact:
    selected_dns_records: >-
      {{ source_dns_records
         | selectattr('type', 'in', dns_hosting_record_types_resolved)
         | selectattr('dns_provider', 'in', provider_tokens.keys() | list)
         | list }}
  delegate_to: localhost
  tags:
    - always

- name: Reset the computed record list for this host
  ansible.builtin.set_fact:
    cf_set_targets: []
  delegate_to: localhost
  tags:
    - always

- name: Build the declared record entries
  ansible.builtin.set_fact:
    cf_set_targets: "{{ cf_set_targets + [_args] }}"
  loop: "{{ selected_dns_records }}"
  loop_control:
    loop_var: rec
    label: "{{ rec.type }} {{ rec.name }}"
  vars:
    # Zone = record name minus its left-most label (mirrors remap_dns_records).
    _zone: "{{ rec.name | regex_replace('^[^.]+[.]', '') }}"
    _value: "{{ rec.value | default(dns_hosting_record_value | default(ansible_host | default(inventory_hostname))) }}"
    _settings_defaults: "{{ domains_settings.defaults | default({}) }}"
    _settings_explicit: >-
      {{ domains_settings.explicit | default([])
         | selectattr('name', 'equalto', rec.name) | first | default({}) }}
    _limit: >-
      {{ _settings_explicit.records_limit | default([])
         | selectattr('type', 'equalto', rec.type) | map(attribute='limit') | first
         | default(_settings_defaults.records_limit | default([])
                   | selectattr('type', 'equalto', rec.type) | map(attribute='limit') | first
                   | default(-1)) }}
    _ttl: >-
      {{ _settings_explicit.ttl
         | default(rec.ttl
         | default(_settings_defaults.ttl
         | default(dns_hosting_record_ttl_resolved))) }}
    _args: >-
      {{
        rec
        | combine({
            'record': rec.name,
            'zone': _zone,
            'value': _value,
            'ttl': 1 if (_ttl | string) == 'auto' else (_ttl | int),
            'proxied': rec.proxied | default(dns_hosting_record_proxied_resolved) | bool,
            'records_limit': _limit | int,
            'comment': dns_records_comment,
            'api_token': provider_tokens[rec.dns_provider],
          })
        | dict2items
        | rejectattr('key', 'in', ['name', 'dns_provider', 'state'])
        | items2dict
      }}
  delegate_to: localhost
  tags:
    - always
