---
# Reads (never mutates) every DNS record of the Cloudflare zones that host any of
# the `managed_domains`. `community.general.cloudflare_dns` only *manages* records,
# so we call the Cloudflare v4 REST API directly with `ansible.builtin.uri`.
#
# Shared by scenarios that need the current DNS state (get_all, host validation).
# All records are collected regardless of type; callers filter as needed.
#
# Requires (from dns_resolve_context.yml): cloudflare_providers, managed_domains.
# Produces (run_once, group-wide, on localhost):
#   * cf_relevant_zones  (zones hosting a managed domain, tagged with _cf_provider/_cf_domains)
#   * cloudflare_records (every record of those zones, tagged with _zone/_provider)

# --- List zones (paginated) -------------------------------------------------

- name: Fetch the first page of Cloudflare zones for every provider
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?per_page=50&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ provider.api_token }}"
    return_content: false
  loop: "{{ cloudflare_providers }}"
  loop_control:
    loop_var: provider
    label: "{{ provider.name }}"
  register: cf_zones_page1
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  when: managed_domains | length > 0
  tags:
    - always

- name: Compute the remaining zone pages that still need to be fetched
  ansible.builtin.set_fact:
    cf_extra_page_requests: >-
      {{
        cf_extra_page_requests | default([])
        + ([r.provider]
           | product(range(2, (r.json.result_info.total_pages | int) + 1) | list)
           | list)
      }}
  loop: "{{ cf_zones_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.provider.name }}"
  run_once: true
  delegate_to: localhost
  when: managed_domains | length > 0
  tags:
    - always

- name: Fetch the remaining pages of Cloudflare zones
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?per_page=50&page={{ item.1 }}"
    method: GET
    headers:
      Authorization: "Bearer {{ item.0.api_token }}"
    return_content: false
  loop: "{{ cf_extra_page_requests | default([]) }}"
  loop_control:
    loop_var: item
    label: "{{ item.0.name }} (page {{ item.1 }})"
  register: cf_zones_extra
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Reset the accumulated zone list
  ansible.builtin.set_fact:
    cf_zones: []
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Collect zones from the first page, tagging each with its provider
  ansible.builtin.set_fact:
    cf_zones: >-
      {{ cf_zones + (r.json.result | map('combine', {'_cf_provider': r.provider}) | list) }}
  loop: "{{ cf_zones_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.provider.name }}"
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Collect zones from the remaining pages, tagging each with its provider
  ansible.builtin.set_fact:
    cf_zones: >-
      {{ cf_zones + (r.json.result | map('combine', {'_cf_provider': r.item.0}) | list) }}
  loop: "{{ cf_zones_extra.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.item.0.name }} (page {{ r.item.1 }})"
  run_once: true
  delegate_to: localhost
  tags:
    - always

# --- Match zones to managed domains ----------------------------------------

- name: Keep only zones that host at least one managed domain
  ansible.builtin.set_fact:
    cf_relevant_zones: >-
      {{ cf_relevant_zones | default([]) + [zone | combine({'_cf_domains': _zone_domains})] }}
  loop: "{{ cf_zones | default([]) }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.name }}"
  vars:
    # A managed domain belongs to this zone when it equals the zone apex (`^`)
    # or is a sub-domain of it (leading dot).
    _zone_domains: >-
      {{ managed_domains
         | select('search', '(^|\.)' ~ (zone.name | regex_escape) ~ '$')
         | list }}
  when: _zone_domains | length > 0
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Warn about managed domains not found in any Cloudflare zone
  ansible.builtin.debug:
    msg: >-
      These managed domains were not found in any accessible Cloudflare zone:
      {{ managed_domains | difference(cf_relevant_zones | default([]) | map(attribute='_cf_domains') | flatten | unique) }}
  when:
    - managed_domains | length > 0
    - (managed_domains | difference(cf_relevant_zones | default([]) | map(attribute='_cf_domains') | flatten | unique)) | length > 0
  run_once: true
  delegate_to: localhost
  tags:
    - always

# --- Read every record of each relevant zone (paginated) --------------------

- name: Show the unique root domains (Cloudflare zones) that will be read
  ansible.builtin.debug:
    msg: >-
      Reading every record from these root domains:
      {{ cf_relevant_zones | default([]) | map(attribute='name') | unique | list }}
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Fetch the first page of DNS records for each relevant zone
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ zone.id }}/dns_records?per_page=100&page=1
    method: GET
    headers:
      Authorization: "Bearer {{ zone._cf_provider.api_token }}"
    return_content: false
  loop: "{{ cf_relevant_zones | default([]) }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.name }}"
  register: cf_records_page1
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Compute the remaining record pages that still need to be fetched
  ansible.builtin.set_fact:
    cf_record_extra_requests: >-
      {{
        cf_record_extra_requests | default([])
        + ([r.zone]
           | product(range(2, (r.json.result_info.total_pages | int) + 1) | list)
           | list)
      }}
  loop: "{{ cf_records_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.zone.name }}"
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Fetch the remaining pages of DNS records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ item.0.id }}/dns_records?per_page=100&page={{ item.1 }}
    method: GET
    headers:
      Authorization: "Bearer {{ item.0._cf_provider.api_token }}"
    return_content: false
  loop: "{{ cf_record_extra_requests | default([]) }}"
  loop_control:
    loop_var: item
    label: "{{ item.0.name }} (page {{ item.1 }})"
  register: cf_records_extra
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Reset the accumulated record list
  ansible.builtin.set_fact:
    cloudflare_records: []
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Collect records from the first pages, tagging zone and provider
  ansible.builtin.set_fact:
    cloudflare_records: >-
      {{
        cloudflare_records
        + (r.json.result
           | map('combine', {'_zone': r.zone.name, '_provider': r.zone._cf_provider.name})
           | list)
      }}
  loop: "{{ cf_records_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.zone.name }}"
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Collect records from the remaining pages, tagging zone and provider
  ansible.builtin.set_fact:
    cloudflare_records: >-
      {{
        cloudflare_records
        + (r.json.result
           | map('combine', {'_zone': r.item.0.name, '_provider': r.item.0._cf_provider.name})
           | list)
      }}
  loop: "{{ cf_records_extra.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.item.0.name }} (page {{ r.item.1 }})"
  run_once: true
  delegate_to: localhost
  tags:
    - always
