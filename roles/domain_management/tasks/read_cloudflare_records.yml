---
# Reads (never mutates) the Ansible-managed DNS records of the Cloudflare zones
# that host any of the `managed_domains`. Only records whose comment carries the
# `dns_hosting_tags` primary filter are read:
#
#   GET /zones/{zone_id}/dns_records?comment.contains=managed-by%3Dansible
#
# Records created outside Ansible (no tag in the comment) are invisible to every
# scenario built on this file. All matching records are collected regardless of
# type; callers filter as needed.
#
# Requires (from dns_resolve_context.yml):
#   cloudflare_providers, managed_domains, dns_primary_filter_query, dns_primary_filter_regex.
# Produces (run_once, group-wide, on localhost):
#   * cf_zones           (every accessible zone, see read_cloudflare_zones.yml)
#   * cf_relevant_zones  (zones hosting a managed domain, tagged with _cf_provider/_cf_domains)
#   * cloudflare_records (managed records of those zones, tagged with _zone/_provider)

- name: List the accessible Cloudflare zones
  ansible.builtin.include_tasks: read_cloudflare_zones.yml
  tags:
    - always

# --- Match zones to managed domains ----------------------------------------

- name: Reset the relevant zone list
  ansible.builtin.set_fact:
    cf_relevant_zones: []
  run_once: true
  delegate_to: localhost
  tags:
    - always

# `dns_read_all_zones: true` keeps every accessible zone (used by the sync
# scenario to find records in zones no declared domain points at any more).
- name: Keep only zones that host at least one managed domain
  ansible.builtin.set_fact:
    cf_relevant_zones: >-
      {{ cf_relevant_zones + [zone | combine({'_cf_domains': _zone_domains})] }}
  loop: "{{ cf_zones | default([]) }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.name }}"
  vars:
    # A managed domain belongs to this zone when it equals the zone apex (`^`)
    # or is a sub-domain of it (leading dot).
    _zone_domains: >-
      {{ managed_domains
         | select('search', '(^|\.)' ~ (zone.name | regex_escape) ~ '$')
         | list }}
  when: (dns_read_all_zones | default(false) | bool) or (_zone_domains | length > 0)
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Warn about managed domains not found in any Cloudflare zone
  ansible.builtin.debug:
    msg: >-
      These managed domains were not found in any accessible Cloudflare zone:
      {{ managed_domains | difference(cf_relevant_zones | map(attribute='_cf_domains') | flatten | unique) }}
  when:
    - managed_domains | length > 0
    - (managed_domains | difference(cf_relevant_zones | map(attribute='_cf_domains') | flatten | unique)) | length > 0
  run_once: true
  delegate_to: localhost
  tags:
    - always

# --- Read the managed records of each relevant zone (paginated) -------------

- name: Show the unique root domains (Cloudflare zones) that will be read
  ansible.builtin.debug:
    msg: >-
      Reading records tagged `{{ dns_primary_filter }}` from these root domains:
      {{ cf_relevant_zones | map(attribute='name') | unique | list }}
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Fetch the first page of managed DNS records for each relevant zone
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ zone.id }}/dns_records?{{ dns_primary_filter_query }}&per_page=100&page=1
    method: GET
    headers:
      Authorization: "Bearer {{ zone._cf_provider.api_token }}"
    return_content: false
  loop: "{{ cf_relevant_zones }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.name }}"
  register: cf_records_page1
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Reset the remaining record page requests
  ansible.builtin.set_fact:
    cf_record_extra_requests: []
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Compute the remaining record pages that still need to be fetched
  ansible.builtin.set_fact:
    cf_record_extra_requests: >-
      {{
        cf_record_extra_requests
        + ([r.zone]
           | product(range(2, (r.json.result_info.total_pages | int) + 1) | list)
           | list)
      }}
  loop: "{{ cf_records_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.zone.name }}"
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Fetch the remaining pages of managed DNS records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ zone.0.id }}/dns_records?{{ dns_primary_filter_query }}&per_page=100&page={{ zone.1 }}
    method: GET
    headers:
      Authorization: "Bearer {{ zone.0._cf_provider.api_token }}"
    return_content: false
  loop: "{{ cf_record_extra_requests }}"
  loop_control:
    loop_var: zone
    label: "{{ zone.0.name }} (page {{ zone.1 }})"
  register: cf_records_extra
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Reset the accumulated record list
  ansible.builtin.set_fact:
    cloudflare_records: []
  run_once: true
  delegate_to: localhost
  tags:
    - always

# `comment.contains` is a substring match; `_managed` keeps only records whose
# comment holds the primary filter as a whole tag (e.g. not `managed-by=ansible-old`).

- name: Collect managed records from the first pages, tagging zone and provider
  ansible.builtin.set_fact:
    cloudflare_records: >-
      {{
        cloudflare_records
        + (_managed | map('combine', {'_zone': r.zone.name, '_provider': r.zone._cf_provider.name}) | list)
      }}
  loop: "{{ cf_records_page1.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.zone.name }}"
  vars:
    _managed: >-
      {{ r.json.result
         | selectattr('comment', 'string')
         | selectattr('comment', 'search', dns_primary_filter_regex)
         | list }}
  run_once: true
  delegate_to: localhost
  tags:
    - always

- name: Collect managed records from the remaining pages, tagging zone and provider
  ansible.builtin.set_fact:
    cloudflare_records: >-
      {{
        cloudflare_records
        + (_managed | map('combine', {'_zone': r.zone.0.name, '_provider': r.zone.0._cf_provider.name}) | list)
      }}
  loop: "{{ cf_records_extra.results | default([]) }}"
  loop_control:
    loop_var: r
    label: "{{ r.zone.0.name }} (page {{ r.zone.1 }})"
  vars:
    _managed: >-
      {{ r.json.result
         | selectattr('comment', 'string')
         | selectattr('comment', 'search', dns_primary_filter_regex)
         | list }}
  run_once: true
  delegate_to: localhost
  tags:
    - always
