---
# tasks file for roles/install_webfeatures_certcopy
- name: Capture this role's path so nested role can use the parent role_path
  ansible.builtin.set_fact:
    this_role_path: "{{ role_path }}"
  tags:
    - always

- name: "Create non-existent parent directories for {{ dest_path_full }}"
  ansible.builtin.include_role:
    name: kwtoolset/create_dirs_traversal
    apply:
      tags:
        - update_config_hard
  vars:
    create_dirs_traversal_path: "{{ dest_path_full }}"
    create_dirs_traversal_strip_leaf: true
    create_dirs_force_mode: "0775"
  tags:
    - update_config_hard

- name: copy_files_templating
  ansible.builtin.include_role:
    name: kwtoolset/copy_files_templating
    apply:
      tags:
        - update_config_hard
        - update_config_soft
  vars:
    copy_files_templating_dir_list:
      - src: "{{ this_role_path }}/templates/"
        dest: "{{ dest_path_full }}"
        default_mode: "0775"
  tags:
    - update_config_hard
    - update_config_soft

- name: Ensure project's directories have recursive permissions set to 0775
  become: true
  ansible.builtin.file:
    path: "{{ dest_path_full }}"
    state: directory
    mode: "0775"
    recurse: true

# GROUP, SSL DIRECTORY AND PERMISSIONS
- name: Create {{ cert_access_group }} group
  become: true
  become_user: root
  ansible.builtin.group:
    name: "{{ cert_access_group }}"
    state: present

- name: Add users to {{ cert_access_group }} group
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ cert_access_group }}"
    append: true
  with_items: "{{ cert_access_group_users }}"

- name: Create {{ cert_location_root_path }} directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ cert_location_root_path }}"
    state: directory
    owner: "{{ cert_location_root_owner }}"
    group: "{{ cert_access_group }}"
    mode: "{{ cert_location_root_permissions }}"

# CERTCOPY SCRIPT

- name: Verify if copy.sh exists
  ansible.builtin.stat:
    path: "{{ dest_path_full }}/scripts/copy.sh"
  register: update_script_exists

- name: Fail if copy.sh does not exist
  ansible.builtin.fail:
    msg: "The copy.sh script does not exist at {{ dest_path_full }}/scripts/copy.sh"
  when: update_script_exists.stat.exists == false

- name: Create root-owned certificate helper directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ certcopy_helper_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install root-owned certificate copy helper
  become: true
  become_user: root
  ansible.builtin.template:
    src: scripts/copy.sh.j2
    dest: "{{ certcopy_helper_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Allow only the root-owned certificate copy helper without a password or TTY
  become: true
  become_user: root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible-certcopy
    content: |
      Defaults:{{ certcopy_user }} !requiretty
      {{ certcopy_user }} ALL=(root) NOPASSWD: {{ certcopy_helper_path }} ""
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install certificate copy service and timer
  ansible.builtin.include_tasks:
    file: systemd.yml
    apply:
      tags: [update_config_hard, update_systemd_timer]
  tags:
    - update_config_hard
    - update_systemd_timer

- name: Run certcopy job now through the user service
  become: true
  become_user: "{{ certcopy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[certcopy_user][1] }}"
  ansible.builtin.systemd_service:
    name: "{{ certcopy_unit_name }}.service"
    scope: user
    state: started
