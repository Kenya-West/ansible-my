---
# defaults file for roles/install_webfeatures_certcopy
project_dir: "{{ webfeatures.project.paths.certcopy | ansible.builtin.basename }}"
project_root_dir: "{{ webfeatures.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ webfeatures.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

cert_access_group: "certaccess"
cert_access_group_users_initial:
  - "{{ standard_user }}"
cert_location_root_owner: "root"
cert_location_root_permissions: "0755"
cert_location_files_permissions: "0644"
certcopy_user: "{{ standard_user }}"
certcopy_home: "/home/{{ certcopy_user }}"
certcopy_systemd_unit_path: "{{ certcopy_home }}/.config/systemd/user"
certcopy_unit_name: certcopy
certcopy_calendar: "*-*-* 00:00:00"
certcopy_randomized_delay: "0"
certcopy_timeout: "30min"
# This privileged helper must stay outside user-writable project directories.
certcopy_helper_dir: /usr/local/libexec/ansible-certcopy
certcopy_helper_path: "{{ certcopy_helper_dir }}/copy.sh"
certcopy_migrate_legacy_cron: true
