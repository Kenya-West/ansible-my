---
# defaults file for roles/kwtoolset/remap_caddy_cert_path

remap_caddy_cert_path: >-
  {%- set out = {} -%}
  {%- for key, domain in domains_keys.items() if domain is string -%}
  {%-   set _ = out.update({key: domain, key ~ '_crt': domain ~ '/' ~ domain ~ '.crt',
                          key ~ '_key': domain ~ '/' ~ domain ~ '.key'}) -%}
  {%- endfor -%}
  {{ out }}
