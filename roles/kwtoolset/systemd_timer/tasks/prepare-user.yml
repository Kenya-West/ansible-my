---
- name: Enable user services after logout and reboot
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ timer_user }}"]
    creates: "/var/lib/systemd/linger/{{ timer_user }}"

- name: Start user service manager
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "user@{{ ansible_facts.getent_passwd[timer_user][1] }}.service"
    state: started
