- name: Gather existing file/directory ownership on path {{ path.dest}}
  ansible.builtin.stat:
    path: "{{ path.dest }}"
  register: copy_files_templating_remote_stat

- name: Copy files recursively (no templating) {{ path.src }}
  become: true
  ansible.builtin.copy:
    src: "{{ path.src }}"
    dest: "{{ path.dest }}"
    mode: "{{ path.default_mode | default(copy_files_templating_remote_stat.stat.mode) | default('0775') }}"
    directory_mode: "{{ path.default_mode | default(copy_files_templating_remote_stat.stat.mode) | default('0775') }}"
    # Only set owner/group for remote hosts
    owner: "{{ (inventory_hostname not in ['localhost', '127.0.0.1']) | ternary(path.default_owner | default(copy_files_templating_remote_stat.stat.pw_name) | default(standard_user), omit) }}"
    group: "{{ (inventory_hostname not in ['localhost', '127.0.0.1']) | ternary(path.default_group | default(copy_files_templating_remote_stat.stat.gr_name) | default(standard_user), omit) }}"

- name: Empty variables
  ansible.builtin.set_fact:
    copy_files_templating_remote_stat: {}
  when: copy_files_templating_remote_stat is defined
