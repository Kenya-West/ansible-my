- name: Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    suffix: copy_files_templating_
  register: copy_files_templating_temp_dir
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Copy files recuresively with templating {{ path.src }}
  template_tree:
    src: "{{ path.src }}"
    dest: "{{ copy_files_templating_temp_dir.path }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Find all files that are less/more or equal to limit (in bytes)
  ansible.builtin.find:
    paths: "{{ copy_files_templating_temp_dir.path }}"
    size: "{{ copy_files_templating_remove_files_size_less_or_equal_than }}"
    recurse: true
  register: copy_files_templating_files_to_remove
  when:
    - copy_files_templating_remove_files_size_less_or_equal_than is defined
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Remove files
  ansible.builtin.file:
    path: "{{ path.path }}"
    state: absent
  loop: "{{ copy_files_templating_files_to_remove.files }}"
  when:
    - copy_files_templating_files_to_remove.files | default([]) | length > 0
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Create a directory path if it does not exist
  ansible.builtin.file:
    path: "{{ path.dest }}"
    state: directory
    mode: "{{ (path.default_mode_directory | default(path.default_mode | default(755) | int)) }}"

- name: Build rsync_opts list
  ansible.builtin.set_fact:
    copy_files_templating_rsync_opts:
      - "--chmod=F{{ (path.default_mode_file | default(path.default_mode | default(755) | int)) }}"
      - "--chmod=D{{ (path.default_mode_directory | default(path.default_mode | default(755) | int)) }}"

- name: Add exclusions to rsync_opts list
  ansible.builtin.set_fact:
    copy_files_templating_rsync_opts: "{{ copy_files_templating_rsync_opts + ['--exclude=' + (copy_files_templating_exclude_list | join(','))] }}"
  when: copy_files_templating_exclude_list | length > 0

- name: Synchronize templated files to remote host {{ path.dest }} (with retries)
  ansible.builtin.include_tasks: sync_retry.yml

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ copy_files_templating_temp_dir.path }}"
    state: absent
  when:
    - copy_files_templating_temp_dir.path is defined
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
