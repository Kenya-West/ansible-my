---
pgdump_backup_user: "{{ standard_user }}"
pgdump_backup_home: "/home/{{ pgdump_backup_user }}"
pgdump_manifest_dir: "{{ pgdump_backup_home }}/.config/ansible-backup/postgres.d"
pgdump_runner_path: "{{ pgdump_backup_home }}/.local/lib/ansible-backup/postgres_backup.py"
pgdump_systemd_unit_path: "{{ pgdump_backup_home }}/.config/systemd/user"
pgdump_backup_location_root_path: /etc/postgres/db_backup
pgdump_backup_python: /usr/bin/python3
pgdump_backup_calendar: "*-*-* 00:00:00 UTC"
pgdump_backup_randomized_delay: 15min
pgdump_backup_timeout: 1h
# Empty means use the user's normal Docker CLI configuration/current context.
# Set only one of these if the interactive shell selects an endpoint via env.
pgdump_backup_docker_host: ""
pgdump_backup_docker_context: ""

# Optional dependency in the user's systemd manager. Rootless does not imply
# a unit named docker.service; normally connect directly to the Docker socket.
pgdump_backup_docker_unit: ""
# Optional monitoring command as an argv list (not shell syntax).
pgdump_backup_monitor_argv: []
# Required only to migrate the old root-owned cron jobs/dump directory.
pgdump_migrate_legacy: true
pgdump_legacy_script_directory: "{{ pgdump_backup_home }}/{{ (backup_restic_node | default({'project': {'root': 'backup-restic-node'}})).project.root }}/postgres/"
