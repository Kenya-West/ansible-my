---
# Generate random passwords as facts, on the controller, for the templates of
# the roles under roles/setup/. Nothing is logged.
#
# Inputs:
#   setup_generate_passwords                list of {name, length (optional)}
#   setup_generate_passwords_length         length of a password without its own (50)
#   setup_generate_passwords_special_chars  special characters allowed (-=+!#$()[])
#   setup_generate_passwords_prefix         prefix of the facts
#                                           (initial_configure_generated_password_)

- name: Generate the passwords the templates use
  ansible.builtin.set_fact:
    "{{ setup_generate_passwords_prefix | default('initial_configure_generated_password_') }}{{ item.name }}": >-
      {{ lookup('community.general.random_string',
                length=item.length | default(setup_generate_passwords_length | default(50)) | int,
                min_lower=1, min_upper=1, min_numeric=1, min_special=1,
                override_special=setup_generate_passwords_special_chars | default('-=+!#$()[]')) }}
  loop: "{{ setup_generate_passwords }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
