---
# Look at what the inventory already holds, so that the prompts can check the
# new host against it and suggest defaults: the hostnames and addresses in
# use, the base domains of the existing hosts and their location indexes.

- name: Ensure {{ setup_node_host_vars_dir }} exists
  ansible.builtin.file:
    path: "{{ setup_node_host_vars_dir }}"
    state: directory
    mode: "0775"

- name: Find the existing host_vars directories
  ansible.builtin.find:
    paths: "{{ setup_node_host_vars_dir }}"
    file_type: directory
    recurse: false
  register: __setup_node_host_dirs

- name: Find the domain files of the existing hosts
  ansible.builtin.find:
    paths: "{{ setup_node_host_vars_dir }}"
    patterns: "{{ setup_node_scan_domains_file }}"
    recurse: true
  register: __setup_node_domain_files

- name: Read the domain files
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ __setup_node_domain_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: __setup_node_domain_slurp

- name: Collect the hostnames and the addresses the inventory knows
  ansible.builtin.set_fact:
    setup_node_scan_existing_hostnames: >-
      {{ ((__setup_node_host_dirs.files | map(attribute='path') | map('basename') | list)
          + (groups['all'] | default([]))) | unique | sort }}
    __setup_node_ip_addresses_json: >-
      {%- set ips = [] -%}
      {%- for h in groups['all'] | default([]) -%}
      {%-   if hostvars[h].ansible_host is defined -%}
      {%-     set _ = ips.append(hostvars[h].ansible_host | string) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ips | to_json }}

- name: Validate the panel domain catalogs found in the inventory
  ansible.builtin.assert:
    that:
      - __setup_node_catalog is mapping
      - __setup_node_catalog | list | sort == ['main', 'xray']
      - >-
        __setup_node_catalog.values() | select('string') | list | length
        + (__setup_node_catalog.values() | select('sequence') | reject('string') | reject('mapping') | list | length)
        == __setup_node_catalog | length
      - __setup_node_catalog.values() | select('equalto', []) | list | length == 0
      - >-
        __setup_node_catalog.values() | flatten(levels=1, skip_nulls=false) | select('string') | list | length
        == __setup_node_catalog.values() | flatten(levels=1, skip_nulls=false) | length
      - __setup_node_catalog.values() | flatten(levels=1, skip_nulls=false) | reject('match', domains_base_domain_pattern) | list | length == 0
    quiet: true
    fail_msg: >-
      {{ item.item.path }} must declare main and xray as non-empty domain
      strings or lists of bare lowercase DNS names.
  vars:
    __setup_node_data: "{{ item.content | b64decode | from_yaml }}"
    __setup_node_catalog: "{{ __setup_node_data.vpn_server_remnawave_node_base_domains }}"
  when: __setup_node_data is mapping and __setup_node_data.vpn_server_remnawave_node_base_domains is defined
  loop: "{{ __setup_node_domain_slurp.results }}"
  loop_control:
    label: "{{ item.item.path }}"

# One entry per fact a host's domain file holds, with the host and its region:
#   key main  - the base domain of a literal domains_keys.main (Jinja included,
#               filtered out later), or vpn_server_remnawave_node_base_domains.main
#               of a panel;
#   key xray  - vpn_server_remnawave_node_base_domains.xray of a panel;
#   key net_location / chain_location - domains_node.<key>_index of a node.
- name: Collect the domains of every host
  ansible.builtin.set_fact:
    __setup_node_domain_entries_json: >-
      {%- set host = item.item.path | dirname | dirname | basename -%}
      {%- set data = item.content | b64decode | from_yaml -%}
      {%- set data = data if data is mapping else {} -%}
      {%- set dk = data.domains_keys | default({}, true) -%}
      {%- set bases = data.vpn_server_remnawave_node_base_domains | default({}, true) -%}
      {%- set node = data.domains_node | default({}, true) -%}
      {%- set parts = host.split('-') -%}
      {%- set cc = '' -%}
      {%- if parts | length >= 3 -%}
      {%-   set cc = (hostvars[host].country_code | default(parts[1], true)) if host in hostvars else parts[1] -%}
      {%- endif -%}
      {%- set region = vpn_deployments_country_to_censorship_region_matcher.get(cc, vpn_deployments_country_to_regions_matcher.get(cc, 'unknown')) -%}
      {%- set entries = [] -%}
      {%- if dk is mapping and dk.main is defined and dk.main is string -%}
      {%-   set _ = entries.append({'host': host, 'region': region, 'key': 'main',
                                    'base': dk.main | regex_replace('^(?:\{\{[^}]*\}\}|[^.]+)[^.]*\.', '')}) -%}
      {%- endif -%}
      {%- for alias in dk.main_extra | default([]) if alias is string -%}
      {%-   set _ = entries.append({'host': host, 'region': region, 'key': 'main',
                                    'base': alias | regex_replace('^(?:\{\{[^}]*\}\}|[^.]+)[^.]*\.', '')}) -%}
      {%- endfor -%}
      {%- for key in ['main', 'xray'] if bases is mapping and bases[key] is defined -%}
      {%-   for base in ([bases[key]] if bases[key] is string else bases[key]) -%}
      {%-     set _ = entries.append({'host': host, 'region': region, 'key': key, 'base': base}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- for key, values in (node.base_domains | default({})).items() -%}
      {%-   set values = [values] if values is string else values -%}
      {%-   if key not in ['main', 'xray'] or values is not sequence or values is mapping or values | length == 0
                or values | select('string') | list | length != values | length
                or values | reject('match', domains_base_domain_pattern) | list | length > 0 -%}
      {{ undef('Invalid domains_node.base_domains.' ~ key ~ ' in ' ~ item.item.path) | mandatory }}
      {%-   endif -%}
      {%-   for base in values | unique(case_sensitive=true) -%}
      {%-     set _ = entries.append({'host': host, 'region': region, 'key': key, 'base': base}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {%- for kind in ['net_location', 'chain_location'] if node is mapping and node[kind ~ '_index'] is defined -%}
      {%-   set _ = entries.append({'host': host, 'region': region, 'key': kind, 'index': node[kind ~ '_index'] | int}) -%}
      {%- endfor -%}
      {{ ((__setup_node_domain_entries_json | default('[]') | from_json) + entries) | to_json }}
    __setup_node_panel_catalogs_json: >-
      {%- set host = item.item.path | dirname | dirname | basename -%}
      {%- set data = item.content | b64decode | from_yaml -%}
      {%- set catalogs = __setup_node_panel_catalogs_json | default('{}') | from_json -%}
      {%- if data is mapping and data.vpn_server_remnawave_node_base_domains is defined -%}
      {%-   set normalized = {} -%}
      {%-   for key, value in data.vpn_server_remnawave_node_base_domains.items() -%}
      {%-     set _ = normalized.update({key: ([value] if value is string else value) | unique(case_sensitive=true) | list}) -%}
      {%-   endfor -%}
      {%-   set _ = catalogs.update({host: normalized}) -%}
      {%- endif -%}
      {{ catalogs | to_json }}
  loop: "{{ __setup_node_domain_slurp.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Settle the collected hosts and domains
  ansible.builtin.set_fact:
    setup_node_scan_existing_ip_addresses: "{{ __setup_node_ip_addresses_json | from_json }}"
    setup_node_scan_domain_entries: "{{ __setup_node_domain_entries_json | default('[]') | from_json }}"
    setup_node_scan_panel_base_domains: "{{ __setup_node_panel_catalogs_json | default('{}') | from_json }}"
    setup_node_scan_providers: >-
      {{ setup_node_scan_existing_hostnames
         | select('match', '^[a-z0-9]+-[a-z]{2}-[0-9]+$')
         | map('regex_replace', '-.*$', '') | unique | sort }}

- name: Derive the base domains in use and the location indexes
  ansible.builtin.set_fact:
    setup_node_scan_base_domains: >-
      {{ __setup_node_bases | community.general.counter | dict2items
         | sort(attribute='value', reverse=true) | map(attribute='key') | list }}
    setup_node_scan_base_domain_default: >-
      {{ (__setup_node_main_bases | community.general.counter | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first)
         if __setup_node_main_bases | length > 0 else (__setup_node_bases | first | default('')) }}
    setup_node_scan_xray_base_domain_default: >-
      {{ (__setup_node_xray_bases | community.general.counter | dict2items | sort(attribute='value', reverse=true) | map(attribute='key') | first)
         if __setup_node_xray_bases | length > 0 else (__setup_node_bases | first | default('')) }}
    __setup_node_location_indexes_json: >-
      {%- set idx = {} -%}
      {%- for e in setup_node_scan_domain_entries if e.index is defined -%}
      {%-   if e.region not in idx -%}
      {%-     set _ = idx.update({e.region: {'net_location': [], 'chain_location': []}}) -%}
      {%-   endif -%}
      {%-   set _ = idx[e.region][e.key].append(e.index) -%}
      {%- endfor -%}
      {{ idx | to_json }}
  vars:
    __setup_node_domain_pattern: '^([a-z0-9-]+\.)+[a-z]{2,}$'
    __setup_node_based_entries: "{{ setup_node_scan_domain_entries | selectattr('base', 'defined') | list }}"
    __setup_node_bases: >-
      {{ __setup_node_based_entries | map(attribute='base')
         | select('match', __setup_node_domain_pattern) | list }}
    __setup_node_main_bases: >-
      {{ __setup_node_based_entries | selectattr('key', 'equalto', 'main')
         | map(attribute='base') | select('match', __setup_node_domain_pattern) | list }}
    __setup_node_xray_bases: >-
      {{ __setup_node_based_entries | selectattr('key', 'equalto', 'xray')
         | map(attribute='base') | select('match', __setup_node_domain_pattern) | list }}

# The hosts the new one can relate to by default: those of the groups of
# setup_node_relation_host_groups, in the inventory the play runs against.
- name: Derive the hosts offered as the default relation host
  ansible.builtin.set_fact:
    setup_node_scan_relation_hosts: "{{ __setup_node_relation_hosts }}"
    setup_node_scan_relation_host_choices: >-
      {{ dict(__setup_node_relation_hosts | zip(__setup_node_relation_hosts))
         | combine({setup_node_other_choice: 'Another host (typed next)'}) }}
  vars:
    __setup_node_relation_hosts: >-
      {%- set hosts = [] -%}
      {%- for group in setup_node_relation_host_groups -%}
      {%-   set _ = hosts.extend(groups.get(group, [])) -%}
      {%- endfor -%}
      {{ hosts | reject('equalto', 'localhost') | unique | sort }}

- name: Settle the location indexes and the base domain choices
  ansible.builtin.set_fact:
    setup_node_scan_location_indexes: "{{ __setup_node_location_indexes_json | from_json }}"
    setup_node_scan_base_domain_choices: >-
      {{ dict(setup_node_scan_base_domains | zip(setup_node_scan_base_domains))
         | combine({setup_node_other_choice: 'Another domain (typed next)'}) }}
