---
- name: Settle the facts the host templates use
  ansible.builtin.set_fact:
    initial_configure_host_hostname: >-
      {{ initial_configure_host_local_hostname if setup_node_local | bool
         else initial_configure_host_provider ~ '-' ~ initial_configure_host_country_code ~ '-' ~ initial_configure_host_index }}
    initial_configure_host_base_domain_name: >-
      {{ initial_configure_host_local_domain if setup_node_local | bool
         else initial_configure_host_base_domain_name_custom
              | default(initial_configure_host_base_domain_name_choice | default('', true), true) }}
    initial_configure_host_default_relation_host: >-
      {{ initial_configure_host_default_relation_host_custom
         | default(initial_configure_host_default_relation_host_choice | default('', true), true) }}
    setup_node_region: >-
      {{ vpn_deployments_country_to_censorship_region_matcher.get(initial_configure_host_country_code,
           vpn_deployments_country_to_regions_matcher.get(initial_configure_host_country_code, 'unknown')) }}
    setup_node_groups_chosen: "{{ initial_configure_host_groups | default([], true) }}"

- name: Settle the groups of the host
  ansible.builtin.set_fact:
    setup_node_groups: "{{ (setup_node_groups_required + setup_node_groups_chosen) | unique }}"
    setup_node_remna_node_enabled: "{{ 'vpn_caddy' in setup_node_groups_chosen }}"

- name: Check the answers the templates rely on
  ansible.builtin.assert:
    that:
      - setup_node_remna_node_enabled or initial_configure_host_base_domain_name | length > 0
      - not setup_node_remna_node_enabled or initial_configure_host_default_relation_host | length > 0
      - >-
        not setup_node_remna_node_enabled
        or initial_configure_host_default_relation_host in setup_node_scan_panel_base_domains
      - not setup_node_local | bool or not setup_node_remna_node_enabled
      - not setup_node_local | bool or initial_configure_host_default_relation_host | length > 0
    fail_msg: >-
      A host outside vpn_caddy needs a base domain. A vpn_caddy host needs the
      panel it relates to, holding vpn_server_remnawave_node_base_domains: its
      domains are built on those base domains. A local host cannot join
      vpn_caddy (the panel would publish it as a node) and needs a host it
      relates to: Caddy resolves its analytics server through it.
    quiet: true

- name: Normalize the node's domain selection before writing files
  ansible.builtin.set_fact:
    setup_node_selected_base_domains: >-
      {%- set out = {} -%}
      {%- for key, value in {'main': __setup_node_main, 'xray': __setup_node_xray}.items() -%}
      {%-   set values = [value] if value is string else value -%}
      {%-   if values is not sequence or values is mapping -%}
      {{ undef('Selected ' ~ key ~ ' base domains must be a string or list') | mandatory }}
      {%-   endif -%}
      {%-   set _ = out.update({key: values | unique(case_sensitive=true) | list}) -%}
      {%- endfor -%}
      {{ out }}
  vars:
    __setup_node_main: "{{ initial_configure_host_node_main_base_domains | default(setup_node_scan_panel_base_domains[initial_configure_host_default_relation_host].main[:1]) }}"
    __setup_node_xray: "{{ initial_configure_host_node_xray_base_domains | default(setup_node_scan_panel_base_domains[initial_configure_host_default_relation_host].xray[:1]) }}"
  when: setup_node_remna_node_enabled

- name: Validate the node's selected domains against its panel
  ansible.builtin.assert:
    that:
      - item.value | length > 0
      - item.value | select('string') | list | length == item.value | length
      - item.value | difference(setup_node_scan_panel_base_domains[initial_configure_host_default_relation_host][item.key]) | length == 0
    quiet: true
    fail_msg: "Select one or more registered {{ item.key }} base domains of {{ initial_configure_host_default_relation_host }}."
  loop: "{{ setup_node_selected_base_domains | default({}) | dict2items }}"
  when: setup_node_remna_node_enabled

# The panel's first entry is what a node without a declaration gets, so only
# another choice is written.
- name: Keep the selections that differ from the panel's default
  ansible.builtin.set_fact:
    setup_node_declared_base_domains: >-
      {%- set out = {} -%}
      {%- for key, values in setup_node_selected_base_domains.items() -%}
      {%-   if values != setup_node_scan_panel_base_domains[initial_configure_host_default_relation_host][key][:1] -%}
      {%-     set _ = out.update({key: values}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: setup_node_remna_node_enabled

- name: Check the type of the host's additional base domains
  ansible.builtin.assert:
    that:
      - initial_configure_host_extra_base_domains | default([]) is sequence
      - initial_configure_host_extra_base_domains | default([]) is not string
      - initial_configure_host_extra_base_domains | default([]) is not mapping
    quiet: true
    fail_msg: Additional host base domains must be a list.
  when: not setup_node_remna_node_enabled

- name: Normalize primary hostname and aliases before writing files
  ansible.builtin.set_fact:
    setup_node_host_base_domains: >-
      {{ ([initial_configure_host_base_domain_name] + (initial_configure_host_extra_base_domains | default([])))
         | unique(case_sensitive=true) | list }}
  when: not setup_node_remna_node_enabled

- name: Validate primary hostname and aliases before writing files
  ansible.builtin.assert:
    that:
      - setup_node_host_base_domains | select('string') | list | length == setup_node_host_base_domains | length
      - setup_node_host_base_domains | reject('match', __setup_node_domain_pattern) | list | length == 0
    quiet: true
    fail_msg: >-
      {{ 'The local domain suffix must be dot-separated lowercase labels.' if setup_node_local | bool
         else 'Host base domains must be bare lowercase DNS names.' }}
  vars:
    __setup_node_domain_pattern: >-
      {{ setup_node_local_domain_pattern if setup_node_local | bool else domains_base_domain_pattern }}
  when: not setup_node_remna_node_enabled

- name: Validate optional billing answers before writing host_vars
  ansible.builtin.assert:
    that:
      - >-
        (initial_configure_host_infrastructure_every | int == 1
         and initial_configure_host_infrastructure_unit in ['hour', 'day', 'month', 'year', 'once'])
        or (initial_configure_host_infrastructure_every | int == 3 and initial_configure_host_infrastructure_unit == 'month')
      - initial_configure_host_infrastructure_currency is match('^[A-Z]{3,4}$')
      - initial_configure_host_infrastructure_amount | string is match('^[0-9]+(\.[0-9]{1,2})?$')
    quiet: true
    fail_msg: Billing answers must use a supported infra-billing period and a decimal amount/currency.
  when: initial_configure_host_infrastructure_billing_known | default(false)

- name: Check whether host_vars/{{ initial_configure_host_hostname }} exists
  ansible.builtin.stat:
    path: "{{ setup_node_host_vars_dir }}/{{ initial_configure_host_hostname }}"
    get_checksum: false
  register: __setup_node_host_dir_stat

- name: Stop when host_vars/{{ initial_configure_host_hostname }} exists
  ansible.builtin.fail:
    msg: "{{ setup_node_host_vars_dir }}/{{ initial_configure_host_hostname }} already exists. Nothing was written."
  when: __setup_node_host_dir_stat.stat.exists

- name: Find the host template directories of this role
  ansible.builtin.find:
    paths: "{{ setup_node_role_path }}/templates/host"
    file_type: directory
    recurse: false
  register: __setup_node_template_dirs

- name: Render the files every host gets into host_vars/{{ initial_configure_host_hostname }}/0_all
  ansible.builtin.include_role:
    name: setup/common
    tasks_from: render_tree
  vars:
    setup_render_tree_src: "{{ (setup_node_role_path ~ '/../common/templates/host/0_all') | realpath }}"
    setup_render_tree_dest: "{{ setup_node_host_vars_dir }}/{{ initial_configure_host_hostname }}/0_all"

- name: Render host_vars/{{ initial_configure_host_hostname }}
  ansible.builtin.include_role:
    name: setup/common
    tasks_from: render_tree
  vars:
    setup_render_tree_src: "{{ setup_node_role_path }}/templates/host/{{ setup_node_template_dir }}"
    setup_render_tree_dest: "{{ setup_node_host_vars_dir }}/{{ initial_configure_host_hostname }}/{{ setup_node_template_dir }}"
    setup_render_tree_skip: "{{ setup_node_templates_skip if setup_node_template_dir == '0_all' else [] }}"
  loop: >-
    {{ (setup_node_templates_always + setup_node_groups) | unique
       | select('in', __setup_node_template_dirs.files | map(attribute='path') | map('basename') | list) | list }}
  loop_control:
    loop_var: setup_node_template_dir
