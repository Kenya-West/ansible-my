---
# Questionnaire of roles/setup/node, run by the ansible-prompting-engine role.
# The format is documented in the role's docs/SPEC.md.
#
# Besides the play's variables and the setup_node_scan_* facts, the role passes
# in a few values derived from the answers as they come (tasks/prompt.yml):
# setup_node_region, setup_node_hostname, setup_node_country_hostnames,
# setup_node_next_host_index, setup_node_region_indexes,
# setup_node_next_net_location_index and setup_node_xray_base_domain.
#
# With setup_node_local (a host on a local network) the name is asked whole,
# and the provider, index, billing and public domain prompts are skipped.
settings:
  var_prefix: initial_configure_host_
  intro: |-
    {% if setup_node_local | bool %}
    New local host of the inventory (a laptop, a home server). Its name is
    free; the country is asked apart and written as country_code. It gets no
    DNS records and no certificates: Caddy serves it in plain HTTP.
    {% else %}
    New host of the inventory. Its name is <provider>-<country>-<index>, like
    ovh-sg-2: the country drives country_code, the deployment region and the
    domain names.
    {% endif %}
    Press Enter to accept a default; Ctrl+C, then A, aborts.
  review: true

prompts:
  - id: local_hostname
    prompt: Name of the local host
    help: >-
      Lowercase letters, digits and dashes, like kw-laptop: the inventory
      hostname, and the machine's hostname once playbooks/base/hostname.yaml
      runs.
    when: setup_node_local | bool
    validate:
      - pattern: "{{ setup_node_local_name_pattern }}"
        msg: "'{{ answer }}' is not valid: lowercase letters, digits and inner dashes only."
      - that: answer not in setup_node_scan_existing_hostnames
        msg: "{{ answer }} already exists, in host_vars/ or in the inventory."

  - id: provider
    prompt: Hosting provider
    when: not setup_node_local | bool
    help: >-
      Lowercase letters and digits, no dashes: the first part of the hostname.
      Providers already in the inventory:
      {{ setup_node_scan_providers | join(', ') if setup_node_scan_providers | length > 0 else 'none yet' }}.
    validate:
      - pattern: '^[a-z0-9]+$'
        msg: "'{{ answer }}' is not valid: lowercase letters and digits only."

  - id: infrastructure_provider
    prompt: Stable provider key in infra_providers
    help: Independent of the hostname prefix; create this key in the private provider catalog.
    default: "{{ answers.provider }}"
    when: not setup_node_local | bool
    validate:
      - pattern: '^[a-z0-9][a-z0-9_-]*$'

  - id: infrastructure_account
    prompt: Account key at this provider
    default: main
    when: not setup_node_local | bool
    validate:
      - pattern: '^[a-z0-9][a-z0-9_-]*$'

  - id: infrastructure_billing_known
    prompt: Enter verified billing amount and interval now?
    help: Unknown prices are omitted, never exported as zero. Export remains disabled until configured.
    type: bool
    default: false
    when: not setup_node_local | bool

  - id: infrastructure_amount
    prompt: Amount per billing interval
    when: answers.infrastructure_billing_known | default(false)
    validate:
      - pattern: '^[0-9]+(\.[0-9]{1,2})?$'

  - id: infrastructure_currency
    prompt: Billing currency
    default: USD
    when: answers.infrastructure_billing_known | default(false)
    validate:
      - pattern: '^[A-Z]{3,4}$'

  - id: infrastructure_every
    prompt: Number of units between payments
    type: int
    default: 1
    when: answers.infrastructure_billing_known | default(false)
    validate:
      - that: answer in [1, 3]
        msg: Use 1 for a standard period or 3 for quarterly (months only).

  - id: infrastructure_unit
    prompt: Billing interval unit
    type: choice
    choices: "{{ ['month'] if answers.infrastructure_every | int == 3 else ['hour', 'day', 'month', 'year', 'once'] }}"
    default: month
    when: answers.infrastructure_billing_known | default(false)

  - id: country_code
    prompt: Country of the {{ 'host' if setup_node_local | bool else 'server' }}
    help: >-
      Two lowercase letters (ISO 3166-1 alpha-2){{
      ', written as country_code to 0_all/0_country.yaml' if setup_node_local | bool
      else ': the second part of the hostname' }}. It sets country_code and, through the region matchers of
      group_vars/all/0_defaults/regions.yaml, the deployment region:
      de is europe, sg is asia, ru is russia.
    validate:
      - pattern: '^[a-z]{2}$'
        msg: "'{{ answer }}' is not a two-letter lowercase country code."

  - id: region_unknown
    prompt: "'{{ answers.country_code }}' is in no region matcher, so the deployment region would be 'unknown'. Keep it?"
    help: Answering no asks for the country again.
    type: bool
    default: false
    when: setup_node_region == 'unknown'
    next:
      - when: not answer
        goto: country_code

  - id: index
    prompt: "Index of the host: {{ answers.provider }}-{{ answers.country_code }}-<index>"
    help: >-
      Deployment region: {{ setup_node_region }}. Hosts in {{ answers.country_code }} so far:
      {{ setup_node_country_hostnames | join(', ') if setup_node_country_hostnames | length > 0 else 'none' }}.
    type: int
    default: "{{ setup_node_next_host_index }}"
    when: not setup_node_local | bool
    validate:
      - min: 1
      - that: (answers.provider ~ '-' ~ answers.country_code ~ '-' ~ answer) not in setup_node_scan_existing_hostnames
        msg: "{{ answers.provider }}-{{ answers.country_code }}-{{ answer }} already exists, in host_vars/ or in the inventory."

  - id: ip_address
    prompt: "IPv4 address of {{ setup_node_hostname }}"
    help: >-
      Written as ansible_host in the inventory file(s){{
      '; for a local host, its address on the local network: give it a DHCP reservation' if setup_node_local | bool }}.
    validate:
      - pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
        msg: "'{{ answer }}' is not an IPv4 address."
      - that: answer not in setup_node_scan_existing_ip_addresses
        msg: "{{ answer }} is already the ansible_host of another host."

  - id: groups
    prompt: "Inventory groups of {{ setup_node_hostname }}"
    help: >-
      {{ setup_node_groups_required | join(' and ') }} are always joined.
      Choose the optional ones (numbers separated by commas); type a single
      comma to join none of them.
    type: multichoice
    choices: "{{ setup_node_groups_optional }}"
    default: "{{ setup_node_groups_optional_default }}"
    required: false

  - id: default_relation_host_choice
    prompt: "Host {{ setup_node_hostname }} relates to by default"
    help: >-
      Upstream in host_relations.default. For vpn_caddy, choose the panel
      whose domain catalog this node will use; domains do not select a panel.
      Caddy needs an analytics server here (the scrape credentials of its
      metrics endpoint).
    type: choice
    choices: "{{ setup_node_scan_relation_host_choices }}"
    default: "{{ setup_node_scan_relation_hosts | first }}"
    when: setup_node_scan_relation_hosts | length > 0
    validate:
      - that: "'vpn_caddy' not in answers.groups | default([]) or answer == setup_node_other_choice or answer in setup_node_scan_panel_base_domains"
        msg: A vpn_caddy node needs a panel with a domain catalog.

  - id: default_relation_host_custom
    prompt: "Host {{ setup_node_hostname }} relates to by default"
    when: answers.default_relation_host_choice | default(setup_node_other_choice, true) == setup_node_other_choice
    validate:
      - pattern: '^[a-z0-9][a-z0-9._-]*$'
      - that: "'vpn_caddy' not in answers.groups | default([]) or answer in setup_node_scan_panel_base_domains"
        msg: Add the panel's 0_all/1_domains.yaml domain catalog first.

  - id: node_main_base_domains
    prompt: Base domains for this node's own hostnames
    help: First selected domain is primary. Default selects the panel's first entry.
    type: multichoice
    choices: "{{ setup_node_panel_base_domains.main }}"
    default: "{{ setup_node_panel_base_domains.main[:1] }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"

  - id: node_xray_base_domains
    prompt: Base domains for this node's XRay exit and chain names
    help: Select one or more entries from the related panel's catalog. Default selects its first entry.
    type: multichoice
    choices: "{{ setup_node_panel_base_domains.xray }}"
    default: "{{ setup_node_panel_base_domains.xray[:1] }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"

  # Hosts outside vpn_caddy name their own primary hostname and optional aliases.
  - id: base_domain_name_choice
    prompt: "Base domain of the host's own domain: {{ setup_node_hostname }}.<base domain>"
    help: The base domains the hosts of this inventory already use.
    type: choice
    choices: "{{ setup_node_scan_base_domain_choices }}"
    default: "{{ setup_node_scan_base_domain_default }}"
    when:
      - not setup_node_local | bool
      - "'vpn_caddy' not in answers.groups | default([], true)"
      - setup_node_scan_base_domains | length > 0

  - id: base_domain_name_custom
    prompt: "Base domain of the host's own domain: {{ setup_node_hostname }}.<base domain>"
    when:
      - not setup_node_local | bool
      - "'vpn_caddy' not in answers.groups | default([], true)"
      - answers.base_domain_name_choice | default(setup_node_other_choice, true) == setup_node_other_choice
    validate:
      - pattern: '^([a-z0-9-]+\.)+[a-z]{2,}$'
        msg: "'{{ answer }}' does not look like a domain."

  - id: extra_base_domains
    prompt: Additional base domains for the host's own hostname (comma-separated)
    type: list
    required: false
    default: []
    when:
      - not setup_node_local | bool
      - "'vpn_caddy' not in answers.groups | default([], true)"
    validate:
      - that: answer | reject('match', '^([a-z0-9-]+\\.)+[a-z]{2,}$') | list | length == 0
        msg: Every entry must be a base domain.

  - id: local_domain
    prompt: "Suffix of the host's own domain on the local network: {{ setup_node_hostname }}.<suffix>"
    help: >-
      Written as domains_keys.main; no DNS record is made for it. 'local'
      resolves through mDNS (Avahi) once the machine is named after the host;
      'lan' or 'home.arpa' need your router's DNS. Caddy answers on any name
      or address anyway.
    default: "{{ setup_node_local_domain_default }}"
    when: setup_node_local | bool
    validate:
      - pattern: "{{ setup_node_local_domain_pattern }}"
        msg: "'{{ answer }}' is not valid: dot-separated labels of lowercase letters, digits and inner dashes."

  - id: net_location_index
    prompt: "Index of the exit domain: net-{{ setup_node_region }}-<index>.{{ setup_node_xray_base_domain }}"
    help: >-
      Written to domains_node of 0_all/1_domains.yaml.
      Hosts sharing an index share the domain (a round-robin DNS record).
      Indexes in use for {{ setup_node_region }}:
      {{ setup_node_region_indexes.net_location | unique | sort | join(', ') if setup_node_region_indexes.net_location | length > 0 else 'none' }}.
    type: int
    default: "{{ setup_node_next_net_location_index }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"
    validate:
      - min: 1

  - id: chain_location_index
    prompt: "Index of the entry (chain) domain: chain-{{ setup_node_region }}-<index>.{{ setup_node_xray_base_domain }}"
    help: >-
      Indexes in use for {{ setup_node_region }}:
      {{ setup_node_region_indexes.chain_location | unique | sort | join(', ') if setup_node_region_indexes.chain_location | length > 0 else 'none' }}.
    type: int
    default: "{{ answers.net_location_index }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"
    validate:
      - min: 1

  - id: remna_primary_protocol
    prompt: Primary protocol of the Remnawave node
    help: >-
      Picks the net-<geo>-<protocol> and chain-<geo>-<protocol> domains of the
      host; written to vpn_caddy/remna.yaml.
    type: choice
    choices: "{{ setup_node_remna_protocol_types }}"
    default: "{{ setup_node_remna_protocol_type_default }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"

  - id: remna_use_dns01_cloudflare
    prompt: Issue the certificates of the node through the Cloudflare DNS-01 challenge?
    type: bool
    default: true
    when: "'vpn_caddy' in answers.groups | default([], true)"
