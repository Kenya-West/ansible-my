---
# Questionnaire of roles/setup/node, run by the ansible-prompting-engine role.
# The format is documented in the role's docs/SPEC.md.
#
# Besides the play's variables and the setup_node_scan_* facts, the role passes
# in a few values derived from the answers as they come (tasks/prompt.yml):
# setup_node_region, setup_node_hostname, setup_node_country_hostnames,
# setup_node_next_host_index, setup_node_region_indexes,
# setup_node_next_net_location_index and setup_node_xray_base_domain.
settings:
  var_prefix: initial_configure_host_
  intro: |-
    New host of the inventory. Its name is <provider>-<country>-<index>, like
    ovh-sg-2: the country drives country_code, the deployment region and the
    domain names. Press Enter to accept a default; Ctrl+C, then A, aborts.
  review: true

prompts:
  - id: provider
    prompt: Hosting provider
    help: >-
      Lowercase letters and digits, no dashes: the first part of the hostname.
      Providers already in the inventory:
      {{ setup_node_scan_providers | join(', ') if setup_node_scan_providers | length > 0 else 'none yet' }}.
    validate:
      - pattern: '^[a-z0-9]+$'
        msg: "'{{ answer }}' is not valid: lowercase letters and digits only."

  - id: country_code
    prompt: Country of the server
    help: >-
      Two lowercase letters (ISO 3166-1 alpha-2): the second part of the
      hostname. It sets country_code and, through the region matchers of
      group_vars/all/0_defaults/regions.yaml, the deployment region:
      de is europe, sg is asia, ru is russia.
    validate:
      - pattern: '^[a-z]{2}$'
        msg: "'{{ answer }}' is not a two-letter lowercase country code."

  - id: region_unknown
    prompt: "'{{ answers.country_code }}' is in no region matcher, so the deployment region would be 'unknown'. Keep it?"
    help: Answering no asks for the country again.
    type: bool
    default: false
    when: setup_node_region == 'unknown'
    next:
      - when: not answer
        goto: country_code

  - id: index
    prompt: "Index of the host: {{ answers.provider }}-{{ answers.country_code }}-<index>"
    help: >-
      Deployment region: {{ setup_node_region }}. Hosts in {{ answers.country_code }} so far:
      {{ setup_node_country_hostnames | join(', ') if setup_node_country_hostnames | length > 0 else 'none' }}.
    type: int
    default: "{{ setup_node_next_host_index }}"
    validate:
      - min: 1
      - that: (answers.provider ~ '-' ~ answers.country_code ~ '-' ~ answer) not in setup_node_scan_existing_hostnames
        msg: "{{ answers.provider }}-{{ answers.country_code }}-{{ answer }} already exists, in host_vars/ or in the inventory."

  - id: ip_address
    prompt: "IPv4 address of {{ setup_node_hostname }}"
    help: Written as ansible_host in the inventory file(s).
    validate:
      - pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
        msg: "'{{ answer }}' is not an IPv4 address."
      - that: answer not in setup_node_scan_existing_ip_addresses
        msg: "{{ answer }} is already the ansible_host of another host."

  - id: groups
    prompt: "Inventory groups of {{ setup_node_hostname }}"
    help: >-
      {{ setup_node_groups_required | join(' and ') }} are always joined.
      Choose the optional ones (numbers separated by commas); type a single
      comma to join none of them.
    type: multichoice
    choices: "{{ setup_node_groups_optional }}"
    default: "{{ setup_node_groups_optional_default }}"
    required: false

  # A vpn_caddy host takes its base domains from the panel it relates to
  # (vpn_server_remnawave_node_base_domains, see
  # group_vars/vpn_caddy/domain_generator.yaml); any other host names its own.
  - id: base_domain_name_choice
    prompt: "Base domain of the host's own domain: {{ setup_node_hostname }}.<base domain>"
    help: The base domains the hosts of this inventory already use.
    type: choice
    choices: "{{ setup_node_scan_base_domain_choices }}"
    default: "{{ setup_node_scan_base_domain_default }}"
    when:
      - "'vpn_caddy' not in answers.groups | default([], true)"
      - setup_node_scan_base_domains | length > 0

  - id: base_domain_name_custom
    prompt: "Base domain of the host's own domain: {{ setup_node_hostname }}.<base domain>"
    when:
      - "'vpn_caddy' not in answers.groups | default([], true)"
      - answers.base_domain_name_choice | default(setup_node_other_choice, true) == setup_node_other_choice
    validate:
      - pattern: '^([a-z0-9-]+\.)+[a-z]{2,}$'
        msg: "'{{ answer }}' does not look like a domain."

  - id: net_location_index
    prompt: "Index of the exit domain: net-{{ setup_node_region }}-<index>.{{ setup_node_xray_base_domain }}"
    help: >-
      Written to domains_node of 0_all/1_domains.yaml.
      Hosts sharing an index share the domain (a round-robin DNS record).
      Indexes in use for {{ setup_node_region }}:
      {{ setup_node_region_indexes.net_location | unique | sort | join(', ') if setup_node_region_indexes.net_location | length > 0 else 'none' }}.
    type: int
    default: "{{ setup_node_next_net_location_index }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"
    validate:
      - min: 1

  - id: chain_location_index
    prompt: "Index of the entry (chain) domain: chain-{{ setup_node_region }}-<index>.{{ setup_node_xray_base_domain }}"
    help: >-
      Indexes in use for {{ setup_node_region }}:
      {{ setup_node_region_indexes.chain_location | unique | sort | join(', ') if setup_node_region_indexes.chain_location | length > 0 else 'none' }}.
    type: int
    default: "{{ answers.net_location_index }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"
    validate:
      - min: 1

  - id: remna_primary_protocol
    prompt: Primary protocol of the Remnawave node
    help: >-
      Picks the net-<geo>-<protocol> and chain-<geo>-<protocol> domains of the
      host; written to vpn_caddy/remna.yaml.
    type: choice
    choices: "{{ setup_node_remna_protocol_types }}"
    default: "{{ setup_node_remna_protocol_type_default }}"
    when: "'vpn_caddy' in answers.groups | default([], true)"

  - id: remna_use_dns01_cloudflare
    prompt: Issue the certificates of the node through the Cloudflare DNS-01 challenge?
    type: bool
    default: true
    when: "'vpn_caddy' in answers.groups | default([], true)"

  - id: default_relation_host_choice
    prompt: "Host {{ setup_node_hostname }} relates to by default"
    help: >-
      host_relations.default of 0_all/1_domains.yaml: the upstream a component
      of the host falls back to. The hosts of
      {{ setup_node_relation_host_groups | join(' and ') }} in this inventory.
      A vpn_caddy host takes its base domains from this panel
      (vpn_server_remnawave_node_base_domains).
    type: choice
    choices: "{{ setup_node_scan_relation_host_choices }}"
    default: "{{ setup_node_scan_relation_hosts | first }}"
    when: setup_node_scan_relation_hosts | length > 0

  - id: default_relation_host_custom
    prompt: "Host {{ setup_node_hostname }} relates to by default"
    help: >-
      host_relations.default of 0_all/1_domains.yaml, an inventory_hostname
      like play2go-nl-3.
    when: answers.default_relation_host_choice | default(setup_node_other_choice, true) == setup_node_other_choice
    validate:
      - pattern: '^[a-z0-9][a-z0-9._-]*$'
        msg: "'{{ answer }}' does not look like an inventory hostname."
