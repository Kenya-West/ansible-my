---
# defaults file for roles/setup/node

# Where the inventory lives: the directory of the inventory the play runs with,
# otherwise inventory/ of the project.
setup_node_project_dir: "{{ (role_path ~ '/../../..') | realpath }}"
setup_node_inventory_dir: "{{ inventory_dir | default(setup_node_project_dir ~ '/inventory', true) }}"
setup_node_host_vars_dir: "{{ setup_node_inventory_dir }}/host_vars"

# The inventory files that get the new host: every INI file the play was
# started with (-i ...).
setup_node_inventory_files: >-
  {{ ansible_inventory_sources | default([]) | select('search', '\.ini$') | list }}

# The file of a host that lists its domains; read from every existing host to
# offer the base domains already in use and to suggest location indexes.
setup_node_scan_domains_file: 1_domains.yaml

# A host on a local network (a laptop, a home server) instead of a hosted one:
# its name is free (no <provider>-<country>-<index>), so the country is asked
# and written as country_code; its own domain is <hostname>.<local suffix>
# with no DNS records, and it has no hosting bill. The groups for it are set
# by playbooks/ansible/node/add_host_local.yaml.
setup_node_local: false

# The suffix of a local host's own domain (domains_keys.main), offered at the
# prompt: `local` resolves through mDNS (Avahi) on the network once
# playbooks/base/hostname.yaml has named the machine after the host.
setup_node_local_domain_default: local
# A hostname, or a suffix of one or more dot-separated labels.
setup_node_local_name_pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
setup_node_local_domain_pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'

# Files of templates/host/0_all/ of this role not written: a local host has
# no hosting bill, a hosted one takes country_code from its name.
setup_node_templates_skip: >-
  {{ ['3_infrastructure.yaml.j2'] if setup_node_local | bool else ['0_country.yaml.j2'] }}

# Groups every new host joins, the ones offered at the prompt (value: label)
# and the ones chosen when Enter is pressed.
setup_node_groups_required:
  - general_vps_prepare
  - domain_management
setup_node_groups_optional:
  vpn_caddy: "vpn_caddy - Remnawave node behind Caddy (VPN/proxy)"
  analytics_node: "analytics_node - exporters feeding the analytics server"
  backup_restic_node: "backup_restic_node - Autorestic backups of the host"
setup_node_groups_optional_default:
  - vpn_caddy
  - analytics_node
  - backup_restic_node

# Directories of templates/host/ rendered into host_vars/<hostname>/. The ones
# listed here always are; any other is when the host joins the group of the
# same name and the directory exists.
setup_node_templates_always:
  - 0_all

# Protocols of the Remnawave node offered at the prompt: keys of
# remna_protocol_types (inventory/group_vars/all/0_defaults/protocols.yaml).
setup_node_remna_protocol_types:
  - vless_reality_tcp
  - vless_reality_xhttp
setup_node_remna_protocol_type_default: vless_reality_tcp

# Restic remotes a backup_restic_node host backs up to; by default the ones
# of backup_restic_node_remotes_base, when the controller sees it.
setup_node_backup_restic_remotes: "{{ backup_restic_node_remotes_base | default({}) | list }}"

# Inventory groups whose hosts are offered at the prompt as the default
# relation host of the new host (host_relations.default of
# 0_all/1_domains.yaml). When the inventory the play runs against has none of
# them, the host is typed instead.
setup_node_relation_host_groups:
  - analytics_server
  - vpn_server_remnawave

# The choice that stands for "another one, typed next" in the base domain and
# relation host prompts.
setup_node_other_choice: __other__

# Preset answers for the prompts, by prompt id (see vars/prompts/host.yml),
# for unattended runs together with prompting_engine_interactive=false.
setup_node_prompt_answers: {}
