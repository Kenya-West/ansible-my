---
- name: Ask about the new server
  ansible.builtin.include_role:
    name: ansible-prompting-engine
  vars:
    prompting_engine_spec_file: "{{ setup_server_role_path }}/vars/prompts/host.yml"
    prompting_engine_answers: "{{ setup_server_prompt_answers }}"
    # Derived from the answers as they come in; the prompts refer to them.
    setup_server_hostname: "{{ initial_configure_server_provider }}-{{ initial_configure_server_country_code }}-{{ initial_configure_server_index }}"
    setup_server_country_hostnames: >-
      {{ setup_node_scan_existing_hostnames
         | select('match', '^[a-z0-9]+-' ~ initial_configure_server_country_code ~ '-[0-9]+$') | list }}
    setup_server_next_host_index: >-
      {{ ((setup_server_country_hostnames | map('regex_replace', '^.*-', '') | map('int') | list) + [0]) | max + 1 }}
    setup_server_base_domain: >-
      {{ initial_configure_server_base_domain_name_custom
         | default(initial_configure_server_base_domain_name_choice | default('', true), true) }}
    setup_server_relation_host_choices: >-
      {{ dict(setup_node_scan_relation_hosts | zip(setup_node_scan_relation_hosts))
         | combine({setup_server_hostname: setup_server_hostname ~ ' (this server)'})
         | combine({setup_server_other_choice: 'Another host (typed next)'}) }}
