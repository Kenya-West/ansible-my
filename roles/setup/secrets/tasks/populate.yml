---
- name: Render the secret files into {{ setup_secrets_dir }}
  ansible.builtin.include_role:
    name: setup/common
    tasks_from: render_tree
  vars:
    setup_render_tree_src: "{{ setup_secrets_role_path }}/templates/{{ setup_secrets_template_dir }}"
    setup_render_tree_dest: "{{ setup_secrets_dir }}"
