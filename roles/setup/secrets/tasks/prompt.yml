---
- name: Ensure {{ setup_secrets_dir }} exists
  ansible.builtin.file:
    path: "{{ setup_secrets_dir }}"
    state: directory
    mode: "0775"

- name: Find the secrets already in {{ setup_secrets_dir }}
  ansible.builtin.find:
    paths: "{{ setup_secrets_dir }}"
    file_type: file
    excludes: "{{ setup_secrets_keep_files }}"
    recurse: true
  register: __setup_secrets_existing

- name: Ask for the e-mail addresses and the API tokens
  ansible.builtin.include_role:
    name: ansible-prompting-engine
  vars:
    prompting_engine_spec_file: "{{ setup_secrets_role_path }}/vars/prompts/input.yml"
    prompting_engine_answers: "{{ setup_secrets_prompt_answers }}"
    setup_secrets_existing_count: "{{ __setup_secrets_existing.matched }}"

- name: Decide whether the secrets get written
  ansible.builtin.set_fact:
    __setup_secrets_proceed: >-
      {{ __setup_secrets_existing.matched == 0
         or (initial_configure_user_input_replace_secrets | default(false, true) | bool) }}

- name: Report that nothing is written
  ansible.builtin.debug:
    msg: >-
      {{ __setup_secrets_existing.matched }} secret file(s) are kept in
      {{ setup_secrets_dir }}; nothing was changed.
  when: not __setup_secrets_proceed

- name: Assemble the user input the templates expect
  ansible.builtin.set_fact:
    initial_configure_user_input_user_email:
      main: "{{ initial_configure_user_input_email_main }}"
      domain: "{{ initial_configure_user_input_email_domain | default(initial_configure_user_input_email_main, true) }}"
    initial_configure_user_input_gh_token:
      eget: "{{ initial_configure_user_input_gh_token_eget | default('', true) }}"
      debget: "{{ initial_configure_user_input_gh_token_debget | default(initial_configure_user_input_gh_token_eget | default('', true), true) }}"
  no_log: true
  when: __setup_secrets_proceed
