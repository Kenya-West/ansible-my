---
# Scope "group": which inventory group is written, and whether the values it
# already has survive the run.

- name: Ensure {{ setup_secrets_dir }} exists
  ansible.builtin.file:
    path: "{{ setup_secrets_dir }}"
    state: directory
    mode: "0775"

- name: Find the inventory groups of {{ setup_secrets_group_vars_dir }}
  ansible.builtin.find:
    paths: "{{ setup_secrets_group_vars_dir }}"
    file_type: directory
    recurse: false
  register: __setup_secrets_group_vars_dirs

- name: Find the template directories of this role
  ansible.builtin.find:
    paths: "{{ setup_secrets_role_path }}/templates/{{ setup_secrets_template_dir }}"
    file_type: directory
    recurse: false
  register: __setup_secrets_template_dirs

- name: Match every group with the template directories it owns
  ansible.builtin.set_fact:
    __setup_secrets_group_dirs: >-
      {{ (__setup_secrets_group_vars_dirs.files | map(attribute='path') | map('basename')
          | reject('in', setup_secrets_group_vars_exclude) | sort)
         | secrets_group_dirs(setup_secrets_group_template_dirs,
                              __setup_secrets_template_dirs.files
                              | map(attribute='path') | map('basename') | list) }}

- name: Fail when no group of the inventory has a secret template
  ansible.builtin.fail:
    msg: >-
      None of the groups of {{ setup_secrets_group_vars_dir }} has a template
      directory in {{ setup_secrets_role_path }}/templates/{{ setup_secrets_template_dir }}.
      Check setup_secrets_group_template_dirs.
  when: __setup_secrets_group_dirs | length == 0

- name: Ask which group is written
  ansible.builtin.include_role:
    name: ansible-prompting-engine
  vars:
    prompting_engine_spec_file: "{{ setup_secrets_role_path }}/vars/prompts/group.yml"
    # setup_secrets_group preselects the group the same way the other preset
    # answers work, so an unattended run needs no separate switch.
    prompting_engine_answers: >-
      {{ setup_secrets_prompt_answers
         | combine({'group': setup_secrets_group} if setup_secrets_group | default('', true) else {}) }}
    # The label of a group is the directories it writes, so the choice says
    # what the run is going to touch.
    setup_secrets_group_choices: "{{ __setup_secrets_group_dirs | secrets_group_choices }}"

- name: Decide whether the secrets get written
  ansible.builtin.set_fact:
    # Plain default(): the answers are booleans, and default(x, true) would
    # read a deliberate "no" as an empty answer and turn it back into a yes.
    __setup_secrets_proceed: >-
      {{ (initial_configure_user_input_keep_existing | default(setup_secrets_keep_existing) | bool)
         or (initial_configure_user_input_replace_group_secrets | default(false) | bool) }}
    __setup_secrets_keep_existing: >-
      {{ initial_configure_user_input_keep_existing | default(setup_secrets_keep_existing) | bool }}

- name: Report that nothing is written
  ansible.builtin.debug:
    msg: >-
      The secrets of '{{ initial_configure_user_input_group }}' in
      {{ setup_secrets_dir }} are left as they are; nothing was changed.
  when: not __setup_secrets_proceed

- name: Note which directories the group writes
  ansible.builtin.set_fact:
    __setup_secrets_render_dirs: "{{ __setup_secrets_group_dirs[initial_configure_user_input_group] }}"
  when: __setup_secrets_proceed

- name: Take the e-mail addresses and the API tokens from the inventory
  ansible.builtin.set_fact:
    initial_configure_user_input_user_email:
      main: "{{ emails.main | default('', true) }}"
      domain: "{{ emails.domain | default(emails.main | default('', true), true) }}"
    initial_configure_user_input_gh_token:
      eget: "{{ github_api_token_eget | default('', true) }}"
      debget: "{{ github_api_token_debget | default(github_api_token_eget | default('', true), true) }}"
    initial_configure_user_input_acme_email: "{{ acme_email | default(emails.domain | default('', true), true) }}"
    initial_configure_user_input_cloudflare_api_token_dns: "{{ cloudflare_api_token_dns | default('', true) }}"
  no_log: true
  when: __setup_secrets_proceed
