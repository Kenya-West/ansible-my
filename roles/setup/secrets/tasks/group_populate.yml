---
# Scope "group": render the template directories of the chosen group, then put
# them in place keeping the values the files already have.
#
# The templates are rendered into a staging directory first, because a file is
# only written once it has been merged with the one on disk: rendering
# straight into the inventory would rotate every credential before there is a
# chance to look at what is already there.

- name: Create the staging directory of the rendered secrets
  ansible.builtin.tempfile:
    state: directory
    prefix: setup_secrets.
  register: __setup_secrets_staging
  changed_when: false

- name: Render and install the secrets of {{ initial_configure_user_input_group }}
  block:
    - name: Render the template directories into the staging directory
      ansible.builtin.include_role:
        name: setup/common
        tasks_from: render_tree
      vars:
        setup_render_tree_src: "{{ setup_secrets_role_path }}/templates/{{ setup_secrets_template_dir }}/{{ setup_secrets_group_dir }}"
        setup_render_tree_dest: "{{ __setup_secrets_staging.path }}/{{ setup_secrets_group_dir }}"
      loop: "{{ __setup_secrets_render_dirs }}"
      loop_control:
        loop_var: setup_secrets_group_dir

    - name: Collect the rendered files
      ansible.builtin.find:
        paths: "{{ __setup_secrets_staging.path }}"
        file_type: file
        recurse: true
      register: __setup_secrets_rendered

    - name: Create the directories of the group under {{ setup_secrets_dir }}
      ansible.builtin.file:
        path: "{{ setup_secrets_dir }}/{{ item }}"
        state: directory
        mode: "0775"
      loop: "{{ __setup_secrets_render_dirs }}"

    - name: Write the secrets of {{ initial_configure_user_input_group }}
      ansible.builtin.copy:
        # Keeping the values is a merge of the rendered text with the file on
        # disk: the template decides which fields exist, the old file decides
        # what the fields both of them have are worth. A file whose merge
        # changes nothing is left untouched, so its comments and its
        # formatting stay exactly as they were.
        content: >-
          {{ lookup('ansible.builtin.file', item.path, rstrip=false)
             | secrets_preserve(lookup('ansible.builtin.file', setup_secrets_destination, rstrip=false),
                                setup_secrets_preserve_id_keys)
             if (__setup_secrets_keep_existing | bool and setup_secrets_destination is exists)
             else lookup('ansible.builtin.file', item.path, rstrip=false) }}
        dest: "{{ setup_secrets_destination }}"
        mode: "0664"
        backup: true
      vars:
        setup_secrets_destination: "{{ setup_secrets_dir }}/{{ item.path | relpath(__setup_secrets_staging.path) }}"
      loop: "{{ __setup_secrets_rendered.files }}"
      loop_control:
        label: "{{ item.path | relpath(__setup_secrets_staging.path) }}"
      no_log: true
      register: __setup_secrets_written

    - name: Report what was written
      ansible.builtin.debug:
        msg: >-
          {{ (__setup_secrets_written.results | selectattr('changed') | list | length) }} of
          {{ __setup_secrets_written.results | length }} file(s) of
          '{{ initial_configure_user_input_group }}' changed
          {{ '(values already written were kept)' if __setup_secrets_keep_existing | bool
             else '(every value was generated again)' }}:
          {{ __setup_secrets_written.results | selectattr('changed')
             | map(attribute='dest') | map('relpath', setup_secrets_dir) | list | join(', ') | default('none', true) }}

  always:
    - name: Remove the staging directory
      ansible.builtin.file:
        path: "{{ __setup_secrets_staging.path }}"
        state: absent
      changed_when: false
