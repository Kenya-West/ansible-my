---
- name: Generate the passwords the secret templates use
  ansible.builtin.set_fact:
    "initial_configure_generated_password_{{ item.name }}": >-
      {{ lookup('community.general.random_string',
                length=item.length | default(setup_secrets_password_length),
                min_lower=1, min_upper=1, min_numeric=1, min_special=1,
                override_special=setup_secrets_password_special_chars) }}
  loop: "{{ setup_secrets_generated_passwords }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
