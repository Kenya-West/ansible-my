---
# tasks file for roles/setup/secrets
#
# On the controller: the shared secrets of
# group_vars/all/z_common_hosts_secrets, rendered from
# templates/group_vars/all/z_common_hosts_secrets/.
#
# Two scopes. "all" is step 2 of the initial configuration: the e-mail
# addresses and the API tokens are asked for, every password is generated and
# the whole tree is written. "group" writes one inventory group, and offers to
# keep the values its files already have so that regenerating the secrets of a
# group does not rotate the credentials deployed on the other ones.

- name: Capture this role's path so nested roles can use it
  ansible.builtin.set_fact:
    setup_secrets_role_path: "{{ role_path }}"
  tags:
    - always

- name: Check the scope of the run
  ansible.builtin.fail:
    msg: "setup_secrets_scope is '{{ setup_secrets_scope }}'; it has to be 'all' or 'group'."
  when: setup_secrets_scope not in ['all', 'group']
  tags:
    - always

- name: Ask for the e-mail addresses and the API tokens
  ansible.builtin.include_tasks: prompt.yml
  when: setup_secrets_scope == 'all'
  tags:
    - always

- name: Ask which group is written
  ansible.builtin.include_tasks: group_prompt.yml
  when: setup_secrets_scope == 'group'
  tags:
    - always

- name: Generate the passwords
  ansible.builtin.include_tasks: generate.yml
  when: __setup_secrets_proceed
  tags:
    - always

- name: Render the secret files
  ansible.builtin.include_tasks: populate.yml
  when:
    - __setup_secrets_proceed
    - setup_secrets_scope == 'all'
  tags:
    - always

- name: Write the secret files of the group
  ansible.builtin.include_tasks: group_populate.yml
  when:
    - __setup_secrets_proceed
    - setup_secrets_scope == 'group'
  tags:
    - always
