---
# Questionnaire of roles/setup/secrets when its scope is one inventory group,
# run by the ansible-prompting-engine role. The format is documented in the
# role's docs/SPEC.md.
#
# setup_secrets_group_choices and setup_secrets_dir come from the role.
settings:
  var_prefix: initial_configure_user_input_
  intro: |-
    Secrets of one inventory group (group_vars/all/z_common_hosts_secrets).
    Press Enter to accept a default; Ctrl+C, then A, aborts.
  review: true

prompts:
  - id: group
    prompt: Inventory group to write the secrets of
    help: >-
      The groups of the inventory that have secret templates, with the
      directories each one writes. The groups with no secret of their own are
      not listed.
    type: choice
    choices: "{{ setup_secrets_group_choices }}"

  - id: keep_existing
    prompt: Keep the values already written where the field exists?
    help: >-
      The files are rendered again from the templates, then every field that
      the file on disk already has keeps its old value, however deeply it is
      nested and including the items of lists. Only the fields the templates
      added get a freshly generated value, so the credentials already
      deployed on the hosts are not rotated. Answering no generates every
      value again.
    type: bool
    default: "{{ setup_secrets_keep_existing | bool }}"

  - id: replace_group_secrets
    prompt: "DANGER: replace every value of '{{ answers.group }}' with a freshly generated one?"
    help: >-
      Every secret of the group is regenerated, so the hosts of that group
      have to be deployed again with the new credentials. The previous file is
      kept next to the new one as a .bak. Answering no ends the questionnaire
      and changes nothing.
    type: bool
    default: false
    when: not answers.keep_existing
    next:
      - when: not answer
        goto: _end
