---
# Questionnaire of roles/setup/secrets, run by the ansible-prompting-engine
# role. The format is documented in the role's docs/SPEC.md.
#
# setup_secrets_existing_count and setup_secrets_dir come from the role.
settings:
  var_prefix: initial_configure_user_input_
  intro: |-
    Shared secrets of the inventory (group_vars/all/z_common_hosts_secrets).
    Press Enter to accept a default; Ctrl+C, then A, aborts.
  review: true

prompts:
  - id: replace_secrets
    prompt: "DANGER: {{ setup_secrets_existing_count }} file(s) already exist in {{ setup_secrets_dir }}. Replace ALL of them?"
    help: >-
      Every secret file there is overwritten with freshly generated values.
      Make a backup first if they matter. Answering no ends the questionnaire
      and changes nothing.
    type: bool
    default: false
    when: setup_secrets_existing_count | int > 0
    next:
      - when: not answer
        goto: _end

  - id: email_main
    prompt: Main e-mail address
    help: >-
      Not used by the roles yet. For convenience, the e-mail address linked
      to the domain registrar.
    validate:
      - pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        msg: "'{{ answer }}' does not look like an e-mail address."

  - id: email_domain
    prompt: E-mail address for the domains
    help: Enter to reuse the main address.
    default: "{{ answers.email_main }}"
    validate:
      - pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        msg: "'{{ answer }}' does not look like an e-mail address."

  - id: gh_token_eget
    prompt: GitHub API token for eget
    help: >-
      Raises the GitHub API rate limit when eget downloads binaries; created at
      https://github.com/settings/tokens. Leave empty if you have none.
    secret: true
    required: false
    validate:
      - pattern: '^(gh[a-z]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})$'
        msg: That does not look like a GitHub token (ghp_..., gho_... or github_pat_...).

  - id: gh_token_debget
    prompt: GitHub API token for deb-get
    help: Leave empty to reuse the eget token.
    secret: true
    required: false
    when: answers.gh_token_eget is defined
    validate:
      - pattern: '^(gh[a-z]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})$'
        msg: That does not look like a GitHub token (ghp_..., gho_... or github_pat_...).

  - id: acme_email
    prompt: E-mail address for the ACME (Let's Encrypt) certificates
    help: Enter to reuse the address for the domains.
    default: "{{ answers.email_domain }}"
    validate:
      - pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        msg: "'{{ answer }}' does not look like an e-mail address."

  - id: cloudflare_api_token_dns
    prompt: Cloudflare API token for DNS management
    help: >-
      Needs permission to edit the DNS records of your zones. Leave empty if
      you have none.
    secret: true
    required: false
    validate:
      - pattern: '^[A-Za-z0-9_-]{30,}$'
        msg: That does not look like a Cloudflare API token.
