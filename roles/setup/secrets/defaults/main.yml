---
# defaults file for roles/setup/secrets

# Where the inventory lives: the directory of the inventory the play runs with,
# otherwise inventory/ of the project.
setup_secrets_project_dir: "{{ (role_path ~ '/../../..') | realpath }}"
setup_secrets_inventory_dir: "{{ inventory_dir | default(setup_secrets_project_dir ~ '/inventory', true) }}"

# Where the shared secrets are written, and the files that may already be
# there without counting as existing secrets (they are never deleted anyway).
setup_secrets_dir: "{{ setup_secrets_inventory_dir }}/group_vars/all/z_common_hosts_secrets"
setup_secrets_keep_files:
  - .gitkeep
  - user.yaml

# The tree rendered into setup_secrets_dir, relative to this role's templates/.
setup_secrets_template_dir: group_vars/all/z_common_hosts_secrets

# Generated passwords: one initial_configure_generated_password_<name> fact per
# entry, for the templates to use. `length` overrides the default length.
setup_secrets_password_length: 50
setup_secrets_password_special_chars: "-=+!#$()[]"
setup_secrets_generated_passwords:
  - name: root
  - name: docker_autodiscovery_basic_auth_users
  - name: analytics_node_logporter_standard_user
  - name: analytics_node_logporter_prometheus
  - name: analytics_node_docker_exporter
  - name: analytics_node_fail2ban_exporter
  - name: analytics_node_frps_exporter_client
  - name: analytics_node_frps_exporter_prometheus
  - name: analytics_node_node_exporter_client
  - name: analytics_node_node_exporter_prometheus
  - name: analytics_node_vector_standard_user
  - name: analytics_node_vector_prometheus
  - name: analytics_node_vector_victorialogs
  - name: analytics_server_mongodb_exporter
  - name: analytics_server_prometheus_grafana
  - name: analytics_server_prometheus_user
  - name: analytics_server_pushgateway_client
  - name: analytics_server_pushgateway_prometheus
  - name: analytics_server_victorialogs
  - name: analytics_server_victoriametrics
  - name: backup_restic_server
  - name: rclone
  - name: proxy_client_frpc_client_dashboard
  - name: vpn_server_remnawave_metrics
  - name: vpn_caddy_metrics_client_user
  - name: vpn_caddy_metrics_prometheus_user
  - name: vpn_caddy_zapret_secret
  - name: vpn_common_frp_dashboard
  - name: vpn_common_frp_client_dashboard
  - name: vpn_common_frp_token
    length: 15
  - name: wg
  - name: wg_prometheus_metrics
  - name: vpn_server_remnawave_custom_login_route
  - name: vpn_server_remnawave_custom_login_route_path
  - name: matrix_server_db_password

# Preset answers for the prompts, by prompt id (see vars/prompts/input.yml),
# for unattended runs together with prompting_engine_interactive=false.
setup_secrets_prompt_answers: {}
