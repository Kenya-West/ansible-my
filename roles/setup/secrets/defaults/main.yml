---
# defaults file for roles/setup/secrets

# Where the inventory lives: the directory of the inventory the play runs with,
# otherwise inventory/ of the project.
setup_secrets_project_dir: "{{ (role_path ~ '/../../..') | realpath }}"
setup_secrets_inventory_dir: "{{ inventory_dir | default(setup_secrets_project_dir ~ '/inventory', true) }}"

# Where the shared secrets are written, and the files that may already be
# there without counting as existing secrets (they are never deleted anyway).
setup_secrets_dir: "{{ setup_secrets_inventory_dir }}/group_vars/all/z_common_hosts_secrets"
setup_secrets_keep_files:
  - .gitkeep
  - user.yaml

# The tree rendered into setup_secrets_dir, relative to this role's templates/.
setup_secrets_template_dir: group_vars/all/z_common_hosts_secrets

# Which part of the template tree a run writes: "all" is the whole of it, as
# step 2 of the initial configuration does; "group" asks for one inventory
# group and writes only the directories that belong to it.
setup_secrets_scope: all

# The group to write when the scope is "group". Empty asks for it.
setup_secrets_group: ""

# Where the inventory groups are looked up to build the list to choose from.
setup_secrets_group_vars_dir: "{{ setup_secrets_inventory_dir }}/group_vars"

# Directories of the group_vars scan that name no deployable group.
setup_secrets_group_vars_exclude: []

# The template directories of an inventory group, for the groups whose
# directory is not simply named after them. A group that is not listed here
# uses the directory of its own name, and a group that resolves to no
# existing directory is left out of the list to choose from.
setup_secrets_group_template_dirs:
  all:
    - 0_all
  general_vps_prepare:
    - 1_general_vps_prepare

# Whether a value already written stays when the file is rendered again. The
# keys the old and the new file have in common keep the old value, the keys
# the templates added get a freshly generated one. Prompted for; this is the
# default of the prompt.
setup_secrets_keep_existing: true

# The keys that identify an item of a list of mappings when the old and the
# new list are paired, tried in this order. An item that has none of them is
# paired by its position.
setup_secrets_preserve_id_keys:
  - name
  - id
  - username
  - user
  - job_name
  - hostname
  - host
  - target

# Generated passwords: one initial_configure_generated_password_<name> fact per
# entry, for the templates to use. The passwords of a server are generated by
# setup/server, for that server only. `length` overrides the default length.
setup_secrets_password_length: 50
setup_secrets_password_special_chars: "-=+!#$()[]"
setup_secrets_generated_passwords:
  - name: root
  - name: docker_autodiscovery_basic_auth_users
  - name: analytics_node_logporter_standard_user
  - name: analytics_node_docker_exporter_standard_user
  - name: analytics_node_fail2ban_exporter_standard_user
  - name: analytics_node_frps_exporter_client
  - name: analytics_node_frps_exporter_prometheus
  - name: analytics_node_node_exporter_client
  - name: analytics_node_vector_standard_user
  - name: rclone
  - name: proxy_client_frpc_client_dashboard
  - name: vpn_caddy_metrics_client_user
  - name: vpn_caddy_zapret_secret
  - name: vpn_common_frp_dashboard
  - name: vpn_common_frp_client_dashboard
  - name: vpn_common_frp_token
    length: 15
  - name: wg
  - name: wg_prometheus_metrics

# Preset answers for the prompts, by prompt id (see vars/prompts/input.yml),
# for unattended runs together with prompting_engine_interactive=false.
setup_secrets_prompt_answers: {}
