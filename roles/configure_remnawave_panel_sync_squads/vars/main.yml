---
# vars file for roles/configure_remnawave_panel_sync_squads

# The panel of the host the role runs against, for the module_defaults.
crpss_panel:
  panel_url: "{{ vpn_server_remnawave_panel_url }}"
  token: "{{ vpn_server_remnawave_api_token }}"
  # An empty key is the same as none: the client only sends the header when
  # there is something to put in it.
  api_key: >-
    {{
      vpn_server_remnawave_custom_login_route_api_token | default('')
      if vpn_server_remnawave_access_mode == 'caddy_custom_path'
      else ''
    }}
  validate_certs: "{{ vpn_server_remnawave_panel_validate_certs }}"
  timeout: "{{ vpn_server_remnawave_panel_timeout }}"

# The rules with an empty external squad ('' or null, meaning none) as ''.
crpss_rules: >-
  {%- set out = [] -%}
  {%- for rule in vpn_server_remnawave_squads_sync -%}
  {%-   set _ = out.append({'internal_squad': rule.internal_squad, 'external_squad': rule.external_squad or ''}) -%}
  {%- endfor -%}
  {{ out }}

# The skip conditions; a user any of them hits is never touched.
crpss_exclude_users: >-
  {{ vpn_server_remnawave_squads_sync_exclude_users | default([], true) | select | list }}
crpss_skip_multiple: >-
  {{ vpn_server_remnawave_squads_sync_skip_multiple_internal_squads | default(false, true) | bool }}
crpss_skip_internal_squads: >-
  {{ vpn_server_remnawave_squads_sync_skip_internal_squads | default([], true) }}
crpss_skip_user_tags: >-
  {{ vpn_server_remnawave_squads_sync_skip_user_tags | default([], true) }}
