---
- name: Check whether termshot is installed
  ansible.builtin.stat:
    path: "{{ benchmarks_termshot_bin }}"
  register: benchmarks_termshot_bin_stat

- name: Install termshot with eget
  when: not benchmarks_termshot_bin_stat.stat.exists or benchmarks_termshot_update | bool
  block:
    - name: Check eget is installed, install or update it
      ansible.builtin.include_role:
        name: install_eget_inherelab

    # Only termshot is installed: the role gets just that one entry and its own
    # eget config, so the main eget.toml and the other packages stay untouched
    - name: Install termshot with install_packages_eget_inherelab
      ansible.builtin.include_role:
        name: install_packages_eget_inherelab
      vars:
        packages_binary_list: "{{ packages_binary_list_essentials | selectattr('repo', 'equalto', benchmarks_termshot_package_repo) | list }}"
        eget_config_location: "{{ benchmarks_termshot_eget_config }}"

- name: Check termshot runs
  ansible.builtin.command: "{{ benchmarks_termshot_bin }} --version"
  register: benchmarks_termshot_version
  changed_when: false

- name: Find which benchmark dependencies are missing
  ansible.builtin.shell: "command -v {{ item.command | quote }}"
  loop: "{{ benchmarks_termshot_dependencies }}"
  loop_control:
    label: "{{ item.command }}"
  register: benchmarks_termshot_dependency_check
  changed_when: false
  failed_when: false

- name: Install missing benchmark dependencies
  ansible.builtin.apt:
    name: >-
      {{ benchmarks_termshot_dependency_check.results
         | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.package')
         | unique
         | list }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: benchmarks_termshot_dependency_check.results | rejectattr('rc', 'equalto', 0) | list | length > 0
