---
# One benchmark: run it under termshot, then fetch the screenshot (and log)
- name: "{{ benchmark.file }} | run and fetch the screenshot"
  vars:
    benchmark_remote: "{{ benchmarks_termshot_workdir.path }}/{{ benchmark.file }}"
    benchmark_local: "{{ benchmarks_termshot_local_run_dir }}/{{ benchmark.file }}"
    benchmark_timeout: "{{ benchmark.timeout | default(benchmarks_termshot_timeout) | int }}"
  block:
    - name: "{{ benchmark.file }} | write the command to a script"
      ansible.builtin.copy:
        dest: "{{ benchmark_remote }}.sh"
        content: "{{ benchmark.command }}\n"
        mode: "0700"

    - name: "{{ benchmark.file }} | run under termshot (up to {{ benchmark_timeout }}s)"
      ansible.builtin.command:
        argv:
          - bash
          - "{{ benchmarks_termshot_workdir.path }}/termshot-capture.sh"
          - "{{ benchmarks_termshot_bin }}"
          - "{{ benchmark_remote }}.png"
          - "{{ benchmark.columns | default(benchmarks_termshot_columns) }}"
          - "{{ benchmark_timeout }}"
          - "{{ benchmark_remote }}.sh"
        chdir: "{{ benchmarks_termshot_workdir.path }}"
      environment:
        TERM: xterm-256color
      # Ansible's own limit, past the script's timeout plus rendering time
      async: "{{ benchmark_timeout | int + 300 }}"
      poll: 10
      register: benchmark_run
      changed_when: true
      failed_when: false

    - name: "{{ benchmark.file }} | save the raw output"
      ansible.builtin.copy:
        content: "{{ benchmark_run.stdout }}"
        dest: "{{ benchmark_local }}.log"
        mode: "0644"
      delegate_to: localhost
      become: false
      when:
        - benchmarks_termshot_save_logs | bool
        - benchmark_run.stdout | default('') | length > 0

    - name: "{{ benchmark.file }} | check the screenshot was made"
      ansible.builtin.stat:
        path: "{{ benchmark_remote }}.png"
      register: benchmark_png

    - name: "{{ benchmark.file }} | fail when there is no screenshot"
      ansible.builtin.fail:
        msg: >-
          termshot made no screenshot (rc={{ benchmark_run.rc | default('n/a') }}):
          {{ benchmark_run.stderr | default(benchmark_run.msg | default('')) | trim }}
      when: not benchmark_png.stat.exists

    - name: "{{ benchmark.file }} | fetch the screenshot"
      ansible.builtin.fetch:
        src: "{{ benchmark_remote }}.png"
        dest: "{{ benchmark_local }}.png"
        flat: true

    - name: "{{ benchmark.file }} | record the result"
      ansible.builtin.set_fact:
        benchmarks_termshot_results: >-
          {{ benchmarks_termshot_results + [{
               'name': benchmark.name,
               'ok': true,
               'status': 'ok' if benchmark_run.rc == 0
                         else 'stopped by timeout' if benchmark_run.rc == 143
                         else 'exit code ' ~ benchmark_run.rc,
             }] }}

  rescue:
    - name: "{{ benchmark.file }} | record the failure"
      ansible.builtin.set_fact:
        benchmarks_termshot_results: >-
          {{ benchmarks_termshot_results + [{
               'name': benchmark.name,
               'ok': false,
               'status': 'no screenshot: ' ~ (ansible_failed_result.msg | default('failed')),
             }] }}
