---
# tasks file for roles/run_benchmarks_termshot

- name: Assert every selected benchmark exists
  ansible.builtin.assert:
    that: benchmarks_termshot_select | difference(benchmarks_termshot_list | map(attribute='name')) | length == 0
    fail_msg: >-
      Unknown benchmarks in benchmarks_termshot_select:
      {{ benchmarks_termshot_select | difference(benchmarks_termshot_list | map(attribute='name')) | join(', ') }}
    quiet: true

- name: Start with no results
  ansible.builtin.set_fact:
    benchmarks_termshot_results: []

# One timestamp for every host, so a run's screenshots sit in same-named dirs
- name: Pick the run timestamp
  ansible.builtin.set_fact:
    benchmarks_termshot_run_id: "{{ now(fmt='%Y-%m-%d_%H%M%S') }}"
  run_once: true

- name: Set the local directory for this host's screenshots
  ansible.builtin.set_fact:
    benchmarks_termshot_local_run_dir: "{{ benchmarks_termshot_local_dir }}/{{ benchmarks_termshot_run_id }}"

- name: Install termshot and the benchmark dependencies
  ansible.builtin.include_tasks: install.yml

- name: Create the local screenshot directory
  ansible.builtin.file:
    path: "{{ benchmarks_termshot_local_run_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Run the benchmarks
  block:
    - name: Create a remote work directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .benchmarks
      register: benchmarks_termshot_workdir

    - name: Copy the capture scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ benchmarks_termshot_workdir.path }}/{{ item }}"
        mode: "0755"
      loop:
        - termshot-capture.sh
        - pty-runner.sh

    # Files are numbered by position in the full list, so a benchmark keeps
    # its number when only some are selected
    - name: Run each benchmark in turn
      ansible.builtin.include_tasks: run_one.yml
      loop: "{{ benchmarks_termshot_list }}"
      loop_control:
        loop_var: benchmark_item
        index_var: benchmark_index
        label: "{{ benchmark_item.name }}"
      vars:
        benchmark: "{{ benchmark_item | combine({'file': '%02d_%s' | format(benchmark_index + 1, benchmark_item.name)}) }}"
      when: >-
        benchmarks_termshot_select | length == 0
        or benchmark_item.name in benchmarks_termshot_select

  always:
    - name: Remove the remote work directory
      ansible.builtin.file:
        path: "{{ benchmarks_termshot_workdir.path }}"
        state: absent
      when: benchmarks_termshot_workdir.path is defined

- name: Show the results
  ansible.builtin.debug:
    msg: >-
      {{ benchmarks_termshot_results
         | map(attribute='name')
         | zip(benchmarks_termshot_results | map(attribute='status'))
         | map('join', ': ')
         | list
         + ['Saved to ' ~ benchmarks_termshot_local_run_dir] }}

- name: Fail when a benchmark produced no screenshot
  ansible.builtin.fail:
    msg: >-
      No screenshot from:
      {{ benchmarks_termshot_results | rejectattr('ok') | map(attribute='name') | join(', ') }}
  when:
    - benchmarks_termshot_fail_on_error | bool
    - benchmarks_termshot_results | rejectattr('ok') | list | length > 0
