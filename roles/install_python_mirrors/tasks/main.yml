---
# tasks file for roles/install_python_mirrors
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Validate country code
  ansible.builtin.assert:
    that:
      - country_code is match('^[a-z]{2}$')
    fail_msg: >-
      Invalid country code "{{ country_code }}" in
      inventory hostname "{{ inventory_hostname }}".
      Expected exactly two lowercase letters.

- name: "Create non-existent parent directories for {{ pip_config_file_root }} (root)"
  become: true
  become_user: root
  block:
    - name: create_dirs_traversal
      ansible.builtin.include_role:
        name: kwtoolset/create_dirs_traversal
      vars:
        create_dirs_traversal_path: "{{ pip_config_file_root }}"
        create_dirs_traversal_strip_leaf: true
        create_dirs_force_mode: "0775"

- name: "Create non-existent parent directories for {{ uv_config_file_root }} (root)"
  become: true
  become_user: root
  block:
    - name: create_dirs_traversal
      ansible.builtin.include_role:
        name: kwtoolset/create_dirs_traversal
      vars:
        create_dirs_traversal_path: "{{ uv_config_file_root }}"
        create_dirs_traversal_strip_leaf: true
        create_dirs_force_mode: "0775"

- name: "Create non-existent parent directories for {{ pip_config_file_user }}"
  block:
    - name: create_dirs_traversal
      ansible.builtin.include_role:
        name: kwtoolset/create_dirs_traversal
      vars:
        create_dirs_traversal_path: "{{ pip_config_file_user }}"
        create_dirs_traversal_strip_leaf: true
        create_dirs_force_mode: "0775"

- name: "Create non-existent parent directories for {{ uv_config_file_user }}"
  block:
    - name: create_dirs_traversal
      ansible.builtin.include_role:
        name: kwtoolset/create_dirs_traversal
      vars:
        create_dirs_traversal_path: "{{ uv_config_file_user }}"
        create_dirs_traversal_strip_leaf: true
        create_dirs_force_mode: "0775"

- name: "Render pip.conf to {{ pip_config_file_root }} (root)"
  become: true
  become_user: root
  ansible.builtin.template:
    src: pip.conf.j2
    dest: "{{ pip_config_file_root }}"
    mode: "0644"
  when: country_code_upper in python_mirrors_country_code_allowlist

- name: "Render uv.toml to {{ uv_config_file_root }} (root)"
  become: true
  become_user: root
  ansible.builtin.template:
    src: uv.toml.j2
    dest: "{{ uv_config_file_root }}"
    mode: "0644"
  when: country_code_upper in python_mirrors_country_code_allowlist

- name: "Render pip.conf to {{ pip_config_file_user }}"
  ansible.builtin.template:
    src: pip.conf.j2
    dest: "{{ pip_config_file_user }}"
    mode: "0644"
  when: country_code_upper in python_mirrors_country_code_allowlist

- name: "Render uv.toml to {{ uv_config_file_user }}"
  ansible.builtin.template:
    src: uv.toml.j2
    dest: "{{ uv_config_file_user }}"
    mode: "0644"
  when: country_code_upper in python_mirrors_country_code_allowlist
