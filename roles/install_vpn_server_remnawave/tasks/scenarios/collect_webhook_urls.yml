---
# Scenario: collect_webhook_urls
#
# Resolves and prints the value `vpn_server_remnawave_webhook_url` would get
# during the install scenario (which includes this file). Read-only: nothing
# is deployed or changed.

- name: Assert that the webhook URL is set for the supported projects
  ansible.builtin.assert:
    that:
      - vpn_server_remnawave_webhook_url_supported_projects_paths is defined
      - vpn_server_remnawave_webhook_url_supported_projects_paths | length > 0
    fail_msg: "The webhook URL must be set for the supported projects."
  tags:
    - always

- name: Check which supported project paths exist
  ansible.builtin.stat:
    path: "/home/{{ standard_user }}/{{ webhook_project.path }}"
  loop: "{{ vpn_server_remnawave_webhook_url_supported_projects_paths | selectattr('path', 'string') | list }}"
  loop_control:
    loop_var: webhook_project
    label: "{{ webhook_project.path }}"
  register: webhook_projects_stat
  tags:
    - always

- name: Find deployed instance indexes of indexable projects
  ansible.builtin.find:
    paths: "/home/{{ standard_user }}/{{ webhook_stat.webhook_project.path }}"
    file_type: directory
    patterns: '^[0-9]+$'
    use_regex: true
  loop: "{{ webhook_projects_stat.results | selectattr('stat.exists') | selectattr('webhook_project.indexable', 'defined') | selectattr('webhook_project.indexable') | list }}"
  loop_control:
    loop_var: webhook_stat
    label: "{{ webhook_stat.webhook_project.path }}"
  register: webhook_projects_instances
  tags:
    - always

- name: List webhook candidates (one per project, or per deployed instance of indexable ones)
  ansible.builtin.set_fact:
    webhook_candidates: >-
      {%- set out = [] -%}
      {%- for res in webhook_projects_stat.results if res.stat.exists -%}
      {%- set p = res.webhook_project -%}
      {%- if p.indexable | default(false) -%}
      {%- for inst in webhook_projects_instances.results if inst.webhook_stat.webhook_project.path == p.path -%}
      {%- for idx in inst.files | map(attribute='path') | map('basename') | map('int') | sort -%}
      {%- set _ = out.append({'project': p, 'index': idx}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- else -%}
      {%- set _ = out.append({'project': p, 'index': none}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    webhook_urls: "{{ (vpn_server_remnawave_webhook_url | default('', true)).split(',') | select | list }}"
  tags:
    - always

# Per-instance vars (base_url_var) are resolved lazily, so current_index must be
# a task var here, not a Jinja loop variable.
- name: Build webhook URLs of the enabled candidates
  ansible.builtin.set_fact:
    webhook_urls: >-
      {{ webhook_urls + ['https://' ~ lookup('ansible.builtin.vars', webhook_candidate.project.base_url_var) ~ (webhook_bot.remnawave_webhook_path | default(webhook_candidate.project.webhook_path | default('')))] }}
  loop: "{{ webhook_candidates }}"
  loop_control:
    loop_var: webhook_candidate
    label: "{{ webhook_candidate.project.path }}{{ '' if webhook_candidate.index is none else '/' ~ webhook_candidate.index }}"
  vars:
    current_index: "{{ webhook_candidate.index }}"
    webhook_bots: "{{ lookup('ansible.builtin.vars', webhook_candidate.project.settings_var, default=[]) if webhook_candidate.project.settings_var is defined else [] }}"
    webhook_bot: "{{ webhook_bots[webhook_candidate.index] if (webhook_candidate.index is not none and webhook_candidate.index < (webhook_bots | length)) else {} }}"
  when: >-
    webhook_candidate.project.settings_var is not defined
    or (webhook_bot.remnawave_webhook_enabled | default(false) | bool)
  tags:
    - always

- name: Set vpn_server_remnawave_webhook_url
  ansible.builtin.set_fact:
    vpn_server_remnawave_webhook_url: "{{ webhook_urls | unique | join(',') }}"
  tags:
    - always

- name: Show the resulting webhook URL value
  ansible.builtin.debug:
    msg: "vpn_server_remnawave_webhook_url: '{{ vpn_server_remnawave_webhook_url | default('') }}'"
  tags:
    - always
