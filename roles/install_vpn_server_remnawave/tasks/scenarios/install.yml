---
# Scenario: install (default)
#
# Full deployment of the Remnawave panel.

- name: Add to source_paths the current role templates directory
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        (
            source_paths_add_role_dirs
            | default([])
            | map('regex_replace', '^(.*)$', this_role_path ~ '/\1/')
            | list
          )
        + (source_paths_add_repo_dirs | default([]))
        + (source_paths_add_user_dirs | default([]))
      }}
  tags:
    - always

- name: Check which source_paths actually exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ source_paths }}"
  delegate_to: localhost
  become: false
  register: source_paths_stat
  tags:
    - always

- name: Exclude non-existing paths from source_paths
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        source_paths_stat.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  tags:
    - always

- name: Run a fresh backup before updating the panel image
  become: true
  become_user: "{{ pgdump_backup_user }}"
  environment:
    DOCKER_HOST: "{{ pgdump_backup_docker_host if pgdump_backup_docker_host | length > 0 else ('' if pgdump_backup_docker_context | length > 0 else omit) }}"
    DOCKER_CONTEXT: "{{ pgdump_backup_docker_context if pgdump_backup_docker_context | length > 0 else ('' if pgdump_backup_docker_host | length > 0 else omit) }}"
  ansible.builtin.command:
    argv:
      - "{{ pgdump_backup_python }}"
      - "{{ pgdump_runner_path }}"
      - --manifest-dir
      - "{{ pgdump_manifest_dir }}"
      - --output-root
      - "{{ pgdump_backup_location_root_path }}"
      - --target
      - remnawave-panel-db
      - --require-available
  when: "'backup_restic_node' in group_names"
  tags:
    - never
    - update_image_hard
    - update_image_soft

- name: Ensure Docker network {{ docker_vpn_server_remnawave_network }} exists with specific settings
  community.docker.docker_network:
    name: "{{ docker_vpn_server_remnawave_network }}"
    driver: bridge
    state: present

- name: compose_pull
  ansible.builtin.include_role:
    name: kwtoolset/compose_pull
    apply:
      tags:
        - update_image_hard
        - update_image_soft
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_image_soft

- name: compose_down
  ansible.builtin.include_role:
    name: kwtoolset/compose_down
    apply:
      tags:
        - update_image_hard
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_config_hard

- name: Collect webhook URLs for supported projects
  ansible.builtin.include_tasks:
    file: collect_webhook_urls.yml
  tags:
    - update_config_hard
    - update_config_soft

- name: copy_files_templating
  ansible.builtin.include_role:
    name: kwtoolset/copy_files_templating
    apply:
      tags:
        - update_config_hard
        - update_config_soft
  vars:
    copy_files_templating_dir_list:
      - src: "{{ source_path }}"
        dest: "{{ dest_path_full }}"
        default_mode: "0775"
  with_items: "{{ source_paths }}"
  loop_control:
    loop_var: source_path
  tags:
    - update_config_hard
    - update_config_soft

- name: compose_restart
  ansible.builtin.include_role:
    name: kwtoolset/compose_restart
    apply:
      tags:
        - never
        - update_config_soft
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - never
    - update_config_soft

- name: compose_up
  ansible.builtin.include_role:
    name: kwtoolset/compose_up
    apply:
      tags:
        - update_image_hard
        - update_image_soft
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_image_soft
    - update_config_hard

- name: Add port {{ vpn_server_remnawave_external_port | default('undefined') }} to UFW
  become: true
  become_user: root
  community.general.ufw:
    rule: allow
    port: "{{ vpn_server_remnawave_external_port }}"
    proto: tcp
  when:
    - vpn_server_remnawave_external_port is defined
    - vpn_server_remnawave_external_port | string | length > 0
  tags:
    - ports_ufw

- name: Declare and reconcile panel PostgreSQL backups
  ansible.builtin.include_role:
    name: kwtoolset/declare_postgres_backup
    apply:
      tags:
        - declare_backups
        - update_config_hard
  vars:
    pgdump_declare_owner: remnawave-panel
    pgdump_declare_legacy_script_subdirectories: [remnawave-panel]
    pgdump_declare_targets: "{{ vpn_server_remnawave_postgres_backup_targets }}"
  when: "'backup_restic_node' in group_names"
  tags:
    - declare_backups
    - update_config_hard
