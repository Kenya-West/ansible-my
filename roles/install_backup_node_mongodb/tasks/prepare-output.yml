---
- name: Build every output directory component for safe ownership migration
  ansible.builtin.set_fact:
    mongodump_output_directories: >-
      {%- set paths = [mongodump_backup_location_root_path] -%}
      {%- for target in mongodump_targets -%}
      {%- set parts = target.output.subdirectory.split('/') -%}
      {%- for count in range(1, parts | length + 1) -%}
      {%- set _ = paths.append(mongodump_backup_location_root_path ~ '/' ~ (parts[:count] | join('/'))) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ paths | unique }}

- name: Inspect output directory components without following symlinks
  become: true
  become_user: root
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ mongodump_output_directories }}"
  register: mongodump_output_stats

- name: Reject symlinked output directories before privileged ownership changes
  ansible.builtin.assert:
    that:
      - not item.stat.islnk | default(false)
      - not item.stat.exists or item.stat.isdir
    fail_msg: MongoDB output directories must be real directories, not symlinks.
  loop: "{{ mongodump_output_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Migrate output directories without deleting previous dumps
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mongodump_backup_user }}"
    mode: "0700"
    follow: false
  loop: "{{ mongodump_output_directories }}"

