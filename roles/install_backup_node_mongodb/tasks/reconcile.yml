---
- name: Prepare host Database Tools only for direct targets
  ansible.builtin.include_tasks: tools.yml

- name: Enable persistent user services after logout
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ mongodump_backup_user }}"]
    creates: "/var/lib/systemd/linger/{{ mongodump_backup_user }}"

- name: Start the user service manager
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "user@{{ ansible_facts.getent_passwd[mongodump_backup_user][1] }}.service"
    state: started

- name: Reconcile user-owned MongoDB backups
  become: true
  become_user: "{{ mongodump_backup_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ mongodump_runtime_dir }}"
    DOCKER_HOST: "{{ mongodump_backup_docker_host if mongodump_backup_docker_host | length > 0 else ('' if mongodump_backup_docker_context | length > 0 else omit) }}"
    DOCKER_CONTEXT: "{{ mongodump_backup_docker_context if mongodump_backup_docker_context | length > 0 else ('' if mongodump_backup_docker_host | length > 0 else omit) }}"
  block:
    - name: Create private registry and runner directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ mongodump_manifest_dir }}"
        - "{{ mongodump_runner_path | dirname }}"

    - name: Ensure a user-level unit directory exists
      ansible.builtin.file:
        path: "{{ mongodump_systemd_unit_path }}"
        state: directory
        mode: "0755"

    - name: Install generic MongoDB dump runner
      ansible.builtin.copy:
        src: mongodb_backup.py
        dest: "{{ mongodump_runner_path }}"
        mode: "0700"

    - name: Prepare legacy root-owned dump directory permissions
      ansible.builtin.include_tasks: prepare-output.yml
      when: mongodump_migrate_legacy | bool

    - name: Validate the complete registry including path traversal and symlinks
      ansible.builtin.command:
        argv:
          - "{{ mongodump_backup_python }}"
          - "{{ mongodump_runner_path }}"
          - --manifest-dir
          - "{{ mongodump_manifest_dir }}"
          - --output-root
          - "{{ mongodump_backup_location_root_path }}"
          - --validate
          - --validate-connections
      changed_when: false
      check_mode: false
      no_log: true

    - name: Create user-owned dump root when legacy migration is disabled
      ansible.builtin.file:
        path: "{{ mongodump_backup_location_root_path }}"
        state: directory
        mode: "0700"
      when: not mongodump_migrate_legacy | bool

    - name: Create user-owned dump directories
      ansible.builtin.file:
        path: "{{ mongodump_backup_location_root_path }}/{{ mongodump_target.output.subdirectory }}"
        state: directory
        mode: "0700"
      loop: "{{ mongodump_targets }}"
      loop_control:
        loop_var: mongodump_target
        label: "{{ mongodump_target.id }}"

    - name: Retire units for targets no longer declared
      ansible.builtin.include_tasks: retire-units.yml

    - name: Install user-level services and timers without running dumps on deployment
      ansible.builtin.include_role:
        name: 0x0I.systemd
      vars:
        unit_config: "{{ mongodump_unit_configs }}"
        systemd_backup_files: false
      when: mongodump_unit_configs | length > 0

    - name: Remove legacy cron schedules after new units are reconciled
      ansible.builtin.include_tasks: migrate-cron.yml
      when: mongodump_migrate_legacy | bool
