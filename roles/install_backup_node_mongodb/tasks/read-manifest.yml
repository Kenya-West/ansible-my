---
- name: Read producer manifest
  ansible.builtin.slurp:
    src: "{{ mongodump_manifest_file.path }}"
  register: mongodump_manifest_content
  no_log: true

- name: Decode producer manifest
  ansible.builtin.set_fact:
    mongodump_manifest: "{{ mongodump_manifest_content.content | b64decode | from_json }}"
  no_log: true

- name: Require the manifest filename to match its owner
  ansible.builtin.assert:
    that:
      - (mongodump_manifest_file.path | basename) == mongodump_manifest.owner ~ '.json'

- name: Validate and collect persisted targets
  ansible.builtin.include_tasks: collect-manifest.yml
