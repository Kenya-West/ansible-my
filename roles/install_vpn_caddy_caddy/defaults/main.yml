---
# defaults file for roles/install_vpn_caddy_caddy
project_dir: "{{ vpn_caddy.project.paths.caddy | ansible.builtin.basename }}"
project_root_dir: "{{ vpn_caddy.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ vpn_caddy.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

caddy_fake_static_files_template_name: 503 error page v2

# The analytics servers scraping this host by component (caddy, and for an
# analytics_node node_exporter and docker_exporter), resolved by
# tasks/analytics_servers.yml from host_relations. The prometheus users of the
# metrics endpoints are theirs; the Caddy metrics hash has a salt derived from
# the hostname so that it does not change between runs.
vpn_caddy_caddy_metrics_prometheus_user_password: >-
  {{ hostvars[install_vpn_caddy_caddy_analytics_servers.caddy].prometheus_server_scrape_credentials.caddy.password
     | password_hash('bcrypt', salt=((inventory_hostname ~ '-caddy-metrics') | hash('sha256'))[:21] ~ 'e') }}
install_vpn_caddy_caddy_node_exporter_users: >-
  {{ (node_exporter_basic_auth_users_for_caddy | default([])
      | rejectattr('name', 'equalto',
                   hostvars[install_vpn_caddy_caddy_analytics_servers.node_exporter].prometheus_server_scrape_credentials.node_exporter.username)
      | list)
     + [{'name': hostvars[install_vpn_caddy_caddy_analytics_servers.node_exporter].prometheus_server_scrape_credentials.node_exporter.username,
         'password': hostvars[install_vpn_caddy_caddy_analytics_servers.node_exporter].prometheus_server_scrape_credentials.node_exporter.password,
         'hash_scheme': 'bcrypt'}] }}
install_vpn_caddy_caddy_docker_exporter_users: >-
  {{ (docker_exporter_server_users | default([])
      | rejectattr('name', 'equalto',
                   hostvars[install_vpn_caddy_caddy_analytics_servers.docker_exporter].prometheus_server_scrape_credentials.docker_exporter.username)
      | list)
     + [{'name': hostvars[install_vpn_caddy_caddy_analytics_servers.docker_exporter].prometheus_server_scrape_credentials.docker_exporter.username,
         'password': hostvars[install_vpn_caddy_caddy_analytics_servers.docker_exporter].prometheus_server_scrape_credentials.docker_exporter.password,
         'hash_scheme': 'bcrypt'}] }}
