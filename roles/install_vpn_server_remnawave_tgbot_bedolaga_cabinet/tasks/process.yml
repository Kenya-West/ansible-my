- name: Add to source_paths the current role templates directory
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        (
            source_paths_add_role_dirs
            | default([])
            | map('regex_replace', '^(.*)$', this_role_path ~ '/\1/')
            | list
          )
        + (source_paths_add_repo_dirs | default([]))
        + (source_paths_add_user_dirs | default([]))
      }}
  tags:
    - always

- name: Add to install_vpn_server_remnawave_tgbot_bedolaga_cabinet_source_paths the current role templates directory
  ansible.builtin.set_fact:
    install_vpn_server_remnawave_tgbot_bedolaga_cabinet_source_paths_currentindex: >-
      {{
        (
            source_paths
            | map('regex_replace', '$', '/' ~ (current_index | string) ~ '/')
            | list
          )
      }}
  tags:
    - always

- name: "Create non-existent parent directories for {{ dest_project_fullpath }}"
  ansible.builtin.include_role:
    name: kwtoolset/create_dirs_traversal
    apply:
      tags:
        - update_config_hard
  vars:
    create_dirs_traversal_path: "{{ dest_project_fullpath }}"
    create_dirs_traversal_strip_leaf: true
    create_dirs_force_mode: "0775"
  tags:
    - update_config_hard

- name: Set compose_project_name for this bot instance
  ansible.builtin.set_fact:
    compose_project_name: "{{ vpn_server_remnawave_tgbot_bedolaga_cabinet_settings_global.service_name_prefix }}-{{ current_index | string }}"
  tags:
    - always

- name: Pull container images for this bot instance
  ansible.builtin.include_role:
    name: kwtoolset/compose_pull
    apply:
      tags:
        - update_image_hard
        - update_image_soft
  vars:
    project_paths:
      - "{{ dest_project_fullpath }}"
  tags:
    - update_image_hard
    - update_image_soft

- name: compose_down
  ansible.builtin.include_role:
    name: kwtoolset/compose_down
    apply:
      tags:
        - update_image_hard
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_project_fullpath }}"
  tags:
    - update_image_hard
    - update_config_hard

- name: copy_files_templating
  ansible.builtin.include_role:
    name: kwtoolset/copy_files_templating
    apply:
      tags:
        - update_config_hard
        - update_config_soft
  vars:
    copy_files_templating_dir_list:
      - src: "{{ item }}"
        dest: "{{ dest_project_fullpath }}"
        default_mode: "0775"
  with_items: "{{ source_paths }}"
  tags:
    - update_config_hard
    - update_config_soft

- name: Start containers for this bot instance
  ansible.builtin.include_role:
    name: kwtoolset/compose_up
    apply:
      tags:
        - update_image_hard
        - update_image_soft
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_project_fullpath }}"
  tags:
    - update_image_hard
    - update_image_soft
    - update_config_hard

- name: Restart containers for this bot instance
  ansible.builtin.include_role:
    name: kwtoolset/compose_restart
    apply:
      tags:
        - update_config_soft
  vars:
    project_paths:
      - "{{ dest_project_fullpath }}"
  tags:
    - never
    - update_config_soft

- name: Add port external port to UFW (if defined)
  become: true
  become_user: root
  community.general.ufw:
    rule: allow
    port: "{{ vpn_server_remnawave_tgbot_bedolaga_cabinet_external_port }}"
    proto: tcp
  when:
    - vpn_server_remnawave_tgbot_bedolaga_cabinet_external_port is defined
    - vpn_server_remnawave_tgbot_bedolaga_cabinet_external_port | length > 0

- name: Reminder to run ufw.yaml playbook (if port defined)
  ansible.builtin.debug:
    msg: |
      Reminder: Run the ufw.yaml playbook for host {{ inventory_hostname }} and environment.
      Example command: ansible-playbook -i {{ inventory_file | basename }} ufw.yaml --limit {{ inventory_hostname }}
  when:
    - vpn_server_remnawave_tgbot_bedolaga_cabinet_external_port is defined
    - vpn_server_remnawave_tgbot_bedolaga_cabinet_external_port | length > 0

- name: Empty the fact install_vpn_server_remnawave_tgbot_bedolaga_cabinet_source_paths_currentindex
  ansible.builtin.set_fact:
    source_paths: []
    install_vpn_server_remnawave_tgbot_bedolaga_cabinet_source_paths_currentindex: []
