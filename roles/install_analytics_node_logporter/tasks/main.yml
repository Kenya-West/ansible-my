---
# tasks file for roles/install_analytics_node_logporter

- name: Capture this role's path so nested role can use the parent role_path
  ansible.builtin.set_fact:
    this_role_path: "{{ role_path }}"
  tags:
    - always

- name: Assert the analytics server of this host is resolved
  ansible.builtin.assert:
    that:
      - install_analytics_node_logporter_server | length > 0
    fail_msg: >-
      No analytics_server resolved for {{ inventory_hostname }}: set host_relations
      (analytics_server.components.logporter, analytics_server or default) in its host_vars; the
      playbook resolves it with kwtoolset/resolve_host_relations before this role.
    quiet: true
  tags:
    - always

- name: Add to source_paths the current role templates directory
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        (
            source_paths_add_role_dirs
            | default([])
            | map('regex_replace', '^(.*)$', this_role_path ~ '/\1/')
            | list
          )
        + (source_paths_add_repo_dirs | default([]))
        + (source_paths_add_user_dirs | default([]))
      }}
  tags:
    - always

- name: Check which source_paths actually exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ source_paths }}"
  delegate_to: localhost
  become: false
  register: source_paths_stat
  tags:
    - always

- name: Exclude non-existing paths from source_paths
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        source_paths_stat.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  tags:
    - always

- name: "Create non-existent parent directories for {{ dest_path_full }}"
  ansible.builtin.include_role:
    name: kwtoolset/create_dirs_traversal
    apply:
      tags:
        - update_config_hard
  vars:
    create_dirs_traversal_path: "{{ dest_path_full }}"
    create_dirs_traversal_strip_leaf: true
    create_dirs_force_mode: "0775"
  tags:
    - update_config_hard

- name: Ensure Docker network {{ analytics_node_network_name }} exists with specific settings
  community.docker.docker_network:
    name: "{{ analytics_node_network_name }}"
    driver: bridge
    state: present

- name: copy_files_templating
  ansible.builtin.include_role:
    name: kwtoolset/copy_files_templating
    apply:
      tags:
        - update_config_hard
        - update_config_soft
  vars:
    copy_files_templating_dir_list:
      - src: "{{ source_path }}"
        dest: "{{ dest_path_full }}"
        default_mode: "0775"
  with_items: "{{ source_paths }}"
  loop_control:
    loop_var: source_path
  tags:
    - update_config_hard
    - update_config_soft

- name: compose_restart
  ansible.builtin.include_role:
    name: kwtoolset/compose_restart
    apply:
      tags:
        - never
        - update_config_soft
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - never
    - update_config_soft

- name: compose_pull
  ansible.builtin.include_role:
    name: kwtoolset/compose_pull
    apply:
      tags:
        - update_image_hard
        - update_image_soft
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_image_soft

- name: compose_down
  ansible.builtin.include_role:
    name: kwtoolset/compose_down
    apply:
      tags:
        - update_image_hard
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_config_hard

- name: compose_up
  ansible.builtin.include_role:
    name: kwtoolset/compose_up
    apply:
      tags:
        - update_image_hard
        - update_image_soft
        - update_config_hard
  vars:
    project_paths:
      - "{{ dest_path_full }}"
  tags:
    - update_image_hard
    - update_image_soft
    - update_config_hard

- name: Add port {{ logporter_exporter_external_port | default('undefined') }} to UFW
  become: true
  become_user: root
  community.general.ufw:
    rule: allow
    port: "{{ logporter_exporter_external_port }}"
    proto: tcp
  when:
    - logporter_exporter_external_port is defined
    - logporter_exporter_external_port | string | length > 0
