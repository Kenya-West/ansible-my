---
# defaults file for roles/configure_remnawave_panel_get_backup
project_dir: "{{ vpn_server_remnawave.project.paths.panel | ansible.builtin.basename }}"
project_root_dir: "{{ vpn_server_remnawave.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ vpn_server_remnawave.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

# Manual backup uses the same registry, lock and runner as the timer.
remnawave_backup_target_id: remnawave-panel-db

# Remnawave dump on the remote host, and where it is saved on the controller (repo root temp/)
remnawave_backup_remote_path: "{{ pgdump_backup_location_root_path }}/remnawave-panel/dump_remnawave_panel.sql"
remnawave_backup_local_dir: "{{ (inventory_dir ~ '/../temp') | realpath }}"
