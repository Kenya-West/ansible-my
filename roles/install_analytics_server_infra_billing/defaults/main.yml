---
# defaults file for roles/install_analytics_server_infra_billing
project_dir: "{{ analytics_server.project.paths.infra_billing | ansible.builtin.basename }}"
project_root_dir: "{{ analytics_server.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ analytics_server.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

infra_billing_postgres_backup_skip_if_unavailable: true

infra_billing_postgres_backup_targets:
  - id: infra-billing-db
    project_path: "{{ dest_path_full }}"
    execution:
      driver: compose_exec
      skip_if_unavailable: "{{ infra_billing_postgres_backup_skip_if_unavailable }}"
      service: infra-billing-db
      project_name: "{{ compose_project_name }}"
    connection:
      source: container_environment
    dump:
      scope: cluster
      format: plain
    output:
      subdirectory: infra-billing
      filename: dump_infra_billing.sql
