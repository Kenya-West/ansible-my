---
# defaults file for roles/git_sync
role_state: present

project_dir: "{{ git_sync.project.paths.mirror | ansible.builtin.basename }}"
project_root_dir: "{{ git_sync.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - files
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ git_sync.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

git_sync_user: "{{ standard_user }}"
git_sync_home: "/home/{{ git_sync_user }}"
git_sync_systemd_unit_path: "{{ git_sync_home }}/.config/systemd/user"
git_sync_unit_prefix: git-sync-
git_sync_calendar: "*-*-* 00:00:00"
git_sync_randomized_delay: "5min"
git_sync_timeout: "6h"
git_sync_migrate_legacy_cron: true
git_sync_legacy_cron_name_prefix: "git-sync:"
