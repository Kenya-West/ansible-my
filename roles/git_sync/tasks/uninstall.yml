- name: Remove Git sync timers and services per config
  ansible.builtin.include_tasks:
    file: systemd.yml
    apply:
      tags: [uninstall]
  loop: "{{ git_sync_configs }}"
  loop_control:
    loop_var: config_item
  tags:
    - uninstall

- name: Remove {{ dest_path_full }} directory
  ansible.builtin.file:
    path: "{{ dest_path_full }}"
    state: absent
