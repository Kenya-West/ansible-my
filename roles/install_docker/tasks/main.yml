---
# tasks file for roles/install_docker

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Validate country code
  ansible.builtin.assert:
    that:
      - country_code is match('^[a-z]{2}$')
    fail_msg: >-
      Invalid country code "{{ country_code }}" in
      inventory hostname "{{ inventory_hostname }}".
      Expected exactly two lowercase letters.

- name: Set docker_repo_url fact based on country code
  ansible.builtin.set_fact:
    docker_repo_url: >-
      {{ (
            docker_mirrors
            | selectattr('preferred_country_code', 'equalto', country_code_upper)
            | map(attribute='url')
            | first
          ) | default('https://download.docker.com/linux')
      }}
  when:
    - country_code_upper is defined
    - country_code_upper in docker_mirrors_country_code_allowlist

- name: Display the selected Docker repository URL
  ansible.builtin.debug:
    msg: "Selected Docker repository URL: {{ docker_repo_url }} because the country code is {{ country_code_upper }}"
  when:
    - country_code_upper is defined
    - country_code_upper in docker_mirrors_country_code_allowlist
    - docker_repo_url is defined

- name: Run geerlingguy.docker role to install Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
