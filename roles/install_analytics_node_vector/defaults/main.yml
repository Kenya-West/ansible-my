---
# defaults file for roles/install_analytics_node_vector
project_dir: "{{ analytics_node.project.paths.vector | ansible.builtin.basename }}"
project_root_dir: "{{ analytics_node.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ analytics_node.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

# The analytics server scraping this host, resolved by the playbook with
# kwtoolset/resolve_host_relations (analytics_server/vector).
install_analytics_node_vector_server: "{{ resolve_host_relations_host | default('') }}"

# vector_exporter_server_users, and the prometheus user of the server's
# prometheus_server_scrape_credentials.vector.
install_analytics_node_vector_users: >-
  {{ (vector_exporter_server_users | default([])
      | rejectattr('name', 'equalto',
                   hostvars[install_analytics_node_vector_server].prometheus_server_scrape_credentials.vector.username)
      | list)
     + [{'name': hostvars[install_analytics_node_vector_server].prometheus_server_scrape_credentials.vector.username,
         'password': hostvars[install_analytics_node_vector_server].prometheus_server_scrape_credentials.vector.password,
         'hash_scheme': 'bcrypt'}] }}

# vector_sinks, its victorialogs_sink given the endpoint and the credentials of
# the server's VictoriaLogs.
install_analytics_node_vector_sinks: >-
  {{ vector_sinks | combine({'sinks': {'victorialogs_sink': {
       'endpoints': ['https://' ~ hostvars[install_analytics_node_vector_server].domains_keys.victorialogs ~ '/insert/elasticsearch/'],
       'auth': {'strategy': 'basic',
                'user': hostvars[install_analytics_node_vector_server].victorialogs_server_httpauth_username,
                'password': hostvars[install_analytics_node_vector_server].victorialogs_server_httpauth_password}}}}, recursive=True)
     if 'victorialogs_sink' in vector_sinks.sinks | default({}) else vector_sinks }}
