---
# defaults file for roles/install_analytics_node_fail2ban_exporter
project_dir: "{{ analytics_node.project.paths.fail2ban_exporter | ansible.builtin.basename }}"
project_root_dir: "{{ analytics_node.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ analytics_node.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

# The analytics server scraping this host, resolved by the playbook with
# kwtoolset/resolve_host_relations (analytics_server/fail2ban_exporter).
install_analytics_node_fail2ban_exporter_server: "{{ resolve_host_relations_host | default('') }}"

# fail2ban_exporter_server_users, and the prometheus user of the server's
# prometheus_server_scrape_credentials.fail2ban_exporter.
install_analytics_node_fail2ban_exporter_users: >-
  {{ (fail2ban_exporter_server_users | default([])
      | rejectattr('name', 'equalto',
                   hostvars[install_analytics_node_fail2ban_exporter_server].prometheus_server_scrape_credentials.fail2ban_exporter.username)
      | list)
     + [{'name': hostvars[install_analytics_node_fail2ban_exporter_server].prometheus_server_scrape_credentials.fail2ban_exporter.username,
         'password': hostvars[install_analytics_node_fail2ban_exporter_server].prometheus_server_scrape_credentials.fail2ban_exporter.password,
         'hash_scheme': 'bcrypt'}] }}
