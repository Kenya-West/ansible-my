---
# tasks file for roles/install_ufw_docker
- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  tags:
    - always

# Effective config, so Include'd drop-ins and "ListenAddress host:port" count too
- name: Read effective sshd config
  ansible.builtin.command: sshd -T
  register: ufw_docker_sshd_config
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - always

# Not sudo: sudo drops SSH_CONNECTION. Its 4th field is the port this very session came in on,
# which still matters when sshd_config was changed but sshd has not been restarted yet.
- name: Read port of the current SSH connection
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: ufw_docker_ssh_connection
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - always

- name: Collect SSH ports
  ansible.builtin.set_fact:
    ufw_docker_ssh_ports: >-
      {{
        (
          (ufw_docker_sshd_config.stdout | default('') | regex_findall('(?m)^(?:port |listenaddress .*:)([0-9]{1,5})$'))
          + (ufw_docker_ssh_connection.stdout | default('') | split)[3:]
        )
        | unique
        | default(['22'], true)
      }}
  tags:
    - always

# Before UFW is enabled, otherwise the deny policy leaves no way to log in again.
# From any IP. Replaces a "limit" rule on the same port: it rejects a 6th connection within 30 s,
# which is enough to cut Ansible off in the middle of a run.
- name: Allow SSH in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_docker_ssh_ports }}"
  tags:
    - always

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
  tags:
    - always

- name: Check that Docker is installed
  ansible.builtin.command: docker --version
  register: ufw_docker_docker_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - always

- name: Assert Docker is in place
  ansible.builtin.assert:
    that:
      - ufw_docker_docker_check.rc == 0
    fail_msg: >-
      ufw-docker needs Docker (playbooks/base/docker.yaml) on {{ inventory_hostname }}.
    quiet: true
  tags:
    - always

- name: Check which binaries are already in place
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ ufw_docker_binaries }}"
  loop_control:
    label: "{{ item.path }}"
  register: ufw_docker_bins_stat
  tags:
    - always

- name: Find the binaries that are not on the host
  ansible.builtin.set_fact:
    ufw_docker_binaries_missing: "{{ ufw_docker_bins_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  tags:
    - always

# Downloaded on the controller and synchronized to the host, only what is missing.
# Skipped in --check mode: the download/sync tasks are shell/command based and would not run
- name: Report binaries that would be installed (check mode)
  ansible.builtin.debug:
    msg: "Would install with eget: {{ ufw_docker_binaries_missing | map(attribute='path') | list }}"
  when:
    - ansible_check_mode
    - ufw_docker_binaries_missing | length > 0
  tags:
    - install_binaries

- name: Install the missing binaries using eget
  ansible.builtin.include_role:
    name: copy_eget_binaries_from_controller
    apply:
      tags:
        - install_binaries
  vars:
    packages_binary_list: "{{ ufw_docker_binaries_missing }}"
    eget_host_bin_dir: "{{ ufw_docker_bin_dir }}"
  when:
    - not ansible_check_mode
    - ufw_docker_binaries_missing | length > 0
  tags:
    - install_binaries

# Idempotent: rewrites /etc/ufw/after.rules and after6.rules (with a backup) only if they differ,
# and says "Backing up" on stderr when it does. The command module skips it in --check mode.
- name: Install ufw-docker rules into UFW
  ansible.builtin.command:
    argv: "{{ [ufw_docker_bin, 'install'] + ufw_docker_install_args.split() }}"
  register: ufw_docker_install
  changed_when: "'Backing up' in ufw_docker_install.stderr"
  notify: Restart ufw
  tags:
    - install_rules

- name: Apply new UFW rules before the service starts managing them
  ansible.builtin.meta: flush_handlers
  tags:
    - install_rules

- name: Install SystemD unit of ufw-docker-automated
  ansible.builtin.include_role:
    name: 0x0I.systemd
    apply:
      tags:
        - install_systemd_service
        - update_systemd_service
  vars:
    unit_config: "{{ ufw_docker_systemd_unit_configs }}"
  tags:
    - install_systemd_service
    - update_systemd_service
