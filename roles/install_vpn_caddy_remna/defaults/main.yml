---
# defaults file for roles/install_vpn_caddy_remna
project_dir: "{{ vpn_caddy.project.paths.remna | ansible.builtin.basename }}"
project_root_dir: "{{ vpn_caddy.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ vpn_caddy.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

remna_node_app_port: 2220
remna_node_external_ports: []
remna_node_use_dns01_cloudflare: false

systemd_timer_user: "{{ standard_user }}"
systemd_timer_name: "remnanode-restart"
systemd_timer_script_path: "{{ dest_path_full }}/scripts/script.sh"

systemd_user_unit_path: "/home/{{ standard_user }}/.config/systemd/user"

systemd_user: "{{ standard_user }}"
systemd_group: "{{ standard_user }}"

systemd_unit_configs:
  - name: "{{ systemd_timer_name }}"
    type: service
    scope: user
    user: "{{ systemd_user }}"
    group: "{{ systemd_group }}"
    path: "{{ systemd_user_unit_path }}"
    Unit:
      Description: "Run {{ systemd_timer_name }} script"
      Documentation: "man:systemd.service(5)"
    Service:
      Type: oneshot
      ExecStart: "/usr/bin/bash {{ systemd_timer_script_path }}"
      WorkingDirectory: "/home/{{ systemd_timer_user }}"
      Environment:
        - "TZ=Asia/Yakutsk"
      TimeoutStartSec: "2m"
      Nice: "5"
      IOSchedulingClass: "best-effort"
      IOSchedulingPriority: "7"
      NoNewPrivileges: "yes"
      PrivateTmp: "yes"
      ProtectSystem: "full"

  - name: "{{ systemd_timer_name }}"
    type: timer
    scope: user
    user: "{{ systemd_user }}"
    group: "{{ systemd_group }}"
    path: "{{ systemd_user_unit_path }}"
    enabled: true
    state: started
    Unit:
      Description: "Timer for {{ systemd_timer_name }}"
      Documentation: "man:systemd.timer(5)"
    Timer:
      Unit: "{{ systemd_timer_name }}.service"
      OnCalendar: "*-*-01/3 03:00:00 Asia/Yakutsk"
      RandomizedDelaySec: "30min"
      AccuracySec: "1min"
      Persistent: "true"
    Install:
      WantedBy: "timers.target"

# The Remnawave panel this node connects to, resolved by the playbook with
# kwtoolset/resolve_host_relations (vpn_server_remnawave/remna), and the
# SECRET_KEY it issues to its nodes (the first panel's, a node has one). The IPs of all the related panels
# are the only ones UFW lets reach the node control port.
install_vpn_caddy_remna_panel: "{{ resolve_host_relations_host | default('') }}"
install_vpn_caddy_remna_panels: "{{ resolve_host_relations_hosts | default([]) }}"
install_vpn_caddy_remna_panel_ips: >-
  {{ install_vpn_caddy_remna_panels | map('extract', hostvars, 'ansible_host') | map('default', '', true) | unique | list }}
remna_node_ssl_cert_from_panel: "{{ hostvars[install_vpn_caddy_remna_panel].vpn_server_remnawave_node_secret_key }}"

# --- egress interface (remna_node_hops.egress, group_vars/vpn_caddy/remna.yaml)
# The container's own traffic leaves through this interface's address instead
# of the host's default route; clients still reach the node at ansible_host.
remna_node_egress: >-
  {{ ((remna_node_hops_defaults | default({}, true))
      | combine(remna_node_hops | default({}, true), recursive=True)).egress | default({}, true) }}
remna_node_egress_interface: "{{ remna_node_egress.interface | default('', true) }}"
remna_node_egress_family: "{{ remna_node_egress.family | default('ipv4', true) }}"
remna_node_egress_gateway: "{{ remna_node_egress.gateway | default('auto', true) }}"
# The direct domains of the nodes that take traffic from this one (their
# remna_node_hops.from names it). With an IPv6-only egress they are the only
# IPv4 destinations the container may reach: their names have IPv4 addresses
# only, resolved on the node itself and re-read on every heal.
remna_node_egress_hop_domains: >-
  {%- set out = [] -%}
  {%- for host in groups[remna_node_egress_node_group] | default([]) if host != inventory_hostname -%}
  {%-   set names = [] -%}
  {%-   for item in [(hostvars[host].remna_node_hops | default({}, true))['from'] | default([], true)] | flatten -%}
  {%-     set _ = names.append(item.host if item is mapping else item) -%}
  {%-   endfor -%}
  {%-   if inventory_hostname in names -%}
  {%-     for entry in (hostvars[host].domains_keys | default({}, true)).remna_node | default([], true)
                       if entry.type == vpn_deployment_domain_prefix.net_location.type -%}
  {%-       set _ = out.append(entry.domain) -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ out | unique | sort }}
remna_node_egress_node_group: vpn_caddy
remna_node_egress_enabled: "{{ remna_node_egress_interface | length > 0 }}"
remna_node_egress_container: remna
remna_node_egress_tool: /usr/local/sbin/remna-egress
remna_node_egress_unit: remna-egress
# Normally from group_vars/vpn_caddy/remna.yaml.
remna_node_egress_network: remna-egress
remna_node_egress_bridge: br-remna-eg
remna_node_egress_subnet_ipv4: 10.247.241.0/29
remna_node_egress_subnet_ipv6: fd52:656d:6e61:2401::/64
remna_node_egress_mark: 9217
remna_node_egress_table: 2401
remna_node_egress_rule_priority: 2401
remna_node_egress_heal_interval: 60s
remna_node_egress_probe_url_ipv4: https://1.1.1.1/cdn-cgi/trace
remna_node_egress_probe_url_ipv6: "https://[2606:4700:4700::1111]/cdn-cgi/trace"
remna_egress_probe:
  4: "{{ remna_node_egress_probe_url_ipv4 }}"
  6: "{{ remna_node_egress_probe_url_ipv6 }}"
remna_egress_probe_families: "{{ {'ipv4': [4], 'ipv6': [6], 'dual': [4, 6]}[remna_node_egress_family] }}"
# The family that must not leave at all (ipv4 for an ipv6 egress and back).
remna_egress_blocked_families: "{{ {'ipv4': [6], 'ipv6': [4], 'dual': []}[remna_node_egress_family] }}"
