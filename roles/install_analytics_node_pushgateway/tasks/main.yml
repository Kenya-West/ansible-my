---
# tasks file for roles/install_analytics_node_pushgateway
- name: Capture this role's path so nested role can use the parent role_path
  ansible.builtin.set_fact:
    this_role_path: "{{ role_path }}"
  tags:
    - always

- name: Assert the analytics server of this host is resolved
  ansible.builtin.assert:
    that:
      - install_analytics_node_pushgateway_server | length > 0
    fail_msg: >-
      No analytics_server resolved for {{ inventory_hostname }}: set host_relations
      (analytics_server.components.pushgateway, analytics_server or default) in its host_vars; the
      playbook resolves it with kwtoolset/resolve_host_relations before this role.
    quiet: true
  tags:
    - always

- name: Add to source_paths the current role templates directory
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        (
            source_paths_add_role_dirs
            | default([])
            | map('regex_replace', '^(.*)$', this_role_path ~ '/\1/')
            | list
          )
        + (source_paths_add_repo_dirs | default([]))
        + (source_paths_add_user_dirs | default([]))
      }}
  tags:
    - always

- name: Check which source_paths actually exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ source_paths }}"
  delegate_to: localhost
  become: false
  register: source_paths_stat
  tags:
    - always

- name: Exclude non-existing paths from source_paths
  ansible.builtin.set_fact:
    source_paths: >-
      {{
        source_paths_stat.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  tags:
    - always

- name: "Create non-existent parent directories for {{ dest_path_full }}"
  ansible.builtin.include_role:
    name: kwtoolset/create_dirs_traversal
    apply:
      tags:
        - update_config_hard
  vars:
    create_dirs_traversal_path: "{{ dest_path_full }}"
    create_dirs_traversal_strip_leaf: true
    create_dirs_force_mode: "0775"
  tags:
    - update_config_hard

- name: copy_files_templating
  ansible.builtin.include_role:
    name: kwtoolset/copy_files_templating
    apply:
      tags:
        - update_config_hard
        - update_config_soft
        - update_scripts
  vars:
    copy_files_templating_dir_list:
      - src: "{{ source_path }}"
        dest: "{{ dest_path_full }}"
        default_mode: "0775"
  with_items: "{{ source_paths }}"
  loop_control:
    loop_var: source_path
  tags:
    - update_config_hard
    - update_config_soft
    - update_scripts

- name: Remove obsolete .env file if it exists
  ansible.builtin.file:
    path: "{{ dest_path_full }}/scripts/.env"
    state: absent
  tags:
    - update_config_hard
