---
# defaults file for roles/install_analytics_node_pushgateway
project_dir: "{{ analytics_node.project.paths.pushgateway | ansible.builtin.basename }}"
project_root_dir: "{{ analytics_node.project.root }}"
source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}/"

source_paths_add_role_dirs:
  - files
  - templates
source_paths_add_repo_dirs:
  - "{{ source_asset_fullpath_project }}"
source_paths_add_user_dirs: []

dest_path_root: "/home/{{ standard_user }}/{{ analytics_node.project.root }}"
dest_path_full: "{{ dest_path_root }}/{{ project_dir }}"

compose_project_name: "{{ project_dir }}"

# The analytics server this host pushes to, resolved by the playbook with
# kwtoolset/resolve_host_relations (analytics_server/pushgateway), and the URL
# and the credentials of its PushGateway.
install_analytics_node_pushgateway_server: "{{ resolve_host_relations_host | default('') }}"
pushgateway_url: "https://{{ hostvars[install_analytics_node_pushgateway_server].domains_keys.pushgateway }}"
pushgateway_user: "{{ hostvars[install_analytics_node_pushgateway_server].prometheus_server_scrape_credentials.pushgateway.username }}"
pushgateway_pass: "{{ hostvars[install_analytics_node_pushgateway_server].prometheus_server_scrape_credentials.pushgateway.password }}"
