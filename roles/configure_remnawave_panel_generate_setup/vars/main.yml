---
# vars file for roles/configure_remnawave_panel_generate_setup

# The panel of the host the role runs against, used by the module_defaults of
# every entry point and by the reads through kenyawest.remnawave.remnawave.
crpgs_panel:
  panel_url: "{{ vpn_server_remnawave_panel_url }}"
  token: "{{ vpn_server_remnawave_api_token }}"
  # An empty key is the same as none: the client only sends the header when
  # there is something to put in it.
  api_key: >-
    {{
      vpn_server_remnawave_custom_login_route_api_token | default('')
      if vpn_server_remnawave_access_mode == 'caddy_custom_path'
      else ''
    }}
  validate_certs: "{{ vpn_server_remnawave_panel_validate_certs }}"
  timeout: "{{ vpn_server_remnawave_panel_timeout }}"

# Every tag put on what the role creates, and the ones it filters by.
crpgs_tags: "{{ vpn_server_remnawave_tags | map(attribute='value') | list }}"
crpgs_primary_tags: >-
  {{
    vpn_server_remnawave_tags
    | selectattr('primary_filter', 'defined')
    | selectattr('primary_filter')
    | map(attribute='value')
    | list
  }}
