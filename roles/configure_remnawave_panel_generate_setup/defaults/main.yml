---
# defaults file for roles/configure_remnawave_panel_generate_setup
#
# Every variable here is normally set in
# inventory/group_vars/vpn_server_remnawave/. These are the fallbacks that
# keep the role usable on its own.
#
# The role configures the panel of the host it runs against, with the nodes
# whose host_relations resolve to that host.

# Which parts of the setup this run generates, in the order they depend on
# each other. The playbooks each pick one; leaving all in place generates
# everything and verifies the panel afterwards (verify writes nothing).
vpn_server_remnawave_generate_stages:
  - snippets
  - config_profiles
  - squads
  - nodes
  - hosts
  - verify

# Whether the verify stage fails the play on a problem - a host whose route id
# does not reach its exit, a node not activating a host's inbound, a stale
# host still enabled. Never in --check, where the panel is not written yet.
vpn_server_remnawave_verify_fail: true

# --- panel ------------------------------------------------------------------
vpn_server_remnawave_access_mode: api_token
vpn_server_remnawave_panel_url: "https://{{ domains_keys.remnawave }}"
vpn_server_remnawave_panel_validate_certs: true
vpn_server_remnawave_panel_timeout: 30

# Tags put on every entity the role creates. The ones marked
# primary_filter: true are how the role tells its entities from hand-made
# ones: it only takes over, retires and cleans entities carrying all of them.
vpn_server_remnawave_tags:
  - value: "MANAGED_BY:ANSIBLE"
    primary_filter: true

# --- what the nodes are read from -------------------------------------------
vpn_server_remnawave_hosts_node_group: vpn_caddy
# The relation a node names its panel by - the one its remna playbook
# resolves, so a node is published on the panel it registers with.
vpn_server_remnawave_hosts_node_relation_group: vpn_server_remnawave
vpn_server_remnawave_hosts_node_relation_component: remna
vpn_server_remnawave_hosts_node_manage_key: remna_node
vpn_server_remnawave_hosts_node_manage_domain_types_direct_filter:
  - "{{ vpn_deployment_domain_prefix.net_location.type }}"
vpn_server_remnawave_hosts_node_manage_domain_types_specific_filter:
  - "{{ vpn_deployment_domain_prefix.chain_location.type }}"

# --- config profiles --------------------------------------------------------
# Built in inventory/group_vars/vpn_server_remnawave/config_profiles.yaml.
#
# One base profile per protocol, as {protocol, name, variant_suffix, inbounds,
# config (optional)}: rendered as it is for the global scope, and as a variant
# for every location and exclusive scope some node of that protocol is in.
vpn_server_remnawave_config_profiles_base: []
# The variant of a location (a censorship geo; {code} is its region code
# upper-cased, {geo} its name): Reverse-RU, VLESS_TCP_REALITY_REVERSE_RU.
vpn_server_remnawave_config_profiles_location:
  name: Reverse-{code}
  inbound_suffix: REVERSE_{code}
# The exclusive profiles of this panel, as {name, inbound_suffix}; a node of
# the exclusive group names its own in remna_node_panel_exclusive_profile.
vpn_server_remnawave_config_profiles_exclusive: []
vpn_server_remnawave_config_profiles_exclusive_group: vps_exclusive
# Ordered named configuration fragments, each with config, optional profiles
# selector, snippets and base inbound tags for scoping inline rules. Nested
# mappings merge; lists concatenate in declaration order; later scalars win.
vpn_server_remnawave_config_profiles_composition: []
# The REALITY private key of an inbound tag, and the key of every other one.
vpn_server_remnawave_config_profiles_private_keys: {}
vpn_server_remnawave_config_profiles_private_key_common: ''
# Whether a generated profile may take over a profile holding its inbound or
# name that does not carry the primary tags.
vpn_server_remnawave_config_profiles_adopt_untagged: false
# What to do with profiles carrying the primary tags that the inventory no
# longer produces, once no node it still produces activates them. It can be:
# ignore, delete.
vpn_server_remnawave_config_profiles_prune: ignore
# Profiles never deleted by pruning or cleaning, on top of the ones a node
# activates. The panel reserves Default-Profile: it cannot be created again.
vpn_server_remnawave_config_profiles_protected:
  - Default-Profile

# --- internal squads ---------------------------------------------------------
# The squads granted the inbounds of the profiles a selector picks, as
# {squad, profiles}. Only ever adds inbounds; squads are never created.
vpn_server_remnawave_internal_squads_inbounds: []

# --- nodes ------------------------------------------------------------------
# How each node is named and reached is set on the node side, in
# group_vars/vpn_caddy (remna_node_panel_*). These are the panel side.
#
# A node the panel does not have yet is always created disabled, unless this
# is 'enabled'. It can be: present, disabled, enabled.
vpn_server_remnawave_nodes_publish_state: present
# Whether a generated node may take over a node of the same name that does
# not carry the primary tags.
vpn_server_remnawave_nodes_adopt_untagged: false
# What to do with nodes carrying the primary tags that the inventory no longer
# produces. It can be: ignore, disable, delete.
vpn_server_remnawave_nodes_prune: disable

# --- hosts ------------------------------------------------------------------
# A host the panel does not have yet is always created disabled, unless this
# is 'enabled'. It can be: present, disabled, enabled.
vpn_server_remnawave_hosts_publish_state: present
# Whether a generated host may take over a host of the same remark that does
# not carry the primary tags.
vpn_server_remnawave_hosts_adopt_untagged: false
vpn_server_remnawave_hosts_port: 443
vpn_server_remnawave_hosts_fingerprint: firefox
vpn_server_remnawave_hosts_labels: {}
vpn_server_remnawave_hosts_remark_chain_separator: ' | by '
# The remark of an exit of an exclusive profile, numbered within that profile.
vpn_server_remnawave_hosts_remark_exclusive_format: '{name} · {profile}'

# What to do with hosts carrying the primary tags that the inventory no longer
# produces. It can be: ignore, disable, delete.
vpn_server_remnawave_hosts_prune: disable

# Which nodes a generated chain host is bound to. Its client-facing profile
# follows the exit's access scope and the entry's transport; bind to the entry.
# It can be: entry, exit, both, none.
vpn_server_remnawave_hosts_chain_bind_nodes: entry

vpn_server_remnawave_hosts_chain:
  entry_country_codes:
    - RU
  # Additionally offer shared global chain domains to non-global exits only.
  entry_global_for_non_global: true
  skip_same_country: true
  exclude: []

vpn_server_remnawave_hosts_vless_route_id_base: 400
vpn_server_remnawave_hosts_vless_route_id_direct: 2

# --- cleaning (tasks_from: clean_hosts) -------------------------------------
# What happens to the hosts carrying the primary tags. It can be: absent,
# disabled.
vpn_server_remnawave_hosts_clean_state: absent
# Skip the confirmation prompt.
vpn_server_remnawave_hosts_clean_confirm: false

# --- cleaning (tasks_from: clean_nodes) -------------------------------------
# What happens to the nodes carrying the primary tags. It can be: absent,
# disabled.
vpn_server_remnawave_nodes_clean_state: absent
# Skip the confirmation prompt.
vpn_server_remnawave_nodes_clean_confirm: false

# --- cleaning (tasks_from: clean_config_profiles) ---------------------------
# Skip the confirmation prompt.
vpn_server_remnawave_config_profiles_clean_confirm: false

# --- snippets ---------------------------------------------------------------
# The contents are built in inventory/group_vars/vpn_server_remnawave/snippets.yaml;
# without it there are no outbounds, rules or other snippets to write.
vpn_server_remnawave_snippets_key_rules_all: rules_all_prod_1
vpn_server_remnawave_snippets_key_outbounds_all: outbounds_all_prod_1
# A remna_protocol_types.<key>.full value.
vpn_server_remnawave_snippets_default_protocol_type: vless-reality-tcp
# Every exit's outbound, as {kind, address, protocol, template, tag}.
vpn_server_remnawave_snippets_outbounds_plan: []
# Snippets written as they are, as {name, snippet}.
vpn_server_remnawave_snippets_whole: []
vpn_server_remnawave_snippets_outbound_tag_prefix: out-chain
vpn_server_remnawave_snippets_vless_route_id_range: [400, 499]
vpn_server_remnawave_snippets_sync: on_change
