---
# Write the panel's snippets. Their contents are built in the inventory
# (group_vars/vpn_server_remnawave/snippets.yaml); this does only what
# inventory variables cannot:
#
#   - outbounds_all: every planned outbound rendered from its protocol
#     template with node_address set to its exit;
#   - rules_all: one rule per chained exit, routing its route id to that exit's
#     outbound (crpgs_model, build_model.yml);
#   - vpn_server_remnawave_snippets_whole: standalone snippets written whole;
#   - snippet definitions from config_profiles_composition (defaults, WARP,
#     balancers): written once as they are, whichever profiles embed them.
#
# The role owns these snippets whole: each is replaced by what the inventory
# produces, so an entry added to them by hand is gone after the next run.

- name: Start from an empty set of rendered outbounds
  ansible.builtin.set_fact:
    crpgs_outbounds: []

- name: Every planned outbound must have a snippet template
  ansible.builtin.assert:
    that:
      - item.template in query('varnames', '.*')
    fail_msg: >-
      No snippet template for protocol '{{ item.protocol }}' of exit
      {{ item.address }}. Expected a variable named '{{ item.template }}',
      normally defined in group_vars/vpn_server_remnawave/snippet_*.yaml.
    quiet: true
  loop: "{{ crpgs_outbounds_plan }}"
  loop_control:
    label: "{{ item.tag }}"

- name: Render the outbound of each exit
  ansible.builtin.set_fact:
    crpgs_outbounds: >-
      {{
        crpgs_outbounds
        + [lookup('ansible.builtin.vars', item.template) | combine({'tag': item.tag})]
      }}
  vars:
    # The templates are written against this name; it is what makes one
    # template serve every exit.
    node_address: "{{ item.address }}"
  loop: "{{ crpgs_outbounds_plan }}"
  loop_control:
    label: "{{ item.tag }} -> {{ item.address }}"

- name: Write the outbounds snippet
  kenyawest.remnawave.snippet:
    name: "{{ vpn_server_remnawave_snippets_key_outbounds_all }}"
    snippet: "{{ crpgs_outbounds }}"
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  delegate_to: localhost
  register: crpgs_outbounds_snippet

- name: Write the rules snippet
  kenyawest.remnawave.snippet:
    name: "{{ vpn_server_remnawave_snippets_key_rules_all }}"
    snippet: "{{ crpgs_model.rules }}"
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  delegate_to: localhost
  register: crpgs_rules_snippet

# After outbounds_all: a balancer selects outbounds by tag.
- name: Write the snippets kept whole
  kenyawest.remnawave.snippet:
    name: "{{ item.name }}"
    snippet: "{{ item.snippet }}"
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  loop: "{{ vpn_server_remnawave_snippets_whole }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  register: crpgs_whole_snippets

# After outbounds_all too: composed rules may name its outbounds or balancers.
- name: Write the snippets of the config profile composition
  kenyawest.remnawave.snippet:
    name: "{{ item.name }}"
    snippet: "{{ item.snippet }}"
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  loop: "{{ crpgs_model.profile_snippets }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  register: crpgs_composition_snippets_applied
