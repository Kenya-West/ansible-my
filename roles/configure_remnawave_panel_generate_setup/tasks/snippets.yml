---
# Render one outbound per chained exit from the protocol template that exit's
# nodes declare, and one routing rule pointing at it, then write both into the
# panel's snippets without disturbing what the role does not own.
#
# Snippets carry no tags in Remnawave, so what the role owns inside them is
# told apart by the outbound tag prefix and the route id range instead.

- name: Start from an empty set of rendered outbounds
  ansible.builtin.set_fact:
    crpgs_outbounds: []

- name: Map each protocol type to the snippet template that renders it
  ansible.builtin.set_fact:
    crpgs_protocol_templates: >-
      {%- set templates = {} -%}
      {%- for key, value in crpgs_protocol_types.items() -%}
      {%-   set _ = templates.update({
              value.full: key ~ '_' ~ vpn_server_remnawave_snippets_template_revision
            }) -%}
      {%- endfor -%}
      {{ templates }}

- name: Every protocol in use must have a snippet template
  ansible.builtin.assert:
    that:
      - item.protocol in crpgs_protocol_templates
      - crpgs_protocol_templates[item.protocol] in vars
    fail_msg: >-
      No snippet template for protocol '{{ item.protocol }}' of exit
      {{ item.address }}. Expected a variable named
      '{{ crpgs_protocol_templates[item.protocol] | default(item.protocol) }}',
      normally defined in
      group_vars/vpn_server_remnawave/snippet_*.yaml.
  loop: "{{ crpgs_model.outbounds }}"
  loop_control:
    label: "{{ item.tag }}"

- name: Render the outbound of each chained exit
  ansible.builtin.set_fact:
    crpgs_outbounds: >-
      {{
        crpgs_outbounds
        + [lookup('ansible.builtin.vars', crpgs_template) | combine({'tag': item.tag})]
      }}
  vars:
    # The templates are written against these two names; node_address is what
    # makes one template serve every exit.
    node_address: "{{ item.address }}"
    crpgs_template: "{{ crpgs_protocol_templates[item.protocol] }}"
  loop: "{{ crpgs_model.outbounds }}"
  loop_control:
    label: "{{ item.tag }} -> {{ item.address }}"

- name: Read the snippets currently in the panel
  ansible.builtin.include_tasks: read_panel.yml
  vars:
    crpgs_gather:
      snippets: {}

- name: Keep the parts of the snippets the role does not own
  ansible.builtin.set_fact:
    crpgs_outbounds_existing: >-
      {{
        (remnawave_gathered.snippets
         | selectattr('name', 'equalto', vpn_server_remnawave_snippets_key_outbounds_all)
         | first | default({})).snippet | default([], true)
      }}
    crpgs_rules_existing: >-
      {{
        (remnawave_gathered.snippets
         | selectattr('name', 'equalto', vpn_server_remnawave_snippets_key_rules_all)
         | first | default({})).snippet | default([], true)
      }}

- name: Write the outbounds snippet
  kenyawest.remnawave.snippet:
    name: "{{ vpn_server_remnawave_snippets_key_outbounds_all }}"
    snippet: >-
      {{
        crpgs_outbounds_existing
        | remnawave_merge_outbounds(
            crpgs_outbounds,
            vpn_server_remnawave_snippets_outbound_tag_prefix)
      }}
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  register: crpgs_outbounds_snippet

- name: Write the rules snippet
  kenyawest.remnawave.snippet:
    name: "{{ vpn_server_remnawave_snippets_key_rules_all }}"
    snippet: >-
      {{
        crpgs_rules_existing
        | remnawave_merge_rules(
            crpgs_model.rules,
            vpn_server_remnawave_snippets_vless_route_id_range)
      }}
    sync: "{{ vpn_server_remnawave_snippets_sync }}"
  register: crpgs_rules_snippet
