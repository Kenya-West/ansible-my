---
# Publish one Remnawave Host per exit, plus one per (exit, chain entry) pair,
# each carrying the route id its exit's outbound is reached by.

- name: The generated hosts need a config profile and an inbound
  ansible.builtin.assert:
    that:
      - vpn_server_remnawave_hosts_config_profile | length > 0
      - >-
        vpn_server_remnawave_hosts_inbound | length > 0
        or vpn_server_remnawave_hosts_inbound_by_protocol | length > 0
    fail_msg: >-
      Set vpn_server_remnawave_hosts_config_profile and either
      vpn_server_remnawave_hosts_inbound or
      vpn_server_remnawave_hosts_inbound_by_protocol - the panel cannot create
      a host without the inbound it belongs to.

- name: Read the hosts already in the panel
  kenyawest.remnawave.host_info:
  register: crpgs_hosts_before

- name: Note which remarks already exist and which are the role's
  ansible.builtin.set_fact:
    crpgs_existing_remarks: "{{ crpgs_hosts_before.hosts | map(attribute='remark') | list }}"
    crpgs_managed_remarks: >-
      {%- set managed = [] -%}
      {%- for host in crpgs_hosts_before.hosts -%}
      {%-   if vpn_server_remnawave_hosts_tag in (host.tags | default([])) -%}
      {%-     set _ = managed.append(host.remark) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ managed }}

- name: Publish the generated hosts
  kenyawest.remnawave.host:
    remark: "{{ item.remark }}"
    # 'present' leaves an existing host's on/off switch alone, so a host
    # enabled by hand in the panel stays enabled, while a host the role has
    # not created yet is still created switched off.
    state: >-
      {{
        vpn_server_remnawave_hosts_publish_state
        if vpn_server_remnawave_hosts_publish_state != 'present'
        else ('present' if item.remark in crpgs_existing_remarks else 'disabled')
      }}
    config_profile: "{{ vpn_server_remnawave_hosts_config_profile }}"
    inbound: >-
      {{
        vpn_server_remnawave_hosts_inbound_by_protocol[item.protocol]
        | default(vpn_server_remnawave_hosts_inbound, true)
      }}
    address: "{{ item.address }}"
    port: "{{ vpn_server_remnawave_hosts_port }}"
    sni: "{{ item.sni }}"
    fingerprint: "{{ vpn_server_remnawave_hosts_fingerprint }}"
    override_sni_from_address: "{{ item.override_sni_from_address }}"
    vless_route_id: "{{ item.vless_route_id }}"
    nodes: "{{ item.nodes }}"
    tags: "{{ [vpn_server_remnawave_hosts_tag] }}"
  loop: "{{ crpgs_model.hosts }}"
  loop_control:
    label: "{{ item.remark }} ({{ item.address }}, route {{ item.vless_route_id | default('-') }})"
  register: crpgs_hosts_applied

- name: Retire the hosts the inventory no longer produces
  kenyawest.remnawave.host:
    remark: "{{ item }}"
    state: "{{ 'absent' if vpn_server_remnawave_hosts_prune == 'delete' else 'disabled' }}"
  loop: >-
    {{
      crpgs_managed_remarks
      | difference(crpgs_model.hosts | map(attribute='remark') | list)
    }}
  when: vpn_server_remnawave_hosts_prune in ['disable', 'delete']
  register: crpgs_hosts_pruned

- name: Report what was applied
  ansible.builtin.debug:
    msg: >-
      {{ crpgs_hosts_applied.results | selectattr('changed') | list | length }}
      of {{ crpgs_model.hosts | length }} hosts changed;
      {{ crpgs_hosts_pruned.results | default([]) | selectattr('changed') | list | length }}
      retired
