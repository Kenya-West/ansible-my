---
# Publish one Remnawave Host per exit, plus one per (exit, chain entry) pair,
# each carrying the route id its exit's outbound is reached by. A direct host
# is attached to the inbound of its exit's config profile, a chain host to the
# one of its entry's - the node the client connects to - and a chain into an
# exclusive exit is shown only to the squads granted that exit's profile. The
# role's hosts are the ones carrying every primary tag; hosts without them are
# never updated, retired or counted as the role's.

- name: Read the hosts already in the panel
  ansible.builtin.include_tasks: read_panel.yml
  vars:
    crpgs_gather:
      hosts: {}

- name: Tell the role's hosts from the hand-made ones
  ansible.builtin.set_fact:
    crpgs_existing_remarks: "{{ remnawave_gathered.hosts | map(attribute='remark') | list }}"
    crpgs_managed_remarks: >-
      {{
        remnawave_gathered.hosts
        | remnawave_select_tagged(crpgs_primary_tags)
        | map(attribute='remark') | list
      }}
    crpgs_untagged_remarks: >-
      {{
        remnawave_gathered.hosts
        | remnawave_select_tagged(crpgs_primary_tags, false)
        | map(attribute='remark') | list
      }}

- name: Find the generated hosts whose remark a hand-made host already has
  ansible.builtin.set_fact:
    crpgs_hosts_colliding: >-
      {{
        []
        if vpn_server_remnawave_hosts_adopt_untagged | bool
        else crpgs_model.hosts | map(attribute='remark') | select('in', crpgs_untagged_remarks) | list
      }}
    # The role's hosts the inventory no longer produces. Never a remark the
    # model has, so retiring them cannot clash with publishing.
    crpgs_hosts_stale: >-
      {{
        crpgs_managed_remarks
        | difference(crpgs_model.hosts | map(attribute='remark') | list)
        if vpn_server_remnawave_hosts_prune in ['disable', 'delete']
        else []
      }}

- name: Report the generated hosts left out to spare hand-made ones
  ansible.builtin.debug:
    msg: >-
      Not published, because a host of the same remark in the panel does not
      carry {{ crpgs_primary_tags | join(', ') }}:
      {{ crpgs_hosts_colliding | join('; ') }}. Give them other remarks through
      vpn_server_remnawave_hosts_labels, or set
      vpn_server_remnawave_hosts_adopt_untagged to true to take those hosts over.
  when: crpgs_hosts_colliding | length > 0

# Publishing and retiring are one task: the panel is read once for the whole
# list, and every entry is checked before any host is written. It runs on the
# controller, since it only speaks HTTP to the panel.
- name: Publish the generated hosts and retire the stale ones
  kenyawest.remnawave.hosts:
    hosts: >-
      {%- set entries = [] -%}
      {%- for host in crpgs_model.hosts if host.remark not in crpgs_hosts_colliding -%}
      {%-   set _ = entries.append({
              'remark': host.remark,
              'state': vpn_server_remnawave_hosts_publish_state
                       if vpn_server_remnawave_hosts_publish_state != 'present'
                       else ('present' if host.remark in crpgs_existing_remarks else 'disabled'),
              'config_profile': host.config_profile,
              'inbound': host.inbound,
              'internal_squads': host.internal_squads,
              'address': host.address,
              'port': vpn_server_remnawave_hosts_port,
              'sni': host.sni,
              'fingerprint': vpn_server_remnawave_hosts_fingerprint,
              'override_sni_from_address': host.override_sni_from_address,
              'vless_route_id': host.vless_route_id,
              'nodes': host.nodes,
              'tags': crpgs_tags,
            }) -%}
      {%- endfor -%}
      {%- for remark in crpgs_hosts_stale -%}
      {%-   set _ = entries.append({
              'remark': remark,
              'state': 'absent' if vpn_server_remnawave_hosts_prune == 'delete' else 'disabled',
            }) -%}
      {%- endfor -%}
      {{ entries }}
  # A host the panel does not have yet is created disabled, so it carries no
  # traffic before it is reviewed; 'present' then leaves the panel's switch
  # alone, so a host enabled by hand stays enabled.
  delegate_to: localhost
  register: crpgs_hosts_applied

# Named from the module's own per-host action and identifier, so this lists
# real remarks - and is accurate in --check, where the module predicts each
# action without writing anything - rather than just a change count. The
# whole msg is one Jinja expression evaluating to a list, so the callback
# prints one remark per line instead of a single joined string.
- name: Report what was applied
  ansible.builtin.debug:
    msg: >-
      {{
        ['%d added:' | format(crpgs_hosts_added | length)] + crpgs_hosts_added
        + ['%d modified:' | format(crpgs_hosts_modified | length)] + crpgs_hosts_modified
        + ['%d left out:' | format(crpgs_hosts_colliding | length)] + crpgs_hosts_colliding
        + ['%d retired:' | format(crpgs_hosts_retired | length)] + crpgs_hosts_retired
      }}
  vars:
    crpgs_hosts_added: >-
      {{
        crpgs_hosts_applied.results | default([])
        | selectattr('action', 'equalto', 'create')
        | map(attribute='identifier') | list
      }}
    crpgs_hosts_modified: >-
      {{
        crpgs_hosts_applied.results | default([])
        | selectattr('action', 'equalto', 'update')
        | selectattr('changed')
        | rejectattr('identifier', 'in', crpgs_hosts_stale)
        | map(attribute='identifier') | list
      }}
    # Disabling a stale host is an update to the module, deleting it a delete;
    # either way it is a retirement here.
    crpgs_hosts_retired: >-
      {{
        crpgs_hosts_applied.results | default([])
        | selectattr('changed')
        | selectattr('identifier', 'in', crpgs_hosts_stale)
        | map(attribute='identifier') | list
      }}
