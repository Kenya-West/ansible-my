---
# Publish one Remnawave Host per exit, plus one per (exit, chain entry) pair,
# each carrying the route id its exit's outbound is reached by. The role's
# hosts are the ones carrying every primary tag; hosts without them are never
# updated, retired or counted as the role's.

- name: The generated hosts need a config profile and an inbound
  ansible.builtin.assert:
    that:
      - vpn_server_remnawave_hosts_config_profile | length > 0
      - >-
        vpn_server_remnawave_hosts_inbound | length > 0
        or vpn_server_remnawave_hosts_inbound_by_protocol | length > 0
    fail_msg: >-
      Set vpn_server_remnawave_hosts_config_profile and either
      vpn_server_remnawave_hosts_inbound or
      vpn_server_remnawave_hosts_inbound_by_protocol - the panel cannot create
      a host without the inbound it belongs to.

- name: Read the hosts already in the panel
  ansible.builtin.include_tasks: read_panel.yml
  vars:
    crpgs_gather:
      hosts: {}

- name: Tell the role's hosts from the hand-made ones
  ansible.builtin.set_fact:
    crpgs_existing_remarks: "{{ remnawave_gathered.hosts | map(attribute='remark') | list }}"
    crpgs_managed_remarks: >-
      {{
        remnawave_gathered.hosts
        | remnawave_select_tagged(crpgs_primary_tags)
        | map(attribute='remark') | list
      }}
    crpgs_untagged_remarks: >-
      {{
        remnawave_gathered.hosts
        | remnawave_select_tagged(crpgs_primary_tags, false)
        | map(attribute='remark') | list
      }}

- name: Find the generated hosts whose remark a hand-made host already has
  ansible.builtin.set_fact:
    crpgs_hosts_colliding: >-
      {{
        []
        if vpn_server_remnawave_hosts_adopt_untagged | bool
        else crpgs_model.hosts | map(attribute='remark') | select('in', crpgs_untagged_remarks) | list
      }}

- name: Report the generated hosts left out to spare hand-made ones
  ansible.builtin.debug:
    msg: >-
      Not published, because a host of the same remark in the panel does not
      carry {{ crpgs_primary_tags | join(', ') }}:
      {{ crpgs_hosts_colliding | join('; ') }}. Give them other remarks through
      vpn_server_remnawave_hosts_labels, or set
      vpn_server_remnawave_hosts_adopt_untagged to true to take those hosts over.
  when: crpgs_hosts_colliding | length > 0

- name: Publish the generated hosts
  kenyawest.remnawave.host:
    remark: "{{ item.remark }}"
    # A host the panel does not have yet is created disabled, so it carries no
    # traffic before it is reviewed; 'present' then leaves the panel's switch
    # alone, so a host enabled by hand stays enabled.
    state: >-
      {{
        vpn_server_remnawave_hosts_publish_state
        if vpn_server_remnawave_hosts_publish_state != 'present'
        else ('present' if item.remark in crpgs_existing_remarks else 'disabled')
      }}
    config_profile: "{{ vpn_server_remnawave_hosts_config_profile }}"
    inbound: >-
      {{
        vpn_server_remnawave_hosts_inbound_by_protocol[item.protocol]
        | default(vpn_server_remnawave_hosts_inbound, true)
      }}
    address: "{{ item.address }}"
    port: "{{ vpn_server_remnawave_hosts_port }}"
    sni: "{{ item.sni }}"
    fingerprint: "{{ vpn_server_remnawave_hosts_fingerprint }}"
    override_sni_from_address: "{{ item.override_sni_from_address }}"
    vless_route_id: "{{ item.vless_route_id }}"
    nodes: "{{ item.nodes }}"
    tags: "{{ crpgs_tags }}"
  loop: "{{ crpgs_model.hosts | rejectattr('remark', 'in', crpgs_hosts_colliding) | list }}"
  loop_control:
    label: "{{ item.remark }} ({{ item.address }}, route {{ item.vless_route_id | default('-') }})"
  register: crpgs_hosts_applied

- name: Retire the hosts the inventory no longer produces
  kenyawest.remnawave.host:
    remark: "{{ item }}"
    state: "{{ 'absent' if vpn_server_remnawave_hosts_prune == 'delete' else 'disabled' }}"
  loop: >-
    {{
      crpgs_managed_remarks
      | difference(crpgs_model.hosts | map(attribute='remark') | list)
    }}
  when: vpn_server_remnawave_hosts_prune in ['disable', 'delete']
  register: crpgs_hosts_pruned

- name: Report what was applied
  ansible.builtin.debug:
    msg: >-
      {{ crpgs_hosts_applied.results | default([]) | selectattr('changed') | list | length }}
      of {{ crpgs_model.hosts | length }} hosts changed,
      {{ crpgs_hosts_colliding | length }} left out;
      {{ crpgs_hosts_pruned.results | default([]) | selectattr('changed') | list | length }}
      retired
