---
# tasks file for roles/configure_remnawave_panel_generate_setup
#
# Generates the Remnawave setup - outbounds, routing rules and hosts - of the
# panel on the host the role runs against, out of the facts of the nodes
# relating to it, and applies it through the kenyawest.remnawave collection.

- name: Check the tags the role marks and filters by
  ansible.builtin.include_tasks: validate_tags.yml
  tags:
    - always

- name: Configure the panel of this host
  module_defaults:
    group/kenyawest.remnawave.remnawave:
      panel_url: "{{ crpgs_panel.panel_url }}"
      token: "{{ crpgs_panel.token }}"
      api_key: "{{ crpgs_panel.api_key }}"
      validate_certs: "{{ crpgs_panel.validate_certs }}"
      timeout: "{{ crpgs_panel.timeout }}"
  block:
    - name: Build the desired setup from the inventory
      ansible.builtin.include_tasks: build_model.yml
      tags:
        - always

    - name: Generate the snippets
      ansible.builtin.include_tasks: snippets.yml
      when: "'snippets' in vpn_server_remnawave_generate_stages"
      tags:
        - remnawave_snippets

    - name: Generate the hosts
      ansible.builtin.include_tasks: hosts.yml
      when: "'hosts' in vpn_server_remnawave_generate_stages"
      tags:
        - remnawave_hosts
