---
# Decide which host in the panel group this run configures, asking only when
# the answer cannot be derived, and remembering the answer so it is asked once.

- name: Collect the panels the inventory knows about
  ansible.builtin.set_fact:
    crpgs_panels: "{{ groups[vpn_server_remnawave_panel_group] | default([]) }}"

- name: The inventory must contain at least one Remnawave panel
  ansible.builtin.assert:
    that:
      - crpgs_panels | length > 0
    fail_msg: >-
      Group '{{ vpn_server_remnawave_panel_group }}' is empty, so there is no
      panel to configure. Add the panel host to it, or point
      vpn_server_remnawave_panel_group at the group that holds it.

- name: Take the panel already recorded in the inventory
  ansible.builtin.set_fact:
    crpgs_selected_panel: "{{ vpn_server_remnawave_selected_panel_hostname }}"
  when:
    - vpn_server_remnawave_selected_panel_hostname is defined
    - vpn_server_remnawave_selected_panel_hostname | length > 0

- name: A recorded panel must still be in the group
  ansible.builtin.assert:
    that:
      - crpgs_selected_panel in crpgs_panels
    fail_msg: >-
      vpn_server_remnawave_selected_panel_hostname is
      '{{ crpgs_selected_panel }}', which is not in group
      '{{ vpn_server_remnawave_panel_group }}'
      ({{ crpgs_panels | join(', ') }}).
  when: crpgs_selected_panel is defined

- name: Select the only panel there is
  ansible.builtin.set_fact:
    crpgs_selected_panel: "{{ crpgs_panels | first }}"
  when:
    - crpgs_selected_panel is not defined
    - vpn_server_remnawave_choose_panel_strategy == 'autoselect_if_single'
    - crpgs_panels | length == 1

- name: Ask which panel to configure
  when: crpgs_selected_panel is not defined
  run_once: true
  block:
    - name: Prompt for the panel
      ansible.builtin.pause:
        prompt: |-
          Which Remnawave panel should be configured?
          {% for panel in crpgs_panels %}
            {{ loop.index }}) {{ panel }}
          {% endfor %}
          Enter a number or a hostname
      register: crpgs_panel_answer

    - name: Read the answer as either a number or a hostname
      ansible.builtin.set_fact:
        crpgs_selected_panel: >-
          {{
            crpgs_panels[crpgs_answer | int - 1]
            if (crpgs_answer is match('^[0-9]+$')
                and crpgs_answer | int >= 1
                and crpgs_answer | int <= crpgs_panels | length)
            else crpgs_answer
          }}
      vars:
        crpgs_answer: "{{ crpgs_panel_answer.user_input | default('') | trim }}"

    - name: The answer must name a panel in the group
      ansible.builtin.assert:
        that:
          - crpgs_selected_panel in crpgs_panels
        fail_msg: >-
          '{{ crpgs_selected_panel }}' is not one of
          {{ crpgs_panels | join(', ') }}.

    - name: Record the choice so the next run does not ask again
      ansible.builtin.lineinfile:
        path: "{{ vpn_server_remnawave_selected_panel_record_path }}"
        # Matches the commented placeholder as well as a previous answer.
        regexp: '^#?\s*vpn_server_remnawave_selected_panel_hostname:'
        line: "vpn_server_remnawave_selected_panel_hostname: '{{ crpgs_selected_panel }}'"
        insertafter: EOF
      delegate_to: localhost
      become: false
      when: vpn_server_remnawave_selected_panel_record | bool

- name: Report the panel this run configures
  ansible.builtin.debug:
    msg: "Configuring Remnawave panel '{{ crpgs_selected_panel }}'"
  run_once: true
