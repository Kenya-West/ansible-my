---
# Follow what the panel holds the way a client is routed, and check it against
# itself and against the desired setup (crpgs_model, build_model.yml):
#
#   - every managed host's route id, through the rules snippet (and the inline
#     rules of balancing profiles) to the outbound or balanced outbounds, the
#     route each hands over in its UUID, and on hop by hop until route 0 - the
#     exit; every way through must be the path the inventory wants;
#   - the config profile and inbound a host is attached to, and the squads it
#     is shown to, which must be the ones of the model;
#   - the nodes a host binds to, which must exist and activate its inbound
#     (direct) or a transport/REALITY-compatible inbound (chain);
#   - every generated config profile, which must hold its inbounds and embed
#     exactly the snippets of the model (a fragment where it was not selected
#     is a problem as much as one missing);
#   - every embedded routing rule must target an outbound or balancer present
#     in that same profile after snippet expansion, not merely in the panel;
#   - whole composition snippets, whose contents must match the model (e.g.
#     WARP must not intercept explicit chain route ids);
#   - every node, which must activate the profile of its scope and protocol;
#   - every internal squad granted inbounds, which must hold them;
#   - the balancers, whose outbounds must exist;
#   - what the panel holds beyond the inventory: stale hosts and unused rules.
#
# Nothing is written. Problems - what would misroute or drop traffic - fail
# the play unless vpn_server_remnawave_verify_fail is false, or the run is
# --check, where the panel has not been written yet and the report shows what
# a real run would have to fix.

- name: Read the hosts, nodes, snippets, config profiles and squads of the panel
  ansible.builtin.include_tasks: read_panel.yml
  vars:
    crpgs_gather:
      hosts: {}
      nodes: {}
      snippets: {}
      config_profiles: {}
      internal_squads: {}

# The user the chain outbounds authenticate as, when the inventory names it:
# its squads must reach every node a chain outbound dials.
- name: Read the service user
  kenyawest.remnawave.user_info:
    username: "{{ vpn_server_remnawave_service_user_name }}"
  delegate_to: localhost
  register: crpgs_service_user
  when: vpn_server_remnawave_service_user_name | default('', true) | length > 0

- name: Check the panel against itself and the desired setup
  ansible.builtin.set_fact:
    crpgs_verified: "{{ remnawave_gathered | remnawave_verify(crpgs_model, crpgs_verify_options) }}"
  vars:
    crpgs_verify_options:
      primary_tags: "{{ crpgs_primary_tags }}"
      separator: "{{ vpn_server_remnawave_hosts_remark_chain_separator }}"
      fingerprint: "{{ vpn_server_remnawave_hosts_fingerprint }}"
      direct_route_id: "{{ vpn_server_remnawave_hosts_vless_route_id_direct }}"
      route_id_range: "{{ vpn_server_remnawave_snippets_vless_route_id_range }}"
      rules_snippet: "{{ vpn_server_remnawave_snippets_key_rules_all }}"
      outbounds_snippet: "{{ vpn_server_remnawave_snippets_key_outbounds_all }}"
      balancers_snippet: "{{ vpn_server_remnawave_snippets_key_balancers_all | default('') }}"
      service_user: >-
        {{ (crpgs_service_user.users | default([], true) | first | default(none))
           if crpgs_service_user is not skipped and crpgs_service_user is defined else none }}

# One expression evaluating to a list, so the callback prints a line each.
- name: Report what the panel holds
  ansible.builtin.debug:
    msg: >-
      {{
        ['Checked %d managed hosts (%d without the primary tags), %d rules, %d outbounds, %d nodes, %d config profiles, %d internal squads'
         | format(crpgs_verified.checked.hosts, crpgs_verified.checked.untagged_hosts,
                  crpgs_verified.checked.rules, crpgs_verified.checked.outbounds,
                  crpgs_verified.checked.nodes, crpgs_verified.checked.config_profiles,
                  crpgs_verified.checked.internal_squads)]
        + ['%d problems:' | format(crpgs_verified.problems | length)] + crpgs_verified.problems
        + ['%d notes:' | format(crpgs_verified.notes | length)] + crpgs_verified.notes
      }}

- name: The panel must route every host to the exit it is named after
  ansible.builtin.assert:
    that:
      - crpgs_verified.problems | length == 0
    fail_msg: >-
      {{ crpgs_verified.problems | length }} problems in the panel of
      {{ inventory_hostname }}, listed above. Regenerate the stages involved
      (remnawave_generate_all.yaml), or resolve the hosts left out by hand.
    quiet: true
  when:
    - vpn_server_remnawave_verify_fail | bool
    - not ansible_check_mode
