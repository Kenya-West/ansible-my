---
# Entry point (tasks_from: clean_nodes). Deletes - or disables, with
# vpn_server_remnawave_nodes_clean_state: disabled - every node of the panel on
# the host the role runs against that carries all the primary tags of
# vpn_server_remnawave_tags. Nodes without them are never touched.

- name: Check the tags the role filters by
  ansible.builtin.include_tasks: validate_tags.yml

- name: The clean state must be one the role knows
  ansible.builtin.assert:
    that:
      - vpn_server_remnawave_nodes_clean_state in ['absent', 'disabled']
    fail_msg: >-
      vpn_server_remnawave_nodes_clean_state is
      '{{ vpn_server_remnawave_nodes_clean_state }}'; it can be absent or disabled.
    quiet: true

- name: Clean the panel of this host
  module_defaults:
    group/kenyawest.remnawave.remnawave:
      panel_url: "{{ crpgs_panel.panel_url }}"
      token: "{{ crpgs_panel.token }}"
      api_key: "{{ crpgs_panel.api_key }}"
      validate_certs: "{{ crpgs_panel.validate_certs }}"
      timeout: "{{ crpgs_panel.timeout }}"
  block:
    - name: Read the nodes in the panel
      ansible.builtin.include_tasks: read_panel.yml
      vars:
        crpgs_gather:
          nodes: {}

    - name: Pick the nodes carrying the primary tags
      ansible.builtin.set_fact:
        crpgs_clean_nodes: "{{ remnawave_gathered.nodes | remnawave_select_tagged(crpgs_primary_tags) }}"

    - name: Report the nodes to clean
      ansible.builtin.debug:
        msg: >-
          {{
            ['%d nodes of %s carry %s and will be %s:' | format(
                crpgs_clean_nodes | length, inventory_hostname,
                crpgs_primary_tags | join(', '),
                'deleted' if vpn_server_remnawave_nodes_clean_state == 'absent' else 'disabled')]
            + crpgs_clean_nodes | map(attribute='name') | list
          }}

    - name: Confirm the cleaning
      ansible.builtin.pause:
        prompt: >-
          Type 'yes' to {{ 'delete' if vpn_server_remnawave_nodes_clean_state == 'absent' else 'disable' }}
          the nodes listed above
      register: crpgs_clean_answer
      when:
        - crpgs_clean_nodes | length > 0
        - not ansible_check_mode
        - not vpn_server_remnawave_nodes_clean_confirm | bool

    - name: The cleaning must be confirmed
      ansible.builtin.assert:
        that:
          - >-
            ansible_check_mode
            or vpn_server_remnawave_nodes_clean_confirm | bool
            or crpgs_clean_answer.user_input | default('') | trim | lower == 'yes'
        fail_msg: Not confirmed. Nothing was changed.
        quiet: true
      when: crpgs_clean_nodes | length > 0

    - name: Clean the nodes
      kenyawest.remnawave.node:
        name: "{{ item.name }}"
        state: "{{ vpn_server_remnawave_nodes_clean_state }}"
      loop: "{{ crpgs_clean_nodes }}"
      loop_control:
        label: "{{ item.name }} ({{ item.address }})"
      delegate_to: localhost
