---
# Turn the facts of the nodes relating to this panel into the setup to apply.
# Everything the role writes - hosts, outbounds, rules and the route ids tying
# them together - is derived here in one pass, so the three sides cannot drift
# apart.

- name: Require the ordered config profile composition
  ansible.builtin.assert:
    that:
      - vpn_server_remnawave_config_profiles_common is not defined
      - vpn_server_remnawave_config_profiles_addons is not defined
    fail_msg: >-
      Replace vpn_server_remnawave_config_profiles_common and
      vpn_server_remnawave_config_profiles_addons with
      vpn_server_remnawave_config_profiles_composition: ordered named fragments
      with config mappings, optional profiles selectors and snippet definitions.
    quiet: true

- name: Start from no related nodes
  ansible.builtin.set_fact:
    crpgs_related_nodes: []
    crpgs_domainless_nodes: []

- name: Find the nodes that relate to this panel
  ansible.builtin.include_tasks: resolve_node_relation.yml
  loop: "{{ groups[vpn_server_remnawave_hosts_node_group] | default([]) }}"
  loop_control:
    loop_var: crpgs_node

- name: There must be nodes relating to this panel
  ansible.builtin.assert:
    that:
      - crpgs_related_nodes | length > 0
    fail_msg: >-
      No host of group '{{ vpn_server_remnawave_hosts_node_group }}' relates
      to {{ inventory_hostname }} through its host_relations
      ({{ vpn_server_remnawave_hosts_node_relation_group }}/{{
      vpn_server_remnawave_hosts_node_relation_component }}), so there are no
      nodes to publish.

- name: Collect the node facts the setup is built from
  ansible.builtin.set_fact:
    # panel_address, panel_port, panel_country_code and panel_inbounds are how
    # the panel reaches the node; read by the nodes stage only. geo and the
    # exclusive pair choose the node's scope, which with its protocol picks the
    # config profile it activates. Jinja has no comments inside an expression,
    # so this note lives here.
    crpgs_nodes: >-
      {%- set collected = [] -%}
      {%- for node in crpgs_related_nodes -%}
      {%-   set facts = hostvars[node] -%}
      {%-   set protocol = facts.remna_node_primary_protocol_type | default('', true) -%}
      {%-   set _ = collected.append({
              'name': node,
              'panel_name': facts.remna_node_name_in_panel | default(node, true),
              'panel_address': facts.remna_node_panel_address | default(facts.ansible_host | default(node), true),
              'panel_port': facts.remna_node_control_port | default(0, true),
              'panel_country_code': facts.remna_node_panel_country_code | default('XX', true),
              'panel_inbounds': facts.remna_node_panel_inbounds | default([], true),
              'country': facts.country_code_upper | default('', true),
              'geo': facts.vpn_deployment_censorship_geo | default('global', true),
              'exclusive_member': node in groups[vpn_server_remnawave_config_profiles_exclusive_group] | default([]),
              'exclusive_profile': facts.remna_node_panel_exclusive_profile | default('', true),
              'protocol': (protocol.full | default('', true) if protocol is mapping else protocol)
                          | default(vpn_server_remnawave_snippets_default_protocol_type, true),
              'domains': (facts.domains_keys | default({}))
                         .get(vpn_server_remnawave_hosts_node_manage_key, []),
            }) -%}
      {%- endfor -%}
      {{ collected }}
    # Every exit's outbound and its tag, planned once in the inventory
    # (group_vars/vpn_server_remnawave/snippets.yaml) for the model and the
    # snippets stage alike.
    crpgs_outbounds_plan: "{{ vpn_server_remnawave_snippets_outbounds_plan }}"

- name: Report the nodes this panel is built from
  ansible.builtin.debug:
    msg: >-
      {{ crpgs_related_nodes | length }} nodes relate to {{ inventory_hostname }}:
      {{ crpgs_related_nodes | join(', ') }}{{
        ('. Skipped, publishing no ' ~ vpn_server_remnawave_hosts_node_manage_key ~ ' domains: '
         ~ crpgs_domainless_nodes | join(', ')) if crpgs_domainless_nodes | length > 0 else '' }}

- name: Build the desired setup
  ansible.builtin.set_fact:
    crpgs_model: "{{ crpgs_nodes | remnawave_model(crpgs_model_options) }}"
  vars:
    crpgs_model_options:
      default_protocol: "{{ vpn_server_remnawave_snippets_default_protocol_type }}"
      direct_domain_types: "{{ vpn_server_remnawave_hosts_node_manage_domain_types_direct_filter }}"
      entry_domain_types: "{{ vpn_server_remnawave_hosts_node_manage_domain_types_specific_filter }}"
      entry_country_codes: "{{ vpn_server_remnawave_hosts_chain.entry_country_codes | default([]) }}"
      skip_same_country: "{{ vpn_server_remnawave_hosts_chain.skip_same_country | default(true) }}"
      exclude: "{{ vpn_server_remnawave_hosts_chain.exclude | default([]) }}"
      labels: "{{ vpn_server_remnawave_hosts_labels }}"
      # Naming: a domain is published as "<flag> <REGION CODE>-<n>", built from
      # the region maps of group_vars/all/0_defaults/regions.yaml.
      region_codes: "{{ vpn_deployments_region_codes }}"
      flag_symbols: "{{ vpn_deployments_regional_indicator_symbols }}"
      outbounds: "{{ crpgs_outbounds_plan }}"
      route_id_base: "{{ vpn_server_remnawave_hosts_vless_route_id_base }}"
      route_id_range: "{{ vpn_server_remnawave_snippets_vless_route_id_range }}"
      direct_route_id: "{{ vpn_server_remnawave_hosts_vless_route_id_direct }}"
      chain_bind_nodes: "{{ vpn_server_remnawave_hosts_chain_bind_nodes }}"
      remark_chain_separator: "{{ vpn_server_remnawave_hosts_remark_chain_separator }}"
      remark_exclusive_format: "{{ vpn_server_remnawave_hosts_remark_exclusive_format }}"
      # Config profiles: one base per protocol, rendered for every scope in
      # use, with ordered composition fragments and the squads granted them.
      profiles_base: "{{ vpn_server_remnawave_config_profiles_base }}"
      profiles_location: "{{ vpn_server_remnawave_config_profiles_location }}"
      profiles_exclusive: "{{ vpn_server_remnawave_config_profiles_exclusive }}"
      profile_composition: "{{ vpn_server_remnawave_config_profiles_composition }}"
      private_keys: "{{ vpn_server_remnawave_config_profiles_private_keys }}"
      private_key_common: "{{ vpn_server_remnawave_config_profiles_private_key_common }}"
      squads_inbounds: "{{ vpn_server_remnawave_internal_squads_inbounds }}"

- name: Report what the inventory produced
  ansible.builtin.debug:
    msg: >-
      {{ crpgs_model.profiles | length }} config profiles
      ({{ crpgs_model.profiles | map(attribute='name') | join(', ') }}),
      {{ crpgs_model.exits | length }} exits
      ({{ crpgs_model.chained | length }} of them chained),
      {{ crpgs_model.entries | length }} chain entries,
      {{ crpgs_model.hosts | length }} hosts,
      {{ crpgs_outbounds_plan | length }} outbounds,
      {{ crpgs_model.rules | length }} chain rules,
      route ids
      {{ crpgs_model.chained | map(attribute='route_id') | min | default('-') }}-{{
         crpgs_model.chained | map(attribute='route_id') | max | default('-') }}

- name: Surface anything questionable in the inventory
  ansible.builtin.debug:
    msg: "{{ crpgs_model.warnings }}"
  when: crpgs_model.warnings | length > 0
