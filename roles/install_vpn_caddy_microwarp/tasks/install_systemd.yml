- name: Reconcile user-scoped Microwarp rotation service and timer
  ansible.builtin.include_role:
    name: kwtoolset/systemd_timer
  vars:
    systemd_timer_units: "{{ systemd_unit_configs }}"
    systemd_timer_state: "{{ role_state }}"
    systemd_timer_legacy_cron_jobs: >-
      {{ [{'user': 'root', 'name': microwarp_legacy_cron_name}]
         if microwarp_migrate_legacy_cron | bool else [] }}
  args:
    apply:
      tags:
        - update_config_hard
        - install_systemd_timer
        - update_systemd_timer
  tags:
    - update_config_hard
    - install_systemd_timer
    - update_systemd_timer
