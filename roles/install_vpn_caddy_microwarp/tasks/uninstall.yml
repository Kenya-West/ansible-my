- name: Remove Microwarp rotation timer and service
  ansible.builtin.include_tasks: install_systemd.yml
  tags:
    - always

- name: compose_down
  ansible.builtin.include_role:
    name: kwtoolset/compose_down

- name: Remove {{ dest_path_full }} directory
  ansible.builtin.file:
    path: "{{ dest_path_full }}"
    state: absent
