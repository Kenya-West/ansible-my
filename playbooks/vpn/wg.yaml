---
- name: Install WireGuard as separate service (Dockerized)
  hosts: vpn_caddy
  become: false
  become_user: "{{ standard_user }}"
  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: vpn_caddy
        resolve_host_relations_component: wg
    - install_vpn_caddy_wg
