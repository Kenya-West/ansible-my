---
- name: Install and reconcile declared MongoDB backups
  hosts: backup_restic_node
  become: false
  tasks:
    - name: Enroll explicitly configured legacy MongoDB endpoints
      ansible.builtin.include_role:
        name: install_backup_node_mongodb
        tasks_from: legacy-endpoints
        apply:
          tags: [always]
      when: mongotools_mongodb_endpoints is defined
      tags: [always]

    - name: Reconcile MongoDB manifests without a legacy endpoint producer
      ansible.builtin.include_role:
        name: install_backup_node_mongodb
        apply:
          tags: [always]
      when: mongotools_mongodb_endpoints is not defined
      tags: [always]
