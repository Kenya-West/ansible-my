---
- name: Remove Autorestic on node
  hosts: backup_restic_node
  become: false
  become_user: "{{ standard_user }}"
  vars:
    project_dir: autorestic
    project_root_dir: "{{ backup_restic_node.project.root }}"
    source_asset_rootpath_common: "{{ location_custom_files_path_common }}/{{ project_root_dir }}"
    source_asset_fullpath_common: "{{ source_asset_rootpath_common }}/{{ project_dir }}"
    source_asset_rootpath_project: "{{ location_custom_files_path_hostname }}/{{ project_root_dir }}"
    source_asset_fullpath_project: "{{ source_asset_rootpath_project }}/{{ project_dir }}"
    dest_project_rootpath: "/home/{{ standard_user }}/{{ project_root_dir }}"
    dest_project_fullpath: "{{ dest_project_rootpath }}/{{ project_dir }}"

  pre_tasks:
    - name: Stop and remove Autorestic timers before removing backup scripts
      ansible.builtin.include_role:
        name: install_backup_node_restic
        tasks_from: systemd
      vars:
        role_state: absent

  roles:
    - name: remove_project_dirs
      vars:
        remove_project_dirs: "['{{ dest_project_fullpath }}']"
