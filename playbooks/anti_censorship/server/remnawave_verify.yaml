---
# Reads the panel of each vpn_server_remnawave host and checks what it holds
# against itself and against the inventory, writing nothing: every managed
# host's route id must lead, through the rules and outbounds snippets, to the
# exit the host is named after; its nodes must activate its config profile and
# inbound; the profile must embed the snippets. Problems fail the play, notes
# (a stale host already disabled, a rule no host uses) do not.
#
#   -e vpn_server_remnawave_verify_fail=false   report only
- name: Verify the Remnawave setup
  hosts: vpn_server_remnawave
  become: false
  become_user: "{{ standard_user }}"
  gather_facts: false
  vars:
    vpn_server_remnawave_generate_stages:
      - verify

  roles:
    - configure_remnawave_panel_generate_setup
