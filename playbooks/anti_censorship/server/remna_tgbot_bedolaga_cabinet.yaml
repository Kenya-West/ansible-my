---
- name: Install and configure Cabinets for Bedolaga Telegram bot
  hosts: vpn_server_remnawave
  become: false
  become_user: "{{ standard_user }}"

  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: vpn_server_remnawave
        resolve_host_relations_component: tgbot_bedolaga_cabinet
    - install_vpn_server_remnawave_tgbot_bedolaga_cabinet
