---
- name: Install Zapret (Dockerized)
  hosts: vpn_caddy
  become: false
  become_user: "{{ standard_user }}"
  
  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: vpn_server_remnawave
        resolve_host_relations_component: zapret
    - install_vpn_caddy_zapret
