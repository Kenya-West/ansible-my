---
# Screenshots land in inventory/host_vars/<host>/benchmarks/<timestamp>/.
# Run a subset: -e '{"benchmarks_termshot_select": ["yabs", "bench_sh"]}'
- name: Run benchmarks and save their terminal screenshots
  hosts: general_vps_prepare
  become: true
  vars:
    benchmarks_termshot_use_ohmyposh: false

  environment:
    EGET_GITHUB_TOKEN: "{{ github_api_token_eget | default(omit) }}"

  roles:
    - name: run_benchmarks_termshot
