---
# Add a host to the inventory: asks for its name parts, address, groups and
# domains, then writes inventory/host_vars/<hostname>/ and the host's inventory
# sections. See roles/setup/node.
#
#   ansible-playbook -i inventory/production.ini playbooks/ansible/node/add_host_initial.yaml

- name: Create basic host configuration
  hosts: localhost
  become: false
  gather_facts: false

  roles:
    - role: setup/node
