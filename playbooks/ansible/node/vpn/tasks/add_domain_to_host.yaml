---
# Adds add_domains_to_list_caddy_new_domain to domains_node.remna_node_extra of
# the host's 0_all/1_domains.yaml. group_vars/vpn_caddy/domain_generator.yaml
# appends those entries to the generated domains_keys.remna_node.

- name: "{{ __host_name }}: check domains file exists"
  ansible.builtin.stat:
    path: "{{ __host_domains_file }}"
  register: __host_stat

- name: "{{ __host_name }}: warn and skip when domains file is missing"
  when: not __host_stat.stat.exists
  block:
    - name: "{{ __host_name }}: warn file not found"
      ansible.builtin.debug:
        msg: "WARNING: {{ __host_domains_file }} not found, skipping {{ __host_name }}"

    - name: "{{ __host_name }}: append report entry (file not found)"
      ansible.builtin.set_fact:
        __report: "{{ __report + [{'host': __host_name, 'status': 'skipped', 'reason': 'file not found'}] }}"

- name: "{{ __host_name }}: parse and update existing domains file"
  when: __host_stat.stat.exists
  block:
    - name: "{{ __host_name }}: read domains file"
      ansible.builtin.slurp:
        src: "{{ __host_domains_file }}"
      register: __host_slurp

    - name: "{{ __host_name }}: parse the domains file and the current domains"
      ansible.builtin.set_fact:
        __host_parsed: "{{ (__host_slurp.content | b64decode) | from_yaml }}"
        __host_current_domains: >-
          {{ (hostvars[__host_name].domains_keys | default({})).remna_node | default([])
             | map(attribute='domain') | list }}

    - name: "{{ __host_name }}: validate expected schema"
      ansible.builtin.assert:
        that:
          - __host_parsed is mapping
          - __host_parsed.domains_node is defined
          - __host_parsed.domains_node is mapping
          - __host_parsed.domains_node.remna_node_extra | default([], true) is sequence
        fail_msg: "{{ __host_domains_file }} has no domains_node (not a generated node)"

    - name: "{{ __host_name }}: add domain when not already present"
      when: add_domains_to_list_caddy_new_domain not in __host_current_domains
      block:
        # The key of vpn_deployment_domain_prefix the domain's first label looks like.
        - name: "{{ __host_name }}: classify the new domain's type"
          ansible.builtin.set_fact:
            __new_domain_type_key: >-
              {{
                'unique' if __new_domain_label == __host_name
                else 'net_all' if __new_domain_label is match('^net-[a-z0-9]+-all$')
                else 'chain_all' if __new_domain_label is match('^chain-[a-z0-9]+-all$')
                else 'net_protocol' if __new_domain_label is match('^net-[a-z0-9]+-[a-z]+-[a-z]+$')
                else 'chain_protocol' if __new_domain_label is match('^chain-[a-z0-9]+-[a-z]+-[a-z]+$')
                else 'net_location' if __new_domain_label is match('^net-[a-z0-9]+-[0-9]+$')
                else 'chain_location' if __new_domain_label is match('^chain-[a-z0-9]+-[0-9]+$')
                else 'other'
              }}
          vars:
            __new_domain_label: "{{ add_domains_to_list_caddy_new_domain.split('.')[0] }}"

        - name: "{{ __host_name }}: write the updated domains file"
          ansible.builtin.copy:
            dest: "{{ __host_domains_file }}"
            mode: preserve
            content: >-
              {{ __host_parsed
                 | combine({'domains_node': __host_parsed.domains_node
                            | combine({'remna_node_extra': (__host_parsed.domains_node.remna_node_extra | default([], true))
                                       + [{'domain': add_domains_to_list_caddy_new_domain,
                                           'type': '{{ vpn_deployment_domain_prefix.' ~ __new_domain_type_key ~ '.type }}'}]})})
                 | to_nice_yaml(indent=2, sort_keys=false) }}

        - name: "{{ __host_name }}: append report entry (added)"
          ansible.builtin.set_fact:
            __report: "{{ __report + [{'host': __host_name, 'status': 'added'}] }}"

    - name: "{{ __host_name }}: append report entry (already present)"
      when: add_domains_to_list_caddy_new_domain in __host_current_domains
      ansible.builtin.set_fact:
        __report: "{{ __report + [{'host': __host_name, 'status': 'skipped', 'reason': 'already present'}] }}"
  rescue:
    - name: "{{ __host_name }}: warn on parse failure or unexpected schema"
      ansible.builtin.debug:
        msg: "WARNING: {{ __host_domains_file }} could not be parsed or has an unexpected schema, skipping {{ __host_name }}"

    - name: "{{ __host_name }}: append report entry (schema mismatch)"
      ansible.builtin.set_fact:
        __report: "{{ __report + [{'host': __host_name, 'status': 'skipped', 'reason': 'unexpected schema'}] }}"
