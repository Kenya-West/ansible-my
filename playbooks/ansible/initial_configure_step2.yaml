---
# Step 2 of the initial configuration, on the controller: the secrets the
# nodes share, in inventory/group_vars/all/z_common_hosts_secrets. The secrets
# of a server are written into its host_vars by
# playbooks/ansible/server/add_server_initial.yaml. See roles/setup/secrets.
#
#   ansible-playbook -i inventory/production.ini playbooks/scenarios/initial_configure_step2.yaml

- name: Run initial configuration tasks (step 2)
  hosts: localhost
  become: false
  gather_facts: false

  roles:
    - role: setup/secrets
