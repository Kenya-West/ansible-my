---
# Always preview with --check. This does not deploy or contact Remnawave.
# Refresh every enabled connector account, including services absent from inventory.
- name: Reconcile infrastructure records in infra-billing
  hosts: analytics_server
  gather_facts: false
  become: false
  roles:
    - role: configure_infra_billing
      vars:
        infra_billing_action: reconcile
        infra_billing_sync_all_accounts: true
