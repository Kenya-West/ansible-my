---
- name: Install and configure XRay checker
  hosts: analytics_server
  become: false
  become_user: "{{ standard_user }}"
  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: analytics_server
        resolve_host_relations_component: xray_checker
    - install_analytics_server_xray_checker