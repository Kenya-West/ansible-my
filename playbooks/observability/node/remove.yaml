---
- name: Remove VPN directories and project (WARNING - This will remove data files, too!)
  hosts: all
  become: true
  become_user: analytics_node

  roles:
    - name: remove_project_dirs
      vars:
        remove_project_dirs: "{{ remove_project_dirs_remapped }}"
    - name: remove_analytics_node

  pre_tasks:
    - name: Remap remove_project_dirs variable to contain complete paths - add /home/{{ standard_user }} prefix
      ansible.builtin.set_fact:
        remove_project_dirs_remapped: "{{ analytics_node.project.paths.values() | list | map('regex_replace', '^(.*)$', '/home/{{ standard_user }}/\\1') }}"
    - name: Add root directory to remove_project_dirs variable
      ansible.builtin.set_fact:
        remove_project_dirs_remapped: "{{ remove_project_dirs_remapped + ['/home/{{ standard_user }}/{{ analytics_node.project.root }}'] }}"

  post_tasks:
    - name: Remove prometheus node_exporter service
      ansible.builtin.systemd:
        name: node_exporter.service
        state: stopped
        enabled: false
      ignore_errors: true
