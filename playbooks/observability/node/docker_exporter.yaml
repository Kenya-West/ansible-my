---
- name: Install and configure Docker exporter with dependencies
  hosts: analytics_node
  become: false
  become_user: "{{ standard_user }}"

  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: analytics_server
        resolve_host_relations_component: docker_exporter
    - install_analytics_node_docker_exporter