---
- name: Install Caddy (Docker)
  hosts: vpn_caddy
  become: false
  become_user: "{{ standard_user }}"
  strategy: ansible.builtin.host_pinned

  roles:
    - name: kwtoolset/resolve_host_relations
      vars:
        resolve_host_relations_group: vpn_caddy
        resolve_host_relations_component: caddy
    - install_vpn_caddy_caddy
