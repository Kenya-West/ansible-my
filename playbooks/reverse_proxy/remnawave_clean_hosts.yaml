---
# Deletes every Remnawave host carrying the primary tags of
# vpn_server_remnawave_tags from the panel of each vpn_server_remnawave host,
# after listing them and asking for confirmation. Hosts without those tags are
# left alone.
#
#   -e vpn_server_remnawave_hosts_clean_state=disabled   disable instead of delete
#   -e vpn_server_remnawave_hosts_clean_confirm=true     do not ask
- name: Clean the Ansible-managed Remnawave hosts
  hosts: vpn_server_remnawave
  become: false
  become_user: "{{ standard_user }}"
  gather_facts: false

  tasks:
    - name: Clean the hosts carrying the primary tags
      ansible.builtin.include_role:
        name: configure_remnawave_panel_generate_setup
        tasks_from: clean_hosts
