---
# Clean UFW down to SSH, then install ufw-docker and ufw-docker-automated.
# Order matters: the cleanup must come first, see the comment in the migrate playbook.
# Supports --check.
- name: Remove UFW rules except SSH
  ansible.builtin.import_playbook: ufw_migrate_to_ufw_docker_automated.yaml

- name: Install ufw-docker and ufw-docker-automated
  ansible.builtin.import_playbook: ufw_docker.yaml

- name: Install caddy
  ansible.builtin.import_playbook: ../reverse_proxy/caddy.yaml
  vars:
    install_vpn_caddy_caddy_prune_sni_templates: true

- name: Install remnanode
  ansible.builtin.import_playbook: ../anti_censorship/node/remna.yaml

- name: Install node_exporter again
  ansible.builtin.import_playbook: ../observability/node/node_exporter.yaml

- name: Install docker_exporter again
  ansible.builtin.import_playbook: ../observability/node/docker_exporter.yaml
