# node_address: the domain dialed; node_route_id: the route handed to it in
# the service user's UUID (remnawave_route_uuid) - 0 when it is the exit.
vless_reality_xhttp_001:
  tag: "tag_id"
  protocol: vless

  settings:
    vnext:
      - port: 443
        users:
          - id: "{{ service_user_id | remnawave_route_uuid(node_route_id | default(0)) }}"
            flow: ''
            level: 0
            encryption: none
        address: "{{ node_address }}"

  streamSettings:
    network: xhttp
    security: reality
    realitySettings:
      password: "{{ vpn_server_remnawave_xray_reality_password }}"
      serverName: "{{ node_address }}"
      fingerprint: firefox
    xhttpSettings:
      host: "{{ node_address }}"
      mode: auto
      path: "/"
      headers: {}
      noSSEHeader: false
      xPaddingBytes: 100-1000
      scMaxBufferedPosts: 30
      scMaxEachPostBytes: 1000000
      scStreamUpServerSecs: 20-80
