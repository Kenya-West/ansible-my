# Remnawave config profiles generated by
# playbooks/anti_censorship/server/remnawave_generate_config_profiles.yaml.
#
# A node activates exactly one config profile, chosen by its scope and the
# protocol it serves (remna_node_primary_protocol_type):
#
#   global     a node of the global censorship geo -> the base profile itself
#              (Default-Profile, Default-xHTTP)
#   location   a node of any other geo -> Reverse-<CODE>, one per location some
#              node is in (Reverse-RU, Reverse-RU-xHTTP), gone with its last node
#   exclusive  a node of the vps_exclusive group -> the exclusive profile it
#              names in remna_node_panel_exclusive_profile, out of the panel's
#              vpn_server_remnawave_config_profiles_exclusive (host_vars)
#
# Every variant holds the base profile's inbounds under tags of its own
# (VLESS_TCP_REALITY_REVERSE_RU, VLESS_TCP_REALITY_XENUS) - the panel keeps
# inbound tags unique - and the ordered composition fragments whose selectors
# pick it (WARP for the global geo only).
#
# A profile is found in the panel by the tag of its inbound, and failing that by
# its name. Never rename the inbound of a live profile: the panel deletes the old
# inbound, and with it its place in every internal squad.
#
# Nothing here is repeated from elsewhere: the snippet names come from
# snippets.yaml, the serverNames from server_names.yaml and the REALITY private
# keys from the panel's host_vars (vpn_server_remnawave_inbounds_private_keys).

# Generated profiles carry every tag of vpn_server_remnawave_tags (main.yaml), and
# only profiles carrying all its primary_filter tags are the role's: those are
# the ones it updates, retires and cleans.
#
# A generated profile whose inbound or name a profile without those tags already
# has is left out and reported. Set this to true to take such profiles over (and
# tag them), e.g. once, to adopt profiles made by hand before the tags existed.
vpn_server_remnawave_config_profiles_adopt_untagged: false

# What to do with profiles carrying the primary tags that the inventory no
# longer produces - a location whose last node is gone. Profiles cannot be
# disabled, only deleted, and never while a node the inventory still produces
# activates them. It can be: ignore, delete.
vpn_server_remnawave_config_profiles_prune: delete

# Profiles never deleted, by pruning or cleaning, on top of the ones a node
# still activates. The panel reserves the name Default-Profile: a profile of
# that name can be updated and taken over, but not created, so deleting it
# loses the name for good.
vpn_server_remnawave_config_profiles_protected:
  - Default-Profile

# playbooks/anti_censorship/server/remnawave_clean_config_profiles.yaml: skip
# the confirmation prompt.
vpn_server_remnawave_config_profiles_clean_confirm: false

# ---------------------------------------------------------------------------
# Parts shared by the profiles
# ---------------------------------------------------------------------------

vpn_server_remnawave_config_profiles_log:
  error: /var/log/remnanode/error.log
  access: /var/log/remnanode/access.log
  loglevel: warning

vpn_server_remnawave_config_profiles_sniffing:
  enabled: true
  destOverride:
    - http
    - tls
    - quic

# Where REALITY forwards what is not a client: the Caddy of the node
# (roles/install_vpn_caddy_caddy, container caddy).
vpn_server_remnawave_config_profiles_reality_target: caddy:443

# The REALITY private key of every inbound tag: its entry in
# vpn_server_remnawave_inbounds_private_keys.specific, else the entry of the
# base tag it is derived from (VLESS_TCP_REALITY for
# VLESS_TCP_REALITY_REVERSE_RU), else the common key.
vpn_server_remnawave_config_profiles_private_keys: >-
  {%- set keys = vpn_server_remnawave_inbounds_private_keys
                 | mandatory('vpn_server_remnawave_config_profiles_private_keys: ' ~ inventory_hostname ~ ' has no vpn_server_remnawave_inbounds_private_keys') -%}
  {%- set out = {} -%}
  {%- for entry in keys.specific | default([], true) -%}
  {%-   set _ = out.update({entry.id: entry.privateKey}) -%}
  {%- endfor -%}
  {{ out }}
vpn_server_remnawave_config_profiles_private_key_common: "{{ vpn_server_remnawave_inbounds_private_keys.common | default('') }}"

# ---------------------------------------------------------------------------
# Base profiles
# ---------------------------------------------------------------------------

# One per protocol, as {protocol, name, variant_suffix, inbounds}: rendered as
# it is for the global scope, and as "<scope name><variant_suffix>" with
# "<tag>_<scope suffix>" inbounds for every location and exclusive scope some
# node of that protocol is in, or a location/exclusive chain needs that entry
# protocol.
# The REALITY privateKey is filled in per inbound
# tag (vpn_server_remnawave_config_profiles_private_keys).
vpn_server_remnawave_config_profiles_base:
  - protocol: "{{ remna_protocol_types.vless_reality_tcp.full }}"
    name: Default-Profile
    variant_suffix: ''
    inbounds:
      - tag: VLESS_TCP_REALITY
        port: 443
        listen: 0.0.0.0
        protocol: vless
        settings:
          clients: []
          decryption: none
        sniffing: "{{ vpn_server_remnawave_config_profiles_sniffing }}"
        streamSettings:
          network: raw
          security: reality
          realitySettings:
            show: false
            xver: 0
            target: "{{ vpn_server_remnawave_config_profiles_reality_target }}"
            shortIds:
              - ""
            serverNames: "{{ vpn_server_remnawave_server_names }}"
            minClientVer: 0.0.0

  - protocol: "{{ remna_protocol_types.vless_reality_xhttp.full }}"
    name: Default-xHTTP
    variant_suffix: -xHTTP
    inbounds:
      - tag: VLESS_REALITY_XHTTP
        port: 443
        listen: 0.0.0.0
        protocol: vless
        settings:
          clients: []
          decryption: none
        sniffing: "{{ vpn_server_remnawave_config_profiles_sniffing }}"
        streamSettings:
          network: xhttp
          security: reality
          xhttpSettings:
            mode: auto
            path: /
            headers: {}
            noSSEHeader: false
            xPaddingBytes: 100-1000
            scMaxBufferedPosts: 30
            scMaxEachPostBytes: 1000000
            scStreamUpServerSecs: 20-80
          realitySettings:
            show: false
            xver: 0
            target: "{{ vpn_server_remnawave_config_profiles_reality_target }}"
            shortIds:
              - ""
            serverNames: "{{ vpn_server_remnawave_server_names }}"

# ---------------------------------------------------------------------------
# Scopes
# ---------------------------------------------------------------------------

# The variant of a location - any censorship geo but global. {code} is the
# geo's region code upper-cased (vpn_deployments_region_codes: russia -> RU),
# {geo} its name: Reverse-RU with VLESS_TCP_REALITY_REVERSE_RU.
vpn_server_remnawave_config_profiles_location:
  name: Reverse-{code}
  inbound_suffix: REVERSE_{code}

# The exclusive profiles are the panel's own, in its host_vars, as
# {name, inbound_suffix}; a node of this group names one of them in
# remna_node_panel_exclusive_profile (host_vars/<node>/vpn_caddy/remna.yaml).
vpn_server_remnawave_config_profiles_exclusive: []
vpn_server_remnawave_config_profiles_exclusive_group: vps_exclusive

# ---------------------------------------------------------------------------
# Ordered configuration composition
# ---------------------------------------------------------------------------

# One ordered list assembles the config of every profile. Matching fragments
# contribute normal Xray config mappings: nested mappings merge, lists append
# in declaration order, scalar values are replaced by the last matching one.
# Thus routing precedence is visible here: defaults -> WARP -> chain/geo rules.
# Per-protocol base.config overrides the result (its lists replace, not append);
# the role then supplies the generated inbounds.
#
# Each fragment has a unique name, an optional profiles selector (kind, geo,
# scope, protocol, profile), config, and optional snippets: [{name, snippet}].
# Snippets are written once, even if several profiles/fragments embed them.
# Optional inbounds lists base inbound tags and scopes inline routing rules
# to their generated tags; scoped rules cannot be snippet references.
vpn_server_remnawave_config_profiles_composition:
  - name: defaults
    snippets:
      - name: "{{ vpn_server_remnawave_snippets_key_outbounds_default }}"
        snippet: "{{ vpn_server_remnawave_snippets_outbounds_default }}"
      - name: "{{ vpn_server_remnawave_snippets_key_rules_default }}"
        snippet: "{{ vpn_server_remnawave_snippets_rules_default }}"
    config:
      log: "{{ vpn_server_remnawave_config_profiles_log }}"
      outbounds:
        - snippet: "{{ vpn_server_remnawave_snippets_key_outbounds_default }}"
      routing:
        rules:
          - snippet: "{{ vpn_server_remnawave_snippets_key_rules_default }}"

  # The microwarp proxy beside global-geo nodes, including exclusive ones.
  # WARP precedes chain/geo rules, but its rule matches only unmarked/direct
  # traffic (snippets_warp.yaml); explicit chain routes still reach their exit.
  # Rule and outbound are selected together: non-global profiles embed neither
  # snippet. A host's direct route id (2) alone cannot activate the WARP rule.
  - name: warp
    profiles:
      geo: global
    snippets:
      - name: "{{ vpn_server_remnawave_snippets_key_outbounds_warp }}"
        snippet: "{{ vpn_server_remnawave_snippets_outbounds_warp }}"
      - name: "{{ vpn_server_remnawave_snippets_key_rules_warp }}"
        snippet: "{{ vpn_server_remnawave_snippets_rules_warp }}"
    config:
      outbounds:
        - snippet: "{{ vpn_server_remnawave_snippets_key_outbounds_warp }}"
      routing:
        rules:
          - snippet: "{{ vpn_server_remnawave_snippets_key_rules_warp }}"

  - name: chains
    # outbounds_all and rules_all are generated/merged by the snippets stage;
    # only the balancers are written whole from this fragment.
    snippets:
      - name: "{{ vpn_server_remnawave_snippets_key_balancers_all }}"
        snippet: "{{ vpn_server_remnawave_snippets_balancers_all }}"
    config:
      outbounds:
        - snippet: "{{ vpn_server_remnawave_snippets_key_outbounds_all }}"
      routing:
        rules:
          - snippet: "{{ vpn_server_remnawave_snippets_key_rules_all }}"
        balancers:
          - snippet: "{{ vpn_server_remnawave_snippets_key_balancers_all }}"

# ---------------------------------------------------------------------------
# Internal squads
# ---------------------------------------------------------------------------

# The internal squads granted the inbounds of the profiles a selector picks, as
# {squad, profiles}. A user reaches an inbound only through a squad, so a new
# profile's inbounds are granted before any node switches to them. Squads are
# made by hand and hold the users: this only adds inbounds to the squads named
# here, never removes one, and never creates a squad.
#
# A chain into an exclusive exit is shown only to squads granted the exit's
# primary profile, and advertises its exclusive variant matching the entry's
# transport. Selecting the whole scope grants both TCP and xHTTP inbounds.
vpn_server_remnawave_internal_squads_inbounds:
  - squad: Default-Squad
    profiles:
      kind: global
  - squad: Reverse-proxy
    profiles:
      kind: location
      geo: russia
  - squad: Calibrach-extranet
    profiles:
      scope: Calibrach-extranet
  - squad: Xenus-team
    profiles:
      scope: Xenus-team
