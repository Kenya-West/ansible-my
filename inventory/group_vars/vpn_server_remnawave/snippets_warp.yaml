# Routing through the microwarp SOCKS5 proxy (roles/install_vpn_caddy_microwarp)
# that runs beside every node: one outbound and the rule sending some domains
# to it. Each is a snippet of its own, written as it is and embedded only in
# the profiles of the global geo by the warp composition fragment
# (vpn_server_remnawave_config_profiles_composition, config_profiles.yaml).
#
# The snippet catalog is not a global routing table. Non-global profiles do
# not embed this rule or its outbound; their direct route id 2 stays local to
# those profiles and does not activate WARP.
#
# The proxy's values come from group_vars/vpn_caddy/warp.yaml, which the role
# uses as well - the panel hosts are vpn_caddy hosts too. The node's xray reaches
# the proxy by its container name on the shared docker network.

# <prefix>-<protocol>-<NNN>, as the tags of the chain outbounds are
# (out-chain-eu-tcp-001), under a prefix of its own so the role never takes it
# for one of the outbounds it owns.
vpn_server_remnawave_snippets_outbound_warp_tag: out-warp-socks

vpn_server_remnawave_snippets_outbounds_warp:
  - tag: "{{ vpn_server_remnawave_snippets_outbound_warp_tag }}"
    protocol: socks
    settings:
      address: "{{ warp_service_name }}"
      port: "{{ warp_socks5_port | int }}"
      user: "{{ warp_socks5_user }}"
      pass: "{{ warp_socks5_pass }}"

vpn_server_remnawave_snippets_rules_warp:
  # WARP precedes the chain snippet on global nodes. Match only unmarked (0)
  # or direct-host traffic, never an explicit chain route: otherwise Russian
  # exits reached through global entries would be bypassed for these domains.
  - vlessRoute: >-
      {{ '0,' ~ (vpn_server_remnawave_hosts_vless_route_id_direct | string)
         if vpn_server_remnawave_hosts_vless_route_id_direct not in [none, '', 0, '0']
         else '0' }}
    domain:
      - "geosite:google-gemini"
      - "geosite:spotify"
      - "whatismyipaddress.com"
    outboundTag: "{{ vpn_server_remnawave_snippets_outbound_warp_tag }}"
