# It can be: api_token, caddy_custom_path
vpn_server_remnawave_access_mode: caddy_custom_path

# The panel configured is always the vpn_server_remnawave host the playbook
# runs against, with the nodes whose host_relations resolve to it.

# Which Ansible group the nodes are taken from.
vpn_server_remnawave_hosts_node_group: vpn_caddy

# The relation a node names its panel by, the one its remna playbook resolves:
# host_relations.<group>.components.<component>, then host_relations.<group>,
# then host_relations.default. A node is published on the panel it registers with.
vpn_server_remnawave_hosts_node_relation_group: vpn_server_remnawave
vpn_server_remnawave_hosts_node_relation_component: remna

# What property of domains_keys to use for the remna_node domain type. It can be: main, remna_node, or else
vpn_server_remnawave_hosts_node_manage_key: remna_node

# Which domain types to use for the remna_node domain type. Taken from vpn_deployment_domain_prefix.
# These are the domains a node is entered through when it relays for someone else,
# so they are what the generated chain hosts are addressed by.
vpn_server_remnawave_hosts_node_manage_domain_types_specific_filter:
  - "{{ vpn_deployment_domain_prefix.chain_location.type }}"

# Which domain types a node's own, direct Remnawave Host is published on.
# One Remnawave Host is generated per distinct domain here, bound to every
# Ansible host that publishes it - several nodes behind one round-robin
# domain stay a single Host in the panel.
vpn_server_remnawave_hosts_node_manage_domain_types_direct_filter:
  - "{{ vpn_deployment_domain_prefix.net_location.type }}"

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------

# Generated hosts carry every tag of vpn_server_remnawave_tags (main.yaml), and
# only hosts carrying all its primary_filter tags are the role's: those are the
# ones it updates, retires and cleans.
#
# A generated host whose remark a host without those tags already has is left
# out and reported. Set this to true to take such hosts over (and tag them),
# e.g. once, to adopt hosts published before the tags existed.
vpn_server_remnawave_hosts_adopt_untagged: false

# The state generated Remnawave Hosts are published in. A host the panel does
# not have yet is always created disabled, except with enabled. It can be:
#   present:  created disabled, then left in whatever state the panel has, so a
#             host switched on by hand in the panel stays on (the default)
#   disabled: created disabled and disabled again on every run
#   enabled:  created enabled and re-enabled on every run
vpn_server_remnawave_hosts_publish_state: present

# The config profile and inbound generated hosts are attached to. Both are
# required - the panel cannot create a host without them. The inbound may be
# chosen per protocol type (remna_protocol_types.<key>.full); the plain value
# is the fallback.
vpn_server_remnawave_hosts_config_profile: ''
vpn_server_remnawave_hosts_inbound: ''
vpn_server_remnawave_hosts_inbound_by_protocol: {}
#  vless-reality-tcp: vless-reality-tcp
#  vless-reality-xhttp: vless-reality-xhttp

vpn_server_remnawave_hosts_port: 443
vpn_server_remnawave_hosts_fingerprint: chrome

# Human labels used to build host remarks, keyed by the domain label
# (net-europe-1, chain-russia-1). A domain that is not listed is named
# "<flag> <REGION CODE>-<n>" - the flag of the country its nodes are in, the
# region code of vpn_deployments_region_codes and its position among the
# domains of that region, counted from one in domain-index order
# (net-asia-2 -> 🇰🇿 AS-1, net-asia-4 -> 🇰🇿 AS-2). So the panel is readable
# without this being filled in at all.
#
# Remarks are how the role finds the hosts it owns again. Point a label at the
# remark an existing host already has to make the role adopt that host instead
# of creating a second one beside it (see vpn_server_remnawave_hosts_adopt_untagged
# for a host without the primary tags). A domain that must keep its name
# through the renumbering of its region belongs here too.
vpn_server_remnawave_hosts_labels: {}
#  net-europe-1: "🇩🇪 EU-1"
#  chain-russia-1: "RU-1"

# A chain host's remark is "<exit name><separator><entry name>"
# (🇰🇿 AS-1 | by 🇷🇺 RU-1).
vpn_server_remnawave_hosts_remark_chain_separator: ' | by '

# ---------------------------------------------------------------------------
# Chains
# ---------------------------------------------------------------------------

# Every exit gets its own direct Remnawave Host. On top of that it is published
# again through the chain domain of every node that may act as a chain entry,
# so the same exit can be reached the long way round.
vpn_server_remnawave_hosts_chain:
  # A node may act as a chain entry when its country_code_upper is listed
  # here and it publishes a domain of a type in
  # vpn_server_remnawave_hosts_node_manage_domain_types_specific_filter.
  entry_country_codes:
    - RU

  # Do not chain an exit through an entry in its own country: there is no
  # "RU-1 by RU-2", only "AS-1 by RU-2".
  skip_same_country: true

  # Pairs never to generate, on top of the rule above. Each item names an exit
  # by its direct domain, and the entry domains to skip for it; entries: '*'
  # leaves that exit out of chaining altogether.
  exclude: []
  #  - exit: net-europe-15.123987465.xyz
  #    entries: '*'
  #  - exit: net-asia-1.123987465.xyz
  #    entries:
  #      - chain-russia-7.123987465.xyz

# ---------------------------------------------------------------------------
# VLESS route ids
# ---------------------------------------------------------------------------

# Route ids are computed, not stored: a chained exit's id is the base plus its
# position in the ordered list of chained exits (by region, then protocol, then
# domain). Adding or removing a chained exit therefore renumbers the ones after
# it - the rules snippet is regenerated in the same run, so panel and rules stay
# in step, but anything outside this repo that hardcodes an id will not.
vpn_server_remnawave_hosts_vless_route_id_base: 400

# Route id put on every direct host. Leave empty to publish direct hosts
# without a route id at all.
vpn_server_remnawave_hosts_vless_route_id_direct: 2
