# Remnawave Nodes generated by
# playbooks/anti_censorship/server/remnawave_generate_nodes.yaml: one per host
# of vpn_server_remnawave_hosts_node_group whose host_relations resolve to the
# panel (see hosts.yaml). How each node is named and reached is set on the node
# side, in group_vars/vpn_caddy/remna.yaml (remna_node_panel_*).

# Generated nodes carry every tag of vpn_server_remnawave_tags (main.yaml), and
# only nodes carrying all its primary_filter tags are the role's: those are the
# ones it updates, retires and cleans.
#
# A generated node whose name a node without those tags already has is left
# out and reported. Set this to true to take such nodes over (and tag them),
# e.g. once, to adopt nodes registered by hand before the tags existed.
vpn_server_remnawave_nodes_adopt_untagged: false

# The state generated nodes are published in. A node the panel does not have
# yet is always created disabled, except with enabled. It can be:
#   present:  created disabled, then left in whatever state the panel has, so a
#             node switched on by hand in the panel stays on (the default)
#   disabled: created disabled and disabled again on every run
#   enabled:  created enabled and re-enabled on every run
vpn_server_remnawave_nodes_publish_state: present

# What to do with nodes carrying the primary tags that the inventory no longer
# produces. It can be: ignore, disable, delete.
vpn_server_remnawave_nodes_prune: disable

# The config profile a node activates is the one of its scope and protocol
# (config_profiles.yaml): Default-Profile, Reverse-RU, an exclusive one. A
# node lists a subset of its inbounds, by their base tags, in
# remna_node_panel_inbounds (group_vars/vpn_caddy/remna.yaml).

# playbooks/anti_censorship/server/remnawave_clean_nodes.yaml. It can be:
# absent, disabled.
vpn_server_remnawave_nodes_clean_state: absent
vpn_server_remnawave_nodes_clean_confirm: false
