# node_address: the domain dialed; node_route_id: the route handed to it in
# the service user's UUID (remnawave_route_uuid) - 0 when it is the exit.
vless_reality_tcp_001:
  tag: "tag_id"
  protocol: vless

  settings:
    vnext:
      - port: 443
        users:
          - id: "{{ service_user_id | remnawave_route_uuid(node_route_id | default(0)) }}"
            flow: xtls-rprx-vision
            level: 0
            encryption: none
        address: "{{ node_address }}"

  streamSettings:
    network: raw
    security: reality
    realitySettings:
      password: "{{ vpn_server_remnawave_xray_reality_password }}"
      serverName: "{{ node_address }}"
      fingerprint: firefox
