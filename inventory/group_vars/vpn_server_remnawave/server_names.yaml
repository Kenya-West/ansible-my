# serverNames of the XRay REALITY inbounds: every domain the nodes of this
# panel actually declare, and nothing else. One sorted, de-duplicated list of
#
#   - every domain of domains_keys.<vpn_server_remnawave_hosts_node_manage_key>
#     (domains_keys.remna_node, group_vars/vpn_caddy/domain_generator.yaml) of
#     every node whose panel is this host (vpn_server_remnawave_snippets_nodes,
#     snippets.yaml) - the addresses of every generated Remnawave Host, direct
#     and chain, are among them;
#   - the address of every planned outbound
#     (vpn_server_remnawave_snippets_outbounds_plan, snippets.yaml), so the
#     chain outbounds always find their exit's SNI.
#
# A node added, removed or renumbered changes the list on the next run of the
# config profiles; nothing here needs maintaining by hand. The model warns when
# a host or outbound address is missing from a REALITY inbound's serverNames.

vpn_server_remnawave_server_names: >-
  {%- set out = [] -%}
  {%- for node in vpn_server_remnawave_snippets_nodes -%}
  {%-   set declared = (hostvars[node].domains_keys | default({}, true))
                         .get(vpn_server_remnawave_hosts_node_manage_key) | default([], true) -%}
  {%-   for entry in ([declared] if declared is string else declared) -%}
  {%-     set _ = out.append(entry.domain if entry is mapping else entry) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {%- for outbound in vpn_server_remnawave_snippets_outbounds_plan -%}
  {%-   set _ = out.append(outbound.address) -%}
  {%- endfor -%}
  {{ out | select | unique | sort | list }}
