---
packages_list_required:
  uninstall:
    apt:
      - fzf
      - btop
    snap: []
  install:
    apt:
      - bash
      - curl
      - wget
      - unzip
      - gpg
      - git
      - gettext-base
      - locales
      - logrotate
      - rsync
      - openssh-server
      - acl
      - conntrack
      - nftables
      - ufw
      - cron
      - jq
      - lsof
      - net-tools
      - perl
      - parallel
      # Service packages
      - python3-debian # Needed for DEB mirrors
      - python3-docker # Needed for Ansible Docker modules
      - python3-passlib # Needed for Ansible htpasswd module
      - python3-bcrypt # Needed for Ansible htpasswd module
    snap: []
    snap_classic: []

packages_list_essentials:
  uninstall: {}
  install:
    apt:
      - ncdu
      - tree
      - snapd
      - bc
      # TermSCP dependencies
      - libdbus-1-dev
      - pkg-config
      - libsmbclient
      # Extra packages
      - moreutils
      - bat # Ensure this is available or add a task to include its repository
      - fd-find # Use 'fd' for Ubuntu/Debian, might need a PPA
      - httpie
      - hstr
      - duf
      - whois
      - ripgrep
      - micro
      - sqlite3
      - nala
      - doas
      - sysbench
    snap:
      - btop
      - procs
      - trippy
      - dust
    snap_classic:
      - astral-uv

packages_list: "{{ packages_list_required | combine(packages_list_essentials, recursive=True, list_merge='append') }}"
