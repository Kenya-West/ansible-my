# Countries which must resolve to a dedicated deployment region
# instead of their normal geographical region.
vpn_deployments_country_to_censorship_region_matcher:
  ru: russia
  cn: china
  ir: iran
  tm: turkmenistan

# Default region codes for global VPN deployments.
vpn_deployments_region_codes_global:
  europe: eu
  asia: as
  northamerica: na
  southamerica: sa
  africa: af
  oceania: oc
  unknown: zz

# Region codes for countries requiring dedicated deployments.
vpn_deployments_region_codes_censorship:
  russia: ru
  china: cn
  iran: ir
  turkmenistan: tm

# Combined region-code lookup: every deployment region's full name mapped to
# its short code, censorship regions and global regions together.
#
# Examples:
#   africa -> af
#   asia   -> as
#   russia -> ru
#   china  -> cn
vpn_deployments_region_codes: "{{ vpn_deployments_region_codes_global | combine(vpn_deployments_region_codes_censorship) }}"


# Domain naming associated with each resulting deployment region.
vpn_deployments_region_to_censorship_geo_mapping:
  europe: global
  asia: global
  northamerica: global
  southamerica: global
  africa: global
  oceania: global
  unknown: global

  russia: russia
  china: china
  iran: iran
  turkmenistan: turkmenistan


# Resolve the country into a deployment region.
#
# Priority:
#   1. Dedicated censorship-region matcher
#   2. Normal geographical-region matcher
#   3. unknown
#
# Examples:
#   ru -> russia
#   cn -> china
#   ir -> iran
#   tm -> turkmenistan
#   de -> europe
#   th -> asia
#   us -> northamerica
#   xx -> unknown
vpn_deployment_region: >-
  {{
    vpn_deployments_country_to_censorship_region_matcher.get(
      country_code | lower,
      vpn_deployments_country_to_regions_matcher.get(
        country_code | lower,
        'unknown'
      )
    )
  }}

# Resolve the deployment region into its short region code.
#
# Examples:
#   russia       -> ru
#   china        -> cn
#   europe       -> eu
#   asia         -> as
#   northamerica -> na
#   unknown      -> zz
vpn_deployment_region_code: "{{ vpn_deployments_region_codes.get(vpn_deployment_region, 'zz') }}"

# Resolve the deployment region into its censorship geo naming category.
#
# Examples:
#   europe -> global
#   asia   -> global
#   russia -> russia
#   china  -> china
vpn_deployment_censorship_geo: >-
  {{
    vpn_deployments_region_to_censorship_geo_mapping.get(
      vpn_deployment_region,
      'global'
    )
  }}

# Maps a lowercase latin letter to its regional indicator symbol,
# used to compose a country's flag emoji from its ISO 3166-1 alpha-2 code.
vpn_deployments_regional_indicator_symbols:
  a: "🇦"
  b: "🇧"
  c: "🇨"
  d: "🇩"
  e: "🇪"
  f: "🇫"
  g: "🇬"
  h: "🇭"
  i: "🇮"
  j: "🇯"
  k: "🇰"
  l: "🇱"
  m: "🇲"
  n: "🇳"
  o: "🇴"
  p: "🇵"
  q: "🇶"
  r: "🇷"
  s: "🇸"
  t: "🇹"
  u: "🇺"
  v: "🇻"
  w: "🇼"
  x: "🇽"
  y: "🇾"
  z: "🇿"

# Compose the flag emoji for `country_code`.
#
# Examples:
#   de -> 🇩🇪
#   us -> 🇺🇸
#   th -> 🇹🇭
vpn_deployment_country_flag_emoji: >-
  {{
    vpn_deployments_regional_indicator_symbols[(country_code | lower)[0]]
    ~ vpn_deployments_regional_indicator_symbols[(country_code | lower)[1]]
  }}

# Compose the flag emoji and uppercase short region code for `country_code`.
#
# Examples:
#   de -> 🇩🇪 EU
#   ru -> 🇷🇺 RU
#   kz -> 🇰🇿 AS
vpn_deployment_country_flag_with_region_code: "{{ vpn_deployment_country_flag_emoji }} {{ vpn_deployment_region_code | upper }}"

vpn_deployment_domain_prefix:
  unique:
    type: unique
    value: "{{ inventory_hostname }}"
  net_location:
    type: net-location
    value: "net-{{ vpn_deployment_region }}"
  chain_location:
    type: chain-location
    value: "chain-{{ vpn_deployment_region }}"
  net_all:
    type: net-all
    value: "net-{{ vpn_deployment_censorship_geo }}-all"
  net_protocol:
    type: net-protocol
    value: "net-{{ vpn_deployment_censorship_geo }}-{{ remna_node_primary_protocol_type.short }}"
  chain_all:
    type: chain-all
    value: "chain-{{ vpn_deployment_censorship_geo }}-all"
  chain_protocol:
    type: chain-protocol
    value: "chain-{{ vpn_deployment_censorship_geo }}-{{ remna_node_primary_protocol_type.short }}"
  other:
    type: other
    value: "other-{{ vpn_deployment_region }}"

remna_node_domain_types_allowlist: >-
  {{
    vpn_deployment_domain_prefix
    | dict2items
    | rejectattr('key', 'equalto', 'other')
    | items2dict
  }}
